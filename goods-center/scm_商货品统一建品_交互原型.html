<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商货品统一建品 · 运营平台</title>
<style>
:root{--p:#009919;--pd:#007a14;--pl:#e8f6ea;--tx:#1f2d3d;--ts:#606266;--tt:#909399;--ph:#97a8be;--bd:#dcdfe6;--bd2:#ebeef5;--th:#eef1f6;--bg:#f2f4f7;--r:#f56c6c;--rl:#fef0f0;--y:#e6a23c;--yl:#fdf6ec;--b:#409eff;--bl:#ecf5ff;--g2:#67c23a}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.6 "PingFang SC","Microsoft YaHei",-apple-system,sans-serif;color:var(--tx);background:var(--bg)}
header{height:48px;background:var(--p);color:#fff;display:flex;align-items:center;gap:36px;padding:0 20px;position:sticky;top:0;z-index:30}
.logo{font-size:24px;font-weight:900;font-style:italic;letter-spacing:-.5px}
header .sys{font-size:14px;opacity:.95}
header .rt{margin-left:auto;display:flex;gap:22px;font-size:13px;opacity:.95}
.wrap{display:flex;min-height:calc(100vh - 48px)}
aside{width:160px;flex-shrink:0;background:#fff;border-right:1px solid var(--bd2);padding-top:8px}
aside .grp{padding:10px 18px 4px;color:var(--tt);font-size:12px}
aside a{display:block;padding:9px 18px 9px 28px;color:var(--ts);text-decoration:none;cursor:default}
aside a.on{background:var(--pl);color:var(--p);border-right:2px solid var(--p)}
main{flex:1;min-width:0;padding:16px 20px 40px}
.crumb{color:var(--tt);font-size:12px;margin-bottom:10px}
.panel{background:#fff;border:1px solid var(--bd2);border-radius:4px;padding:16px 18px;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.filters .fi{display:flex;flex-direction:column;gap:5px}
.filters label{font-size:12px;color:var(--ts)}
input,select,textarea{font:inherit;color:var(--tx);border:1px solid var(--bd);border-radius:4px;height:30px;padding:0 9px;background:#fff;outline:none;width:100%}
textarea{height:auto;min-height:56px;padding:6px 9px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
input::placeholder,textarea::placeholder{color:var(--ph)}
input:disabled,select:disabled{background:#f5f7fa;color:var(--tt);cursor:not-allowed}
input.err,select.err{border-color:var(--r)}
input[type=radio],input[type=checkbox]{width:auto;height:auto;accent-color:var(--p);vertical-align:-2px;margin-right:4px}
.btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 14px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--ts);font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.pr{background:var(--p);border-color:var(--p);color:#fff}
.btn.pr:hover{background:var(--pd);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lk{color:var(--p);cursor:pointer;background:none;border:none;font:inherit;padding:0}
.lk:hover{text-decoration:underline}
.lk.dg{color:var(--r)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--bd2);margin-bottom:12px}
.tabs span{padding:8px 0;cursor:pointer;color:var(--ts);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--p);border-color:var(--p)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th{background:var(--th);color:var(--tx);font-weight:500;text-align:left;padding:9px 10px;border:1px solid var(--bd2);white-space:nowrap;font-size:12.5px}
td{padding:9px 10px;border:1px solid var(--bd2);vertical-align:middle}
tbody tr:hover>td{background:#f5f9f5}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--ts)}
.tag{display:inline-block;font-size:12px;line-height:20px;padding:0 7px;border-radius:3px;border:1px solid;white-space:nowrap}
.tg{color:var(--p);background:var(--pl);border-color:#b3e0bb}
.tgr{color:var(--tt);background:#f4f4f5;border-color:#e9e9eb}
.ty{color:var(--y);background:var(--yl);border-color:#f5dab1}
.tr{color:var(--r);background:var(--rl);border-color:#fbc4c4}
.tb{color:var(--b);background:var(--bl);border-color:#b3d8ff}
.exp{cursor:pointer;color:var(--tt);user-select:none;width:28px;text-align:center}
.sub td{background:#fafbfc}
.sub table th{background:#f3f5f8}
.pager{display:flex;justify-content:flex-end;gap:10px;align-items:center;color:var(--ts);margin-top:12px;font-size:12.5px}
/* drawer */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
.mask.on{display:block}
.dw{position:fixed;top:0;right:0;height:100vh;background:#fff;z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
.dw.on{transform:none}
#dwForm{width:80%;min-width:1100px;max-width:100vw}
#dwDetail{width:62%;min-width:900px;max-width:100vw;z-index:70}
.dw-hd{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--bd2);font-size:16px;font-weight:600}
.dw-hd .x{cursor:pointer;color:var(--tt);font-size:20px;font-weight:400}
.dw-bd{flex:1;overflow-y:auto;padding:18px 24px 30px}
.dw-ft{flex-shrink:0;border-top:1px solid var(--bd2);padding:12px 24px;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.errbar{flex-shrink:0;background:var(--rl);color:var(--r);border-top:1px solid #fbc4c4;padding:9px 24px;font-size:12.5px;display:none}
.errbar.on{display:block}
.errbar ol{margin:3px 0 0 18px}
.sec{border:1px solid var(--bd2);border-radius:4px;margin-bottom:16px}
.sec-hd{background:#f6f8fb;border-bottom:1px solid var(--bd2);padding:10px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.sec-hd .no{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--p);color:#fff;font-size:12px;align-items:center;justify-content:center;font-weight:600}
.sec-hd .tip{font-weight:400;font-size:12px;color:var(--tt)}
.sec-hd .fold{margin-left:auto;font-weight:400;font-size:12.5px}
.sec-bd{padding:16px 18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 26px}
.fr{display:flex;flex-direction:column;gap:5px;min-width:0}
.fr.full{grid-column:1/-1}
.fl{font-size:12.5px;color:var(--ts)}
.fl .rq{color:var(--r);margin-right:3px}
.fl .hint{color:var(--tt);font-size:12px;margin-left:4px}
.fh{font-size:12px;color:var(--tt);line-height:1.5}
.fe{font-size:12px;color:var(--r)}
.ro{min-height:30px;display:flex;align-items:center;padding:0 9px;background:#f5f7fa;border:1px solid var(--bd2);border-radius:4px;color:var(--ts);gap:6px}
.radios{display:flex;gap:18px;align-items:center;min-height:30px;flex-wrap:wrap}
.radios label{cursor:pointer;color:var(--tx)}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi .en{position:relative}
.bi .badge{position:absolute;right:6px;top:6px;font-size:11px;color:var(--b);background:var(--bl);padding:0 5px;border-radius:3px;line-height:18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1.5px solid var(--bd);border-radius:6px;padding:10px 14px;cursor:pointer;background:#fff}
.card.on{border-color:var(--p);background:var(--pl)}
.card.dis{cursor:not-allowed;opacity:.65}
.card b{font-size:14px}
.card.on b{color:var(--pd)}
.card p{font-size:12px;color:var(--ts);margin-top:3px}
.itbl th{background:#f7f8fa;font-size:12px;color:var(--ts)}
.itbl td{padding:6px}
.box{border:1px dashed var(--bd);border-radius:4px;padding:12px 14px;background:#fbfcfd}
.box.on{border:1px solid #b3e0bb;background:#f7fcf8}
.raw-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 18px}
.dl .k{font-size:12px;color:var(--tt)}
.dl .v{font-size:13px;word-break:break-all}
.notice{background:var(--bl);color:#4a6f99;border:1px solid #d9ecff;border-radius:4px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.warn{background:var(--yl);color:#a96a10;border:1px solid #f5dab1;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.skut{border:1px solid var(--bd2);border-radius:4px;overflow:hidden}
.skut .hd,.skut .row{display:grid;gap:8px;align-items:center;padding:7px 10px}
.skut .hd{background:#f7f8fa;color:var(--ts);font-size:12px;border-bottom:1px solid var(--bd2)}
.skut .row{border-bottom:1px solid var(--bd2)}
.skut .row:last-child{border-bottom:none}
.skut .row.off{background:#fafafa;color:var(--tt)}
.skut .rowx{grid-column:1/-1}
.cell-ro{height:30px;display:flex;align-items:center;padding:0 8px;background:#f5f7fa;border-radius:4px;color:var(--ts);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:12.5px;line-height:1.45}
.nm .en{color:var(--tt);font-size:12px}
.bom{font-size:12px;color:var(--ts);line-height:1.45}
.bom b{color:var(--tx);font-weight:500}
.tgl{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:12px;color:var(--ts)}
.tgl i{width:32px;height:18px;border-radius:10px;background:#dcdfe6;position:relative;transition:.15s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.tgl.on i{background:var(--p)}
.tgl.on i::after{transform:translateX(14px)}
.tgl.dis{cursor:not-allowed;opacity:.5}
.up{border:1px dashed var(--bd);border-radius:4px;width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tt);cursor:pointer;font-size:12px;background:#fbfdff}
.up:hover{border-color:var(--p);color:var(--p)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:96px;height:96px;border-radius:4px;background:linear-gradient(135deg,#e7efe8,#cfe3d3);display:flex;align-items:center;justify-content:center;color:#5f8a66;font-size:12px;position:relative}
.thumb .rm{position:absolute;right:3px;top:1px;cursor:pointer;color:#5f8a66}
.steps{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ts);margin-right:auto}
.steps .st{display:flex;align-items:center;gap:5px}
.steps .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.steps .st.ing .dot{border-color:var(--p);border-top-color:transparent;animation:sp .8s linear infinite}
.steps .st.ok{color:var(--p)}
.steps .st.ok .dot{background:var(--p);border-color:var(--p);color:#fff}
.steps .st.fail{color:var(--r)}
.steps .st.fail .dot{background:var(--r);border-color:var(--r);color:#fff}
.steps .ar{color:var(--bd)}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#f0f9eb;color:var(--g2);border:1px solid #e1f3d8;padding:9px 18px;border-radius:4px;z-index:100;display:none;font-size:13px}
.toast.e{background:var(--rl);color:var(--r);border-color:#fde2e2}
.dsec{margin-bottom:18px}
.dsec h4{font-size:14px;margin-bottom:10px;padding-left:8px;border-left:3px solid var(--p)}
.confirm{background:var(--yl);border:1px solid #f5dab1;border-radius:4px;padding:8px 10px;font-size:12px;color:#a96a10;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;top:34px;left:0;background:#fff;border:1px solid var(--bd2);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.1);z-index:20;min-width:210px;padding:4px 0;display:none}
.dd.on .dd-menu{display:block}
.dd-menu .g{padding:6px 14px 2px;font-size:12px;color:var(--tt)}
.dd-menu a{display:block;padding:6px 14px;color:var(--tx);cursor:pointer}
.dd-menu a:hover{background:var(--pl);color:var(--p)}
.dd-menu a.dis{color:var(--ph);cursor:not-allowed;background:none}
#dwBatch{width:70%;min-width:960px;max-width:100vw;z-index:80}
.res-ok{color:var(--p)}.res-skip{color:var(--tt)}.res-err{color:var(--r)}
.stepbar{display:flex;gap:10px;margin-bottom:16px}
.stepbar span{flex:1;text-align:center;padding:7px;border-radius:4px;background:#f5f7fa;color:var(--tt);font-size:12.5px}
.stepbar span.on{background:var(--pl);color:var(--pd);font-weight:600}
.selbar{background:var(--pl);color:var(--pd);border-radius:4px;padding:6px 12px;font-size:12.5px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
/* 仅作用于商品详情新内容与独立修改弹窗 */
.pd-change-tag{display:inline-block;padding:0 5px;margin-left:5px;border:1px solid #e8c98b;background:#fff8e8;color:#a56a13;border-radius:3px;font-size:11px;line-height:18px;vertical-align:middle}
.pd-section{margin-bottom:22px}
.pd-heading{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.pd-heading h4{border-left:3px solid var(--p);padding-left:9px;font-size:14px;margin:0}
.pd-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px}
.pd-field{min-width:0}
.pd-full{grid-column:1/-1}.pd-half{grid-column:span 2}
.pd-label{font-size:12px;color:var(--tt);line-height:1.6}
.pd-value{font-size:13px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}
.pd-value .pd-table-scroll{white-space:normal}
.pd-empty{color:var(--tt)}
.pd-images{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.pd-images img{width:64px;height:64px;object-fit:contain;border:1px solid var(--bd2);border-radius:3px}
.pd-sku-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pd-sku-tabs .btn{padding:4px 12px}
.btn.pd-active{border-color:var(--p);color:var(--p);background:#f2faf3}
.pd-stock-actions{display:flex;align-items:center;gap:24px;margin:0 0 18px}
.pd-segment{display:flex;gap:8px;align-items:center}.pd-segment .btn{border-radius:4px;padding:4px 12px}
.pd-table-scroll{overflow-x:auto}
.pd-table-scroll table{width:100%;border-collapse:collapse;margin:0}

.pd-table-scroll td{white-space:nowrap}
.pd-inventory table{min-width:800px}.pd-inventory th:first-child{width:39%}.pd-inventory td.pd-warehouse{color:var(--tx);font-family:inherit;font-size:inherit;font-weight:400;white-space:normal;min-width:245px}
.pd-sales table{min-width:1260px}.pd-deposit{margin-left:auto;color:#7c8580;font-size:13px}.pd-deposit b{margin-left:18px;color:var(--tx);font-weight:400}
.pd-no-data{text-align:center;color:var(--tt);padding:28px!important}
#pdEditor{position:fixed;inset:0;margin:auto;border:1px solid var(--bd);border-radius:6px;width:min(1060px,94vw);max-height:88vh;padding:0;color:var(--tx);background:white;box-shadow:0 8px 35px #0002}
#pdEditor::backdrop{background:#0005}#pdEditForm{display:flex;flex-direction:column;max-height:88vh}
.pd-editor-head,.pd-editor-foot{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd2);flex-shrink:0}
.pd-editor-foot{border-top:1px solid var(--bd2);border-bottom:0;justify-content:flex-end;gap:10px}.pd-editor-head .lk{font-size:22px}
#pdEditBody{padding:20px 22px;overflow:auto}#pdEditBody>.btn{margin-top:16px}#pdEditBody input[type=number]{width:110px}#pdEditBody td select{min-width:120px}#pdEditBody td:first-child select{width:280px}.pd-quote-edit{padding:0 0 22px}.pd-quote-edit h4{margin-bottom:14px}
@media(max-width:900px){.pd-fields{grid-template-columns:repeat(2,minmax(0,1fr))}#dwDetail:has(.pd-product){width:100%;min-width:0}.pd-deposit{margin-left:0}#pdEditBody .g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.pd-fields{grid-template-columns:1fr}.pd-half{grid-column:auto}#pdEditBody .g3{grid-template-columns:1fr}.pd-stock-actions{gap:12px;flex-wrap:wrap}}


/* B端详情：对齐、可见上下文与长表格浏览 */
.pd-fields{row-gap:12px}
.pd-label{margin-bottom:2px}
.pd-images img{width:52px;height:52px}
.pd-certificate{margin-top:0}.pd-certificate img{display:none}.pd-certificate a{display:inline-flex;align-items:center;gap:10px;color:var(--tx);font-size:13px;text-decoration:none;min-height:22px}
.pd-sku-area{position:relative}
.pd-sku-bar{position:sticky;top:-18px;z-index:6;background:#fff;padding:10px 0 12px;margin:0 0 14px;border-bottom:1px solid var(--bd2)}
.pd-sku-bar .pd-heading{margin-bottom:8px}.pd-sku-bar .pd-sku-tabs{margin:0;flex-wrap:nowrap;overflow-x:auto;padding:1px 0 2px}.pd-sku-tabs .btn{flex-shrink:0}
.pd-current-code{margin-left:auto;color:var(--ts);font-size:12px;font-weight:400;overflow-wrap:anywhere}
.pd-stock-actions{gap:16px;margin-bottom:10px;flex-wrap:wrap}.pd-segment .btn{padding:4px 12px}
.pd-warehouse-count{margin-left:auto;color:var(--tt);font-size:12px}
.pd-inventory{max-height:246px;overflow:auto;scrollbar-gutter:stable}
.pd-inventory table,.pd-sales table{border-collapse:separate;border-spacing:0}
.pd-inventory th,.pd-inventory td,.pd-sales th,.pd-sales td{border-width:0 1px 1px 0}
.pd-inventory th,.pd-sales th{border-top:1px solid var(--bd2)}
.pd-inventory th:first-child,.pd-inventory td:first-child,.pd-sales th:first-child,.pd-sales td:first-child{border-left:1px solid var(--bd2)}
.pd-inventory th{position:sticky;top:0;z-index:2;background:var(--th)}
.pd-inventory th:nth-child(n+3),.pd-inventory td:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.pd-sales th:nth-child(n+3):nth-child(-n+8),.pd-sales td:nth-child(n+3):nth-child(-n+8){text-align:right;font-variant-numeric:tabular-nums}
.pd-sales th:first-child,.pd-sales td:first-child{position:sticky;left:0;z-index:1;min-width:210px;max-width:240px;white-space:normal;box-shadow:2px 0 0 var(--bd2);background:#fff}
.pd-sales th:first-child{background:var(--th);z-index:2}
.pd-table-scroll:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@media(max-width:560px){.pd-current-code{margin-left:0;flex-basis:100%}.pd-sales th:first-child,.pd-sales td:first-child{min-width:145px;max-width:145px}.pd-warehouse-count{margin-left:0}.pd-sku-bar{padding-top:8px}}


.pd-images{display:grid;grid-template-columns:repeat(4,minmax(0,44px));gap:6px;align-items:start;max-width:194px}
.pd-images a{display:block;min-width:0}.pd-images img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}
.pd-images:not(.pd-certificate) a:nth-child(n+4){display:none}
.pd-media-more{width:100%;aspect-ratio:1;border:1px solid var(--bd);border-radius:3px;background:#f7f8fa;color:var(--ts);font:inherit;cursor:pointer}
.pd-media-more:hover{border-color:var(--p);color:var(--p)}

.pd-ai-images{grid-template-columns:repeat(2,minmax(0,80px));max-width:166px;gap:10px 6px}
.pd-ai-image{min-width:0}
.pd-ai-images .pd-ai-image>a{display:block;width:44px;margin:0 auto}
.pd-ai-actions{display:flex;justify-content:center;gap:4px;margin-top:6px}
.pd-ai-actions button{padding:2px 5px;border:1px solid var(--bd);border-radius:3px;background:#fff;color:var(--p);font:inherit;font-size:12px;line-height:20px;white-space:nowrap;cursor:pointer}
.pd-ai-actions button:hover{border-color:var(--p);background:#f0faf1}
.pd-ai-actions button:focus-visible{outline:2px solid var(--p);outline-offset:2px}

.pd-certificate{display:flex;max-width:none}.pd-certificate a{display:inline-flex}.pd-certificate img{display:none}
#pdImageViewer{margin:auto;border:1px solid var(--bd);border-radius:6px;padding:0;width:min(760px,94vw);max-height:94vh;background:#fff;color:var(--tx)}
#pdImageViewer::backdrop{background:#0006}
.pd-gallery-head,.pd-gallery-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px}

function offRow(i){const r=F.rows[i];r._prev={status:r.status,itemStatus:r.itemStatus,bomStatus:r.bomStatus};r.status='已下架';r.itemStatus='停用';r.bomStatus='废弃';F.confirmOff=-1;r._off=true;renderForm()}

function validate(){const e=[];const z=zhErr(F.name),en=enErr(F.en);if(z)e.push(z);if(en)e.push(en);
  if(!F.cat)e.push('请选择货品类目');else if(!prodCat(F.cat))e.push('该货品类目还没配商品类目映射，不能提交');if(PARTS[F.cat]&&!F.part)e.push('请选择商品部位');

  if(kind==='vendor'&&!Object.values(v.vendor).some(Boolean)){toast('至少给一个仓库选供应商',true);return}
  targets(kind).filter(x=>!x.skip).forEach(x=>{const r=x.ref;
    if(kind==='shelfOn'){r.k.status='在售';log(r.s,'商品',r.k.sku,'批量上架');syncSpuStatus(r.s)}
    if(kind==='shelfOff'){r.k.status='已下架';log(r.s,'商品',r.k.sku,'批量下架');syncSpuStatus(r.s)}
    if(kind==='valid'){Object.assign(r.s.base,{validP:v.validP,period:v.validP==='是'?v.period:'',periodUnit:v.periodUnit});log(r.s,'商品',r.s.spu,'批量设置效期管理（货品同步）')}
    const L=(act)=>{(r.t==='raw'?spusOfRaw(r.o.code):[r.s]).forEach(s=>log(s,'货品',x.code,act))};
    if(kind==='itemOn'){r.o.status='启用';L('批量启用')}
    if(kind==='itemOff'){r.o.status='停用';L('批量停用');if(r.t==='std')r.s.skus.forEach(k=>{if(k.status==='在售'){k.status='已下架';log(r.s,'商品',k.sku,'下架（货品停用联动）')}});if(r.s)syncSpuStatus(r.s)}
    if(kind==='purchY'){r.o.purch='是';L('批量设为可采')}
    if(kind==='purchN'){r.o.purch='否';L('批量设为不可采')}
    if(kind==='vendor'){const e=ext(r.o);WAREHOUSES.forEach(w=>{if(v.vendor[w])e.vendor[w]=v.vendor[w]});L('批量设置默认供应商')}
    if(kind==='over'){const e=ext(r.o);e.over=WAREHOUSES.map(w=>({wh:w,rate:v.over[w]}));L('批量设置入仓超收')}
    if(kind==='qc'){const e=ext(r.o);if(v.fee!=='')e.fee=v.fee;if(v.rej!=='')e.rej=v.rej;L('批量设置质检扣点/拒收下限')}});
  B.done=true;toast('批量修改完成');renderList();renderBatch()}

 if(el.dataset.key==='unitNet'&&el.value!==''&&el.validity.valid){pdReprice(r);for(const key of ['unitGross','priceNet','priceGross'])el.closest('tr').querySelector('[data-derived="'+key+'"]').textContent=pdMoney(r[key],key==='unitGross'?pdUnitDigits(r):2);}
});
$('pdEditBody').addEventListener('change',e=>{
 const el=e.target;if(el.matches('[data-pd-check]')){const i=Number(el.dataset.pdCheck);PD_EDIT.selected=el.checked?[...new Set([...PD_EDIT.selected,i])]:PD_EDIT.selected.filter(v=>v!==i);const all=$('pdEditBody').querySelector('[data-pd-all]');all.checked=PD_EDIT.rows.length===PD_EDIT.selected.length;all.indeterminate=PD_EDIT.selected.length>0&&!all.checked;}
 if(el.matches('[data-pd-all]')){PD_EDIT.selected=el.checked?PD_EDIT.rows.map((_,i)=>i):[];for(const cb of $('pdEditBody').querySelectorAll('[data-pd-check]'))cb.checked=el.checked;}
});
function pdCancel(){pdModal.close();PD_EDIT=null;}
pdModal.addEventListener('cancel',e=>{e.preventDefault();pdCancel();});
$('pdEditForm').addEventListener('submit',e=>{
 e.preventDefault();if(!$('pdEditForm').reportValidity())return;pdReadDraft();const d=PD_EDIT;
 if(d.kind==='sales'&&d.rows.some(r=>r.onTime&&r.offTime&&r.offTime<=r.onTime)){$('pdEditMessage').textContent='下架时间必须晚于上架时间。';return;}
 const s=SPUS.find(v=>v.spu===d.spu),k=s?.skus.find(v=>v.sku===d.sku);if(!k){$('pdEditMessage').textContent='该规格已不存在，请关闭后重新打开详情。';return;}
 const rows=structuredClone(d.rows);for(const r of rows){delete r._taxFactor;if(d.kind==='sales'&&Number(r.daily)===0)r.daily='';}
 k[d.key]=rows;log(s,'商品',k.sku,d.kind==='sales'?'修改销售信息':d.key==='inventories'?'修改销售库存':'修改预售库存');
 const scroll=d.scroll;pdCancel();openDetail(SPUS.indexOf(s),'商品');$('dBody').scrollTop=scroll;toast('已保存');
});

const pdImageDialog=document.createElement('dialog');pdImageDialog.id='pdImageViewer';pdImageDialog.setAttribute('aria-labelledby','pdGalleryTitle');
pdImageDialog.innerHTML=`<div class="pd-gallery-head"><strong id="pdGalleryTitle">图片预览</strong><button class="lk" aria-label="关闭图片预览" onclick="pdImageDialog.close()">关闭</button></div><div class="pd-gallery-image"><img alt="图片预览"></div><div class="pd-gallery-foot"><button class="btn" id="pdGalleryPrev" onclick="pdGalleryMove(-1)">上一张</button><span id="pdGalleryCount" aria-live="polite"></span><button class="btn" id="pdGalleryNext" onclick="pdGalleryMove(1)">下一张</button></div>`;
document.body.appendChild(pdImageDialog);
let PD_GALLERY={urls:[],index:0,title:''};
function pdGalleryDraw(){const g=PD_GALLERY,img=pdImageDialog.querySelector('img');img.src=g.urls[g.index];img.alt=g.title+' 第 '+(g.index+1)+' 张';$('pdGalleryTitle').textContent=g.title;$('pdGalleryCount').textContent='第 '+(g.index+1)+' 张 / 共 '+g.urls.length+' 张';$('pdGalleryPrev').disabled=g.index===0;$('pdGalleryNext').disabled=g.index===g.urls.length-1;}
function pdGalleryMove(offset){PD_GALLERY.index=Math.max(0,Math.min(PD_GALLERY.urls.length-1,PD_GALLERY.index+offset));pdGalleryDraw();}
pdImageDialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();pdGalleryMove(e.key==='ArrowLeft'?-1:1);}});
document.addEventListener('click',e=>{const target=e.target.closest('.pd-images a,.pd-media-more');if(!target)return;e.preventDefault();const group=target.closest('.pd-images');PD_GALLERY={urls:[...group.querySelectorAll('a img')].map(img=>img.src),index:target.matches('.pd-media-more')?3:Number(target.dataset.imageIndex||0),title:group.closest('.pd-field')?.querySelector('.pd-label')?.textContent||'图片预览'};pdGalleryDraw();pdImageDialog.showModal();});

renderList();
</script>
<script>
let creationFlowScale=1,creationListScroll=0,creationPageActive=false;
function openCreationFlow(){if(location.hash==='#creation-flow')return;creationListScroll=window.scrollY;location.hash='creation-flow';}
function returnToProductList(){location.hash='product-list';}
function renderCreationRoute(){
 const active=location.hash==='#creation-flow';
 if(active&&!creationPageActive)creationListScroll=window.scrollY;
 document.getElementById('creationFlowPage').hidden=!active;
 document.getElementById('productListPage').hidden=active;
 document.getElementById('productListNav').classList.toggle('on',!active);
 const entry=document.querySelector('.creation-flow-entry');
 if(active)entry.setAttribute('aria-current','page');else entry.removeAttribute('aria-current');
 document.title=active?'建品逻辑 · 自营品创建流程':'商货品统一建品 · 运营平台';
 if(active&&!creationPageActive){zoomCreationFlow(0);window.scrollTo(0,0);document.getElementById('creationFlowHeading').focus({preventScroll:true});}
 else if(!active&&creationPageActive)requestAnimationFrame(()=>window.scrollTo(0,creationListScroll));
 creationPageActive=active;
}
function zoomCreationFlow(delta){creationFlowScale=delta===0?1:Math.min(2.5,Math.max(.75,creationFlowScale+delta));document.querySelector('.creation-flow-canvas').style.setProperty('--creation-flow-scale',creationFlowScale);}
window.addEventListener('hashchange',renderCreationRoute);renderCreationRoute();

/* ============ 商货品库存列表：字段照 SCM 货品库存页 h5-ddxm-intl-scm src/views/warehouse/components/product-inventory.vue ============ */
let IV_OPEN={};
const WH_CODE={'SG 大仓':'WH-SG01','SG 冷库':'WH-SG02'};
function hnum(str,mod){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%100000;return h%mod}
const r2n=v=>+Number(v).toFixed(2);
/* 一个货品一行：非标品按原料汇总（未加工原料 + 已加工成品折合），标品按货品 */
function invGroups(){const out=[];
  RAWS.forEach(r=>{const users=spusOfRaw(r.code).filter(x=>x.src==='自营');if(!users.length)return;
    WAREHOUSES.forEach(w=>{const rawQty=hnum(r.code+w,400)+20,rawOut=hnum(w+r.code,25);
      const fins=users.flatMap(s=>s.skus.map(k=>{const q=hnum(k.item+w,120),fo=hnum(w+k.item,Math.floor(q/5)+1),per=Number(k.qty);
        return{spu:s,code:k.item,name:skuNameOf(s,k),per,unitPack:k.su,qty:q,out:fo,avail:Math.max(0,q-fo),fold:r2n(q*per),status:k.itemStatus||'启用'}}));
      const fold=r2n(fins.reduce((a,f)=>a+f.fold,0)),foldAvail=r2n(fins.reduce((a,f)=>a+f.avail*f.per,0)),foldOut=r2n(fins.reduce((a,f)=>a+f.out*f.per,0));
      out.push({key:r.code+'|'+w,attr:'非标品',wh:w,code:r.code,name:r.name,spus:users,cat:r.cat,unit:r.unit,raw:rawQty,fold,total:r2n(rawQty+fold),avail:r2n(rawQty-rawOut+foldAvail),out:r2n(rawOut+foldOut),price:2.8,fins})})});
  SPUS.filter(s=>s.src==='自营'&&s.attr==='标品').forEach(s=>WAREHOUSES.forEach(w=>{const d=s.std,q=hnum(d.item+w,300),oq=hnum(w+d.item,Math.floor(q/5)+1);
    out.push({key:d.item+'|'+w,attr:'标品',wh:w,code:d.item,name:s.name,spus:[s],cat:s.cat,unit:d.stockUnit,raw:null,fold:q,total:q,avail:Math.max(0,q-oq),out:oq,price:1.85*(d.stockIsPack==='否'?Number(d.packQty||1):1),fins:[]})}));
  return out.sort((a,b)=>(a.spus[0].name+a.wh)<(b.spus[0].name+b.wh)?-1:1)}
const money2=v=>v==null?'—':'S$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function ivFiltered(){const q=id=>($(id).value||'').trim();
  return invGroups().filter(g=>(!q('ivWh')||g.wh===q('ivWh'))&&(!q('ivCat')||g.cat===q('ivCat'))&&(!q('ivAttr')||g.attr===q('ivAttr'))&&(!q('ivSpu')||g.spus.some(s=>has(s.name,q('ivSpu'))))
    &&(!q('ivItem')||has(g.code,q('ivItem'))||has(g.name,q('ivItem'))||g.fins.some(f=>has(f.code,q('ivItem'))||has(f.name,q('ivItem')))))}
function renderInv(){const rows=ivFiltered(),tax=1.09;
  $('ivSum').innerHTML=`共 ${rows.length} 行 &nbsp; 库存总货值（含税）：${money2(rows.reduce((a,g)=>a+g.total*g.price*tax,0))}`;
  const H=['','仓库','货品编码','货品名称','商品属性','所属商品','未加工原料','已加工成品（折合）','合计库存','可用库存','待出库','单位','库存货值（含税）','操作'];
  const tn=v=>`<td style="text-align:right" class="mono">${v}</td>`;
  let h=`<thead><tr>${H.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`;
  if(!rows.length)h+=`<tr><td colspan="${H.length}" style="text-align:center;color:var(--tt);padding:40px">暂无数据</td></tr>`;
  rows.forEach(g=>{const op=IV_OPEN[g.key],ns=g.attr==='非标品';
    h+=`<tr><td class="exp" ${ns?`onclick="IV_OPEN['${g.key}']=!IV_OPEN['${g.key}'];renderInv()"`:''}>${ns?(op?'▾':'▸'):''}</td><td>${g.wh}</td><td class="mono">${g.code}</td><td><b style="font-weight:500">${esc(g.name)}</b></td><td>${ns?'<span class="tag tb">非标品</span>':'<span class="tag tg">标品</span>'}</td><td>${g.spus.map(s=>esc(s.name)).join('、')}</td>
      ${tn(ns?g.raw:'—')}${tn(ns?g.fold:'—')}<td style="text-align:right" class="mono"><b>${g.total}</b></td>${tn(g.avail)}${tn(g.out)}<td>${g.unit}</td>${tn(money2(g.total*g.price*tax))}<td><button class="lk" onclick="toast('（原型）查看库存流水：${g.code} · ${g.wh}')">流水</button></td></tr>`;
    if(ns&&op)h+=`<tr class="sub"><td></td><td colspan="${H.length-1}" style="padding:8px 10px"><table><thead><tr><th>成品货品编码</th><th>成品名称</th><th>所属商品</th><th>每份用原料</th><th>成品库存</th><th>成品可用库存</th><th>成品待出库</th><th>成品单位</th><th>折合原料</th><th>成品状态</th></tr></thead><tbody>`+
      `<tr style="background:#f7faff"><td class="mono">${g.code}</td><td>${esc(g.name)}（未加工）</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td class="mono" style="text-align:right">${g.raw} ${g.unit}</td><td>—</td></tr>`+
      g.fins.map(f=>`<tr><td class="mono">${f.code}</td><td>${esc(f.name)}</td><td>${esc(f.spu.name)}</td><td class="mono">${f.per} ${g.unit}</td><td class="mono" style="text-align:right">${f.qty}</td><td class="mono" style="text-align:right">${f.avail}</td><td class="mono" style="text-align:right">${f.out}</td><td>${f.unitPack}</td><td class="mono" style="text-align:right">${f.fold} ${g.unit}</td><td>${f.status==='停用'?'<span class="tag tgr">停用</span>':f.status==='待启用'?'<span class="tag ty">待启用</span>':'<span class="tag tg">启用</span>'}</td></tr>`).join('')+
      `<tr><td colspan="8" style="text-align:right;color:var(--ts)">合计（原料口径）</td><td class="mono" style="text-align:right"><b>${g.total} ${g.unit}</b></td><td></td></tr></tbody></table></td></tr>`});
  $('ivTable').innerHTML=h+'</tbody>'}
function ivExpandAll(){const all=ivFiltered().filter(g=>g.attr==='非标品');const on=!all.every(g=>IV_OPEN[g.key]);all.forEach(g=>IV_OPEN[g.key]=on);renderInv()}
function resetInv(){['ivWh','ivCat','ivAttr','ivSpu','ivItem'].forEach(i=>$(i).value='');renderInv()}
function renderInvRoute(){const on=location.hash==='#item-inventory';$('inventoryPage').hidden=!on;
  if(on){$('productListPage').hidden=true;$('creationFlowPage').hidden=true;$('productListNav').classList.remove('on');renderInv()}
  $('invNav').classList.toggle('on',on)}
$('ivWh').innerHTML='<option value="">全部</option>'+WAREHOUSES.map(w=>`<option>${w}</option>`).join('');
$('ivCat').innerHTML='<option value="">全部</option>'+CATS.map(g=>`<optgroup label="${g.g}">`+g.items.map(c=>`<option value="${c}">${g.g} / ${c}</option>`).join('')+'</optgroup>').join('');
window.addEventListener('hashchange',renderInvRoute);renderInvRoute();

</script></body>
</html>
