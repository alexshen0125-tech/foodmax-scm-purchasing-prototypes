<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商货品统一建品 · 运营平台</title>
<style>
:root{--p:#009919;--pd:#007a14;--pl:#e8f6ea;--tx:#1f2d3d;--ts:#606266;--tt:#909399;--ph:#97a8be;--bd:#dcdfe6;--bd2:#ebeef5;--th:#eef1f6;--bg:#f2f4f7;--r:#f56c6c;--rl:#fef0f0;--y:#e6a23c;--yl:#fdf6ec;--b:#409eff;--bl:#ecf5ff;--g2:#67c23a}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.6 "PingFang SC","Microsoft YaHei",-apple-system,sans-serif;color:var(--tx);background:var(--bg)}
header{height:48px;background:var(--p);color:#fff;display:flex;align-items:center;gap:36px;padding:0 20px;position:sticky;top:0;z-index:30}
.logo{font-size:24px;font-weight:900;font-style:italic;letter-spacing:-.5px}
header .sys{font-size:14px;opacity:.95}
header .rt{margin-left:auto;display:flex;gap:22px;font-size:13px;opacity:.95}
.wrap{display:flex;min-height:calc(100vh - 48px)}
aside{width:160px;flex-shrink:0;background:#fff;border-right:1px solid var(--bd2);padding-top:8px}
aside .grp{padding:10px 18px 4px;color:var(--tt);font-size:12px}
aside a{display:block;padding:9px 18px 9px 28px;color:var(--ts);text-decoration:none;cursor:default}
aside a.on{background:var(--pl);color:var(--p);border-right:2px solid var(--p)}
main{flex:1;min-width:0;padding:16px 20px 40px}
.crumb{color:var(--tt);font-size:12px;margin-bottom:10px}
.panel{background:#fff;border:1px solid var(--bd2);border-radius:4px;padding:16px 18px;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.filters .fi{display:flex;flex-direction:column;gap:5px}
.filters label{font-size:12px;color:var(--ts)}
input,select,textarea{font:inherit;color:var(--tx);border:1px solid var(--bd);border-radius:4px;height:30px;padding:0 9px;background:#fff;outline:none;width:100%}
textarea{height:auto;min-height:56px;padding:6px 9px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
input::placeholder,textarea::placeholder{color:var(--ph)}
input:disabled,select:disabled{background:#f5f7fa;color:var(--tt);cursor:not-allowed}
input.err,select.err{border-color:var(--r)}
input[type=radio],input[type=checkbox]{width:auto;height:auto;accent-color:var(--p);vertical-align:-2px;margin-right:4px}
.btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 14px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--ts);font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.pr{background:var(--p);border-color:var(--p);color:#fff}
.btn.pr:hover{background:var(--pd);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lk{color:var(--p);cursor:pointer;background:none;border:none;font:inherit;padding:0}
.lk:hover{text-decoration:underline}
.lk.dg{color:var(--r)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--bd2);margin-bottom:12px}
.tabs span{padding:8px 0;cursor:pointer;color:var(--ts);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--p);border-color:var(--p)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th{background:var(--th);color:var(--tx);font-weight:500;text-align:left;padding:9px 10px;border:1px solid var(--bd2);white-space:nowrap;font-size:12.5px}
td{padding:9px 10px;border:1px solid var(--bd2);vertical-align:middle}
tbody tr:hover>td{background:#f5f9f5}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--ts)}
.tag{display:inline-block;font-size:12px;line-height:20px;padding:0 7px;border-radius:3px;border:1px solid;white-space:nowrap}
.tg{color:var(--p);background:var(--pl);border-color:#b3e0bb}
.tgr{color:var(--tt);background:#f4f4f5;border-color:#e9e9eb}
.ty{color:var(--y);background:var(--yl);border-color:#f5dab1}
.tr{color:var(--r);background:var(--rl);border-color:#fbc4c4}
.tb{color:var(--b);background:var(--bl);border-color:#b3d8ff}
.exp{cursor:pointer;color:var(--tt);user-select:none;width:28px;text-align:center}
.sub td{background:#fafbfc}
.sub table th{background:#f3f5f8}
.pager{display:flex;justify-content:flex-end;gap:10px;align-items:center;color:var(--ts);margin-top:12px;font-size:12.5px}
/* drawer */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
.mask.on{display:block}
.dw{position:fixed;top:0;right:0;height:100vh;background:#fff;z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
.dw.on{transform:none}
#dwForm{width:80%;min-width:1100px;max-width:100vw}
#dwDetail{width:62%;min-width:900px;max-width:100vw;z-index:70}
.dw-hd{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--bd2);font-size:16px;font-weight:600}
.dw-hd .x{cursor:pointer;color:var(--tt);font-size:20px;font-weight:400}
.dw-bd{flex:1;overflow-y:auto;padding:18px 24px 30px}
.dw-ft{flex-shrink:0;border-top:1px solid var(--bd2);padding:12px 24px;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.errbar{flex-shrink:0;background:var(--rl);color:var(--r);border-top:1px solid #fbc4c4;padding:9px 24px;font-size:12.5px;display:none}
.errbar.on{display:block}
.errbar ol{margin:3px 0 0 18px}
.sec{border:1px solid var(--bd2);border-radius:4px;margin-bottom:16px}
.sec-hd{background:#f6f8fb;border-bottom:1px solid var(--bd2);padding:10px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.sec-hd .no{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--p);color:#fff;font-size:12px;align-items:center;justify-content:center;font-weight:600}
.sec-hd .tip{font-weight:400;font-size:12px;color:var(--tt)}
.sec-hd .fold{margin-left:auto;font-weight:400;font-size:12.5px}
.sec-bd{padding:16px 18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 26px}
.fr{display:flex;flex-direction:column;gap:5px;min-width:0}
.fr.full{grid-column:1/-1}
.fl{font-size:12.5px;color:var(--ts)}
.fl .rq{color:var(--r);margin-right:3px}
.fl .hint{color:var(--tt);font-size:12px;margin-left:4px}
.fh{font-size:12px;color:var(--tt);line-height:1.5}
.fe{font-size:12px;color:var(--r)}
.ro{min-height:30px;display:flex;align-items:center;padding:0 9px;background:#f5f7fa;border:1px solid var(--bd2);border-radius:4px;color:var(--ts);gap:6px}
.radios{display:flex;gap:18px;align-items:center;min-height:30px;flex-wrap:wrap}
.radios label{cursor:pointer;color:var(--tx)}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi .en{position:relative}
.bi .badge{position:absolute;right:6px;top:6px;font-size:11px;color:var(--b);background:var(--bl);padding:0 5px;border-radius:3px;line-height:18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1.5px solid var(--bd);border-radius:6px;padding:10px 14px;cursor:pointer;background:#fff}
.card.on{border-color:var(--p);background:var(--pl)}
.card.dis{cursor:not-allowed;opacity:.65}
.card b{font-size:14px}
.card.on b{color:var(--pd)}
.card p{font-size:12px;color:var(--ts);margin-top:3px}
.itbl th{background:#f7f8fa;font-size:12px;color:var(--ts)}
.itbl td{padding:6px}
.box{border:1px dashed var(--bd);border-radius:4px;padding:12px 14px;background:#fbfcfd}
.box.on{border:1px solid #b3e0bb;background:#f7fcf8}
.raw-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 18px}
.dl .k{font-size:12px;color:var(--tt)}
.dl .v{font-size:13px;word-break:break-all}
.notice{background:var(--bl);color:#4a6f99;border:1px solid #d9ecff;border-radius:4px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.warn{background:var(--yl);color:#a96a10;border:1px solid #f5dab1;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.skut{border:1px solid var(--bd2);border-radius:4px;overflow:hidden}
.skut .hd,.skut .row{display:grid;gap:8px;align-items:center;padding:7px 10px}
.skut .hd{background:#f7f8fa;color:var(--ts);font-size:12px;border-bottom:1px solid var(--bd2)}
.skut .row{border-bottom:1px solid var(--bd2)}
.skut .row:last-child{border-bottom:none}
.skut .row.off{background:#fafafa;color:var(--tt)}
.skut .rowx{grid-column:1/-1}
.cell-ro{height:30px;display:flex;align-items:center;padding:0 8px;background:#f5f7fa;border-radius:4px;color:var(--ts);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:12.5px;line-height:1.45}
.nm .en{color:var(--tt);font-size:12px}
.bom{font-size:12px;color:var(--ts);line-height:1.45}
.bom b{color:var(--tx);font-weight:500}
.tgl{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:12px;color:var(--ts)}
.tgl i{width:32px;height:18px;border-radius:10px;background:#dcdfe6;position:relative;transition:.15s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.tgl.on i{background:var(--p)}
.tgl.on i::after{transform:translateX(14px)}
.tgl.dis{cursor:not-allowed;opacity:.5}
.up{border:1px dashed var(--bd);border-radius:4px;width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tt);cursor:pointer;font-size:12px;background:#fbfdff}
.up:hover{border-color:var(--p);color:var(--p)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:96px;height:96px;border-radius:4px;background:linear-gradient(135deg,#e7efe8,#cfe3d3);display:flex;align-items:center;justify-content:center;color:#5f8a66;font-size:12px;position:relative}
.thumb .rm{position:absolute;right:3px;top:1px;cursor:pointer;color:#5f8a66}
.steps{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ts);margin-right:auto}
.steps .st{display:flex;align-items:center;gap:5px}
.steps .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.steps .st.ing .dot{border-color:var(--p);border-top-color:transparent;animation:sp .8s linear infinite}
.steps .st.ok{color:var(--p)}
.steps .st.ok .dot{background:var(--p);border-color:var(--p);color:#fff}
.steps .st.fail{color:var(--r)}
.steps .st.fail .dot{background:var(--r);border-color:var(--r);color:#fff}
.steps .ar{color:var(--bd)}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#f0f9eb;color:var(--g2);border:1px solid #e1f3d8;padding:9px 18px;border-radius:4px;z-index:100;display:none;font-size:13px}
.toast.e{background:var(--rl);color:var(--r);border-color:#fde2e2}
.dsec{margin-bottom:18px}
.dsec h4{font-size:14px;margin-bottom:10px;padding-left:8px;border-left:3px solid var(--p)}
.confirm{background:var(--yl);border:1px solid #f5dab1;border-radius:4px;padding:8px 10px;font-size:12px;color:#a96a10;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;top:34px;left:0;background:#fff;border:1px solid var(--bd2);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.1);z-index:20;min-width:210px;padding:4px 0;display:none}
.dd.on .dd-menu{display:block}
.dd-menu .g{padding:6px 14px 2px;font-size:12px;color:var(--tt)}
.dd-menu a{display:block;padding:6px 14px;color:var(--tx);cursor:pointer}
.dd-menu a:hover{background:var(--pl);color:var(--p)}
.dd-menu a.dis{color:var(--ph);cursor:not-allowed;background:none}
#dwBatch{width:70%;min-width:960px;max-width:100vw;z-index:80}
.res-ok{color:var(--p)}.res-skip{color:var(--tt)}.res-err{color:var(--r)}
.stepbar{display:flex;gap:10px;margin-bottom:16px}
.stepbar span{flex:1;text-align:center;padding:7px;border-radius:4px;background:#f5f7fa;color:var(--tt);font-size:12.5px}
.stepbar span.on{background:var(--pl);color:var(--pd);font-weight:600}
.selbar{background:var(--pl);color:var(--pd);border-radius:4px;padding:6px 12px;font-size:12.5px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
</style>
</head>
<body>
<header><span class="logo">Foodmax</span><span class="sys">运营平台</span><div class="rt"><span>小满新加坡(SG Xiaoman) ⌄</span><span>简体中文 ⌄</span><span>货币：SGD</span></div></header>
<div class="wrap">
<aside>
  <div class="grp">数据看板</div><a>店铺经营指标</a>
  <div class="grp">店铺</div><a>店铺管理</a>
  <div class="grp">订单</div><a>商家订单</a>
  <div class="grp">商品</div><a>同品管理</a><a class="on">商品列表</a><a>商品审批</a><a>后台类目</a><a>前台类目</a>
  <div class="grp">商家</div><a>商家管理</a>
</aside>
<main>
  <div class="crumb">商品 / 商品列表</div>
  <div class="panel">
    <div class="filters">
      <div class="fi" style="width:300px"><label>编码搜索</label><input id="qCode" placeholder="SPU / SKU / 货品 / 原料编码，精确匹配"></div>
      <div class="fi" style="width:200px"><label>商品名称</label><input id="qName" placeholder="名称模糊"></div>
      <div class="fi" style="width:150px"><label>商品属性</label><select id="qAttr"><option value="">全部</option><option>标品</option><option>非标品</option></select></div>
      <div class="fi" style="width:150px"><label>渠道来源</label><select id="qSrc"><option value="">全部</option><option>自营</option><option>三方</option></select></div>
      <div class="fi" style="flex-direction:row;gap:8px"><button class="btn pr" onclick="renderList()">查询</button><button class="btn" onclick="resetQ()">重置</button></div>
    </div>
  </div>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar"><button class="btn pr" onclick="openCreate()">＋ 新建商品（自营）</button>
      <div class="dd" id="ddBatch"><button class="btn" onclick="toggleDd(event)">批量操作 ⌄</button><div class="dd-menu" id="ddMenu"></div></div>
      <button class="btn" onclick="openExcel()">Excel 批量修改</button><button class="btn">导出 ⌄</button></div>
    <div class="selbar" id="selbar"></div>
    <table>
      <thead><tr><th style="width:32px"><input type="checkbox" id="chkAll" onchange="selAll(this.checked)"></th><th style="width:28px"></th><th>商品 SPU</th><th>SPU 编码</th><th>后台类目</th><th>商品属性</th><th>规格数</th><th>渠道来源</th><th>创建人</th><th>创建时间</th><th>状态</th><th style="width:130px">操作</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>
</main>
</div>

<div class="mask" id="mask" onclick="maskClick()"></div>
<div class="dw" id="dwForm">
  <div class="dw-hd"><span id="fTitle">新建商品（自营）</span><span class="x" onclick="closeForm()">×</span></div>
  <div class="dw-bd" id="fBody"></div>
  <div class="errbar" id="errbar"></div>
  <div class="dw-ft"><div class="steps" id="steps"></div><button class="btn" onclick="closeForm()">取消</button><button class="btn pr" id="btnSubmit" onclick="submitForm()">保存并创建</button></div>
</div>
<div class="dw" id="dwDetail">
  <div class="dw-hd"><span id="dTitle">商品详情</span><span class="x" onclick="closeDetail()">×</span></div>
  <div class="dw-bd" id="dBody"></div>
  <div class="dw-ft" id="dFt"></div>
</div>
<div class="dw" id="dwBatch">
  <div class="dw-hd"><span id="bTitle"></span><span class="x" onclick="closeBatch()">×</span></div>
  <div class="dw-bd" id="bBody"></div>
  <div class="dw-ft" id="bFt"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 字典（取值来源见原型 PRD；运行时由字典接口返回） ============ */
const CATS=[
  {g:'肉禽',items:['猪肉','猪骨','鸡肉','牛肉','羊肉','鸭肉']},
  {g:'水产海鲜',items:['三文鱼','冷冻鱼']},
  {g:'饮料',items:['碳酸饮料','果汁']}
];
const PARTS={ /* 商品部位：后台类目挂载 product_classification 字段才出现（李南凯 PRD §7.2 BR-07） */
  '鸡肉':['3001 鲜鸡块','3002 冻鸡块','3003 鲜鸡大胸','3004 冻鸡大胸','3005 鲜三黄鸡','3006 鲜带皮鸡腿肉','3007 冻鸡丁'],
  '猪肉':['3008 鲜猪前腿肉','3009 鲜猪后腿肉','3010 冻带皮前腿肉','3011 冻带皮后腿肉','3012 冻去皮后腿肉'],
  '猪骨':['3013 冻猪腿骨','3014 鲜猪腿骨','3015 鲜猪骨块','3016 冻猪腔排骨加工'],
  '牛肉':['3017 鲜牛腿肉','3018 冻牛腿肉','3019 调理牛肉片','3020 鲜牛后','3021 冻牛后','3022 鲜牛碎肉','3023 冻牛碎肉','3024 冻牛腩','3025 冻牛前','3026 熟制牛肉'],
  '羊肉':['3027 鲜羊腿肉','3028 冻羊腿肉','3029 冻去骨羊后腿','3030 鲜去骨羊后腿','3031 鲜羊肉块','3032 冻羊肉块','3033 鲜羊排'],
  '鸭肉':['3034 鲜鸭块','3035 解冻鸭块','3036 冻鸭块','3037 鲜半片鸭','3038 白条鸭','3039 白鸭','3040 麻鸭']
};
const SPEC_UNIT=['个','打','瓶','罐','盒','袋','包','箱','卷','托'];   /* SPECIFICATIONS_UNIT */
const SALE_UNIT_STD=['包','份','组','箱'];                          /* 标品售卖单位 */
const SALE_UNIT_NS=['袋','盒','包','份','个','托'];                  /* 非标品成品计量单位 = 售卖单位，SPECIFICATIONS_UNIT */
const MEASURE_UNIT=['g','kg'];                                     /* 非标品库存单位 = 原料计量单位，MEASURE_UNIT */
const NET_UNIT=['g','kg','ml','L'];                                /* NET_WEIGHT_UNIT */
const STORAGE=['常温','冷藏','冷冻'];
const FULFIL=['常温履约','冷链履约'];
const WAREHOUSES=['SG 大仓','SG 冷库'];
const BCRS_CATS=['碳酸饮料','果汁'];
const EN_MAP={'三文鱼':'Salmon','块':'Cubes','片':'Slices','猪':'Pork','后腿肉':'Hind Leg','前腿肉':'Front Leg','冰鲜':'Chilled','去骨':'Boneless','鸡':'Chicken','胸':'Breast','可口可乐':'Coca-Cola','鸡腿':'Chicken Leg','牛腩':'Beef Brisket'};

/* ============ 示例业务数据 ============ */
let RAWS=[
  {code:'item202610200031',name:'三文鱼原料',en:'Salmon Raw',unit:'kg',cat:'三文鱼',status:'启用',purch:'是'},
  {code:'item202610280007',name:'冰鲜去骨猪后腿肉原料',en:'Chilled Boneless Pork Hind Leg Raw',unit:'kg',cat:'猪肉',status:'启用',purch:'是'},
  {code:'item202611030015',name:'鸡大胸原料',en:'Chicken Breast Raw',unit:'g',cat:'鸡肉',status:'启用',purch:'是'}

    <div class="fr"><label class="fl"><span class="rq">*</span>是否对HALAL客户展示</label><div class="radios">${['是','否'].map(v=>`<label><input type="radio" name="hs" ${F.halalShow===v?'checked':''} onchange="set('halalShow','${v}')">${v}</label>`).join('')}</div><div class="fh">选择“否”时，HALAL 客户在商城看不到该商品</div></div>
  </div><div class="g3" style="margin-top:14px">
    <div class="fr"><label class="fl"><span class="rq">*</span>效期管理</label><div class="radios">${['是','否'].map(v=>`<label><input type="radio" name="vp" ${F.validP===v?'checked':''} onchange="set('validP','${v}')">${v}</label>`).join('')}</div></div>
    <div class="fr"><label class="fl">${F.validP==='是'?'<span class="rq">*</span>':''}保质期</label><div style="display:flex;gap:6px"><input type="number" min="1" value="${esc(F.period)}" placeholder="如 7" ${F.validP==='否'?'disabled':''} class="${showErr&&F.validP==='是'&&!F.period?'err':''}" onchange="set('period',this.value)"><select style="width:80px" ${F.validP==='否'?'disabled':''} onchange="set('periodUnit',this.value)">${['天','月','年'].map(u=>`<option${u===F.periodUnit?' selected':''}>${u}</option>`).join('')}</select></div>${E(F.validP==='是'&&!F.period&&'请输入保质期')}</div>
    <div class="fr"><label class="fl"><span class="rq">*</span>APP是否展示效期</label><select onchange="set('appExp',this.value)">${['不展示','展示'].map(u=>`<option${u===F.appExp?' selected':''}>${u}</option>`).join('')}</select></div>
    <div class="fr"><label class="fl"><span class="rq">*</span>保存条件</label><select class="${showErr&&!F.storage?'err':''}" onchange="set('storage',this.value)">${opts(STORAGE,F.storage)}</select>${E(!F.storage&&'请选择保存条件')}</div>
    <div class="fr"><label class="fl"><span class="rq">*</span>履约方式</label><select class="${showErr&&!F.fulfil?'err':''}" onchange="set('fulfil',this.value)">${opts(FULFIL,F.fulfil,'请选择履约方式')}</select>${E(!F.fulfil&&'请选择履约方式')}</div>
  </div></div></div>`;

  /* ② 商品规格 */
  h+=`<div class="sec"><div class="sec-hd"><span class="no">2</span>商品规格</div><div class="sec-bd">
    <div class="fr" style="margin-bottom:14px"><label class="fl"><span class="rq">*</span>商品属性<span class="hint">保存后不可修改</span></label>
    <div class="cards">
      <div class="card ${F.attr==='标品'?'on':''} ${ed?'dis':''}" onclick="${ed?'':"set('attr','标品')"}"><b>标品</b><p>预包装商品，按件卖。建 1 个成品货品，所有规格共用它，下单按售卖规格数量扣货品库存</p></div>
      <div class="card ${F.attr==='非标品'?'on':''} ${ed?'dis':''}" onclick="${ed?'':"set('attr','非标品')"}"><b>非标品</b><p>按重量分装卖。自动建 1 个原料货品 + 每个规格 1 个成品货品 + 原料到成品的 BOM</p></div>
    </div>${E(!F.attr&&'请选择商品属性')}</div>`;
  if(F.attr==='标品')h+=stdSpecBlock(ed);
  if(F.attr==='非标品')h+=nsSpecBlock(ed);
  h+=`</div></div>`;

  /* ③ 售卖规格 */
  if(F.attr)h+=`<div class="sec"><div class="sec-hd"><span class="no">3</span>售卖规格（SKU）<span class="tip">${F.attr==='非标品'?'每行 = 1 个成品货品 + 1 条 BOM + 1 个 SKU':'每行 1 个 SKU，共用同一个货品'}</span></div><div class="sec-bd">${F.attr==='非标品'?nsRows():stdRows()}</div></div>`;

  /* ④ 展示配置 */
  h+=`<div class="sec"><div class="sec-hd"><span class="no">${F.attr?4:3}</span>展示配置</div><div class="sec-bd"><div class="g2">
    <div class="fr"><label class="fl"><span class="rq">*</span>商品主图<span class="hint">第一张请上传白底图，至少 800×800，单张 ≤8M，最多 15 张</span></label><div class="thumbs">${thumbs('imgs')}${F.imgs<15?`<div class="up" onclick="F.imgs++;renderForm()">＋<span>上传主图</span></div>`:''}</div>${E(!F.imgs&&'请至少上传一张商品主图')}</div>
    <div class="fr"><label class="fl">商品详情<span class="hint">宽 750-1242px，限高 2000px，单张 ≤8M，最多 10 张</span></label><div class="thumbs">${thumbs('dimgs')}${F.dimgs<10?`<div class="up" onclick="F.dimgs++;renderForm()">＋<span>上传详情图</span></div>`:''}</div></div>
  </div></div></div>`;

  /* ⑤ 采购与仓储 */
  if(F.attr){const n=5;h+=`<div class="sec"><div class="sec-hd"><span class="no">${n}</span>采购与仓储（自营）<span class="tip">写入货品，仓库与采购使用</span><button class="lk fold" onclick="F.supplyOpen=!F.supplyOpen;renderForm()">${F.supplyOpen?'收起 ▴':'展开 ▾'}</button></div>${F.supplyOpen?supplyBlock():''}</div>`}

  $('fBody').innerHTML=h;$('fBody').scrollTop=sc;livePreview();if(showErr)renderErrbar()}
function thumbs(k){return Array.from({length:F[k]},(_,i)=>`<div class="thumb">${k==='imgs'&&i===0?'白底主图':'图 '+(i+1)}<span class="rm" onclick="F.${k}--;renderForm()">×</span></div>`).join('')}

function stdSpecBlock(ed){const lock=ed?'disabled':'';
  let h=`<div class="fr" style="margin-bottom:14px"><label class="fl"><span class="rq">*</span>单件净含量<span class="hint">先选净含量申报的是哪一件，再填包装上的数值，如 罐 / 330 ml</span></label>
    <table class="itbl" style="max-width:640px"><thead><tr><th>最小包装单位</th><th>净含量</th><th>净含量单位</th></tr></thead><tbody><tr>
    <td><select ${lock} class="${showErr&&!F.minPack?'err':''}" onchange="set('minPack',this.value)">${opts(SPEC_UNIT,F.minPack)}</select></td>
    <td><input ${lock} type="number" min="0" value="${esc(F.net)}" placeholder="如 330" class="${showErr&&!(Number(F.net)>0)?'err':''}" onchange="set('net',this.value)"></td>
    <td><select ${lock} class="${showErr&&!F.netUnit?'err':''}" onchange="set('netUnit',this.value)">${opts(NET_UNIT,F.netUnit)}</select></td></tr></tbody></table>
    ${E(!F.minPack&&'请选择最小包装单位')}${E(!(Number(F.net)>0)&&'请填写净含量（大于 0）')}${E(!F.netUnit&&'请选择净含量单位')}</div>`;
  h+=`<div class="fr" style="margin-bottom:14px"><label class="fl"><span class="rq">*</span>库存单位<span class="hint">货品库存按什么单位计，所有规格通用；保存后不可修改</span></label>`;
  if(!F.minPack)h+=`<div class="fh">请先选择上方的「最小包装单位」</div>`;
  else{h+=`<div class="radios"><span>库存单位就是最小包装单位 <b>${F.minPack}</b> 吗？</span>${['是','否'].map(v=>`<label><input type="radio" name="sip" ${lock} ${F.stockIsPack===v?'checked':''} onchange="set('stockIsPack','${v}')">${v}</label>`).join('')}</div>
    <div class="fh">按${F.minPack}囤就选「是」；按箱囤就选「否」，再填 1 个库存单位装几${F.minPack}</div>`;
    if(F.stockIsPack==='是')h+=`<div class="ro" style="max-width:240px;margin-top:6px">🔒 ${F.minPack}（同最小包装单位）</div>`;
    else h+=`<div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap"><select ${lock} style="width:160px" class="${showErr&&!F.stockUnit?'err':''}" onchange="set('stockUnit',this.value)">${opts(SPEC_UNIT.filter(u=>u!==F.minPack),F.stockUnit,'请选择库存单位')}</select>
      <span>每库存单位含</span><input ${lock} type="number" min="1" style="width:100px" value="${esc(F.packQty)}" placeholder="如 24" class="${showErr&&!(F.packQty>1)?'err':''}" onchange="set('packQty',this.value)"><span class="ro">🔒 ${F.minPack}</span>
      ${F.stockUnit&&F.packQty?`<span class="fh" style="color:var(--pd)">1 ${F.stockUnit} = ${F.packQty} ${F.minPack}</span>`:''}</div>${E(!F.stockUnit&&'请选择库存单位')}${E(!(F.packQty>1)&&'请填写每库存单位含最小包装数（大于 1 的整数）')}`}
  h+=`</div>`;
  if(BCRS_CATS.includes(F.cat))h+=`<div class="fr"><label class="fl">是否支持 BCRS<span class="hint">饮料容器押金回收，仅 SGP 站点、类目支持时可选</span></label>
    <div class="radios">${['否','是'].map(v=>`<label><input type="radio" name="bcrs" ${F.bcrs===v?'checked':''} onchange="set('bcrs','${v}')">${v}</label>`).join('')}
    ${F.bcrs==='是'?`<span>每 1 ${F.minPack||'最小包装'}容器数</span><input type="number" min="1" style="width:80px" value="${esc(F.bcrsQty)}" onchange="set('bcrsQty',this.value)"><span class="fh">个 · 押金单价 S$0.10/容器（平台固定）</span>`:''}</div></div>`;
  return h}

function nsSpecBlock(ed){
  let h=`<div class="g2" style="margin-bottom:14px"><div class="fr"><label class="fl"><span class="rq">*</span>库存单位<span class="hint">即原料货品的计量单位，所有规格的售卖规格单位都锁定为它</span></label>
    <select ${ed?'disabled':''} class="${showErr&&!F.nsUnit?'err':''}" onchange="set('nsUnit',this.value)">${opts(MEASURE_UNIT,F.nsUnit)}</select>${E(!F.nsUnit&&'请选择库存单位')}</div>
    <div class="fr"><label class="fl"><span class="rq">*</span>原料货品</label><div class="radios">${['新建','已有'].map(v=>`<label><input type="radio" name="rm" ${ed?'disabled':''} ${F.rawMode===v?'checked':''} onchange="set('rawMode','${v}')">${v==='新建'?'新建原料':'选择已有原料'}</label>`).join('')}</div></div></div>`;
  if(F.rawMode==='新建'){
    h+=`<div class="box on"><div class="raw-hd"><span class="tag tg">新建原料</span><span class="fh">提交时随商品一起建，名称和字段都取自本页，不用另填</span></div>
    <div class="dl"><div><div class="k">原料名称（中文）</div><div class="v" id="rawZh"></div></div><div><div class="k">原料名称（英文）</div><div class="v" id="rawEn"></div></div>
    <div><div class="k">计量单位 / 净含量</div><div class="v">${F.nsUnit||'—'} / 1${F.nsUnit||''}</div></div><div><div class="k">货品属性</div><div class="v">原料 · 非标品</div></div></div></div>`;
    const sim=!ed&&F.cat&&F.nsUnit?RAWS.filter(x=>x.status==='启用'&&x.cat===F.cat&&x.unit===F.nsUnit):[];
    if(sim.length)h+=`<div class="warn">后台类目「${esc(F.cat)}」下已有计量单位为 ${F.nsUnit} 的原料：${sim.map(x=>`${esc(x.name)}（<span class="mono">${x.code}</span>）<button class="btn sm" onclick="F.rawMode='已有';set('rawCode','${x.code}')">改为选它</button>`).join(' ')} 同一种原料拆成不同商品卖时请选已有的，不要重复建。</div>`;
  }else{
    const r=rawBy(F.rawCode);
    if(!ed){const cand=RAWS.filter(x=>x.status==='启用'&&x.unit===F.nsUnit);
      h+=`<div class="fr" style="margin-bottom:10px;max-width:640px"><select class="${showErr&&!F.rawCode?'err':''}" ${F.nsUnit?'':'disabled'} onchange="set('rawCode',this.value)"><option value="">${F.nsUnit?'输入编码/名称搜索原料货品（只列启用中、计量单位为 '+F.nsUnit+' 的原料）':'请先选择库存单位'}</option>${cand.map(x=>`<option value="${x.code}"${x.code===F.rawCode?' selected':''}>${x.code} - ${esc(x.name)}（${x.unit}）</option>`).join('')}</select>${E(!F.rawCode&&'请选择原料货品')}</div>`}
    if(r){const own=ed?SPUS[F.idx].spu:'';const ex=existingFinished(r.code).filter(e=>!own||!SPUS[F.idx].skus.some(k=>k.item===e.item));
      h+=`<div class="box on"><div class="raw-hd"><span class="tag tb">已有原料</span><span class="fh">${ed?'原料只读；新加的规格挂在这个原料下':'原料只读，不会改动；本次只新建成品、BOM 和 SKU'}</span></div>
      <div class="dl" style="margin-bottom:10px"><div><div class="k">原料编码</div><div class="v mono">${r.code}</div></div><div><div class="k">原料名称</div><div class="v">${esc(r.name)}<br><span class="fh">${esc(r.en)}</span></div></div>
      <div><div class="k">计量单位</div><div class="v">${r.unit}</div></div><div><div class="k">状态 / 是否可采</div><div class="v">${r.status} / ${r.purch==='是'?'可采':'不可采'}</div></div></div>
      ${ex.length?`<div class="k fh" style="margin-bottom:4px">${ed?'这个原料在其他商品下的成品':'这个原料下已有的成品'}（${ex.length}）</div><table><thead><tr><th>成品货品编码</th><th>规格</th><th>所属商品</th><th>状态</th></tr></thead><tbody>${ex.map(e=>`<tr><td class="mono">${e.item}</td><td>${fmtQty(e.qty)}${r.unit}/${e.su}</td><td>${esc(e.spu)}</td><td>${e.off?'<span class="tag tgr">停用</span>':'<span class="tag tg">启用</span>'}</td></tr>`).join('')}</tbody></table>`:''}</div>`}
  }
  return h}

function nsRows(){const cols='1.7fr 110px 90px 120px 1.3fr 100px 60px';
  let h=`<div class="skut"><div class="hd" style="grid-template-columns:${cols}"><div>成品 / SKU 名称（自动）</div><div><span style="color:var(--r)">*</span>售卖规格数量</div><div>售卖规格单位</div><div><span style="color:var(--r)">*</span>售卖单位</div><div>BOM（原料用量 → 成品）</div><div>多退少补</div><div></div></div>`;
  const seen={};
  F.rows.forEach((r,i)=>{const qE=r.locked?'':qtyErr(r.qty,'非标品');const key=fmtQty(r.qty)+'|'+r.su;const dupSelf=r.qty&&r.su&&seen[key]!==undefined;if(r.qty&&r.su&&seen[key]===undefined)seen[key]=i;
    const off=r.status==='已下架';
    h+=`<div class="row ${off?'off':''}" style="grid-template-columns:${cols}">
      <div class="nm" data-fn="${i}"></div>
      <div>${r.locked?`<div class="cell-ro">🔒 ${fmtQty(r.qty)}</div>`:`<input type="number" min="0.01" step="0.01" value="${esc(r.qty)}" placeholder="如 0.5" class="${showErr&&qE?'err':''}" onchange="setRow(${i},'qty',this.value)">`}</div>
      <div class="cell-ro">🔒 ${F.nsUnit||'库存单位'}</div>
      <div>${r.locked?`<div class="cell-ro">🔒 ${r.su}</div>`:`<select class="${showErr&&!r.su?'err':''}" onchange="setRow(${i},'su',this.value)">${opts(SALE_UNIT_NS,r.su)}</select>`}</div>
      <div class="bom">${r.qty&&F.nsUnit?`<b>${fmtQty(r.qty)} ${F.nsUnit}</b> 原料 → <b>1 ${r.su||'?'}</b> 成品`:'—'}${r.bom?`<br><span class="mono">${r.bom}</span>${r.bomStatus==='废弃'?' <span class="tag tgr">已废弃</span>':''}`:''}</div>
      <div><span class="tgl ${r.st?'on':''} ${off?'dis':''}" onclick="${off?'':`setRow(${i},'st',${!r.st})`}"><i></i>${r.st?'按重量':'否'}</span></div>
      <div>${r.locked?(off?'<span class="tag tgr">已停用</span>':`<button class="lk dg" onclick="F.confirmOff=${i};renderForm()">停用</button>`):`<button class="lk dg" ${F.rows.length<=1?'disabled':''} onclick="delRow(${i})">删除</button>`}</div>
      ${r.locked?`<div class="rowx fh">SKU <span class="mono">${r.sku}</span> · 成品 <span class="mono">${r.item}</span>${r.itemStatus==='待启用'?' · <span class="tag ty">货品待启用</span>':''}${off?' · SKU 已下架、成品已停用':''}</div>`:''}
      ${F.confirmOff===i?`<div class="rowx confirm">停用这个规格：SKU 下架、成品货品停用、BOM 废弃，三样一起改，不能恢复为同一个 SKU。<button class="btn sm pr" onclick="offRow(${i})">确认停用</button><button class="btn sm" onclick="F.confirmOff=-1;renderForm()">取消</button></div>`:''}
      ${showErr&&qE?`<div class="rowx fe">规格 ${i+1}：${qE}</div>`:''}${showErr&&!r.su&&!r.locked?`<div class="rowx fe">规格 ${i+1}：请选择售卖单位</div>`:''}
      ${dupSelf?`<div class="rowx fe">规格 ${i+1} 与规格 ${seen[key]+1} 重复（售卖规格数量 + 售卖单位相同）</div>`:''}
    </div>`});
  h+=`</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><button class="btn sm" onclick="addRow()">＋ 添加规格</button>
    <span class="fh">${summaryNs()}</span></div>`;
  return h}
function offRow(i){const r=F.rows[i];r.status='已下架';r.itemStatus='停用';r.bomStatus='废弃';F.confirmOff=-1;r._off=true;renderForm()}
function summaryNs(){const act=F.rows.filter(r=>!r.locked);const n=act.length;
  const raw=F.mode==='create'&&F.rawMode==='新建'?'1 个原料货品、':'';
  return act.length?`提交后新建：${raw}${n} 个成品货品、${n} 条 BOM、${n} 个 SKU`:'没有新增规格'}

function stdRows(){const cols='1.6fr 110px 110px 120px 120px 1.2fr 60px';const u=F.stockUnit||F.minPack;
  let h=`<div class="skut"><div class="hd" style="grid-template-columns:${cols}"><div>规格名称（自动）</div><div><span style="color:var(--r)">*</span>售卖规格数量</div><div>售卖规格单位</div><div>售卖单位</div><div>内含最小包装数</div><div>库存扣减</div><div></div></div>`;
  const seen={};
  F.rows.forEach((r,i)=>{const qE=r.locked?'':qtyErr(r.qty,'标品');const key=r.qty+'|'+r.su;const dup=r.qty&&seen[key]!==undefined;if(r.qty&&seen[key]===undefined)seen[key]=i;
    const pack=F.stockIsPack==='是'?r.qty:(r.qty&&F.packQty?r.qty*F.packQty:'');
    h+=`<div class="row" style="grid-template-columns:${cols}"><div class="nm" data-fn="${i}"></div>
      <div>${r.locked?`<div class="cell-ro">🔒 ${r.qty}</div>`:`<input type="number" min="1" step="1" value="${esc(r.qty)}" placeholder="如 1 或 24" class="${showErr&&qE?'err':''}" onchange="setRow(${i},'qty',this.value)">`}</div>
      <div class="cell-ro">🔒 ${u||'库存单位'}</div>
      <div><select ${r.locked?'disabled':''} onchange="setRow(${i},'su',this.value)">${opts(SALE_UNIT_STD,r.su,'无')}</select></div>
      <div class="cell-ro">${pack?pack+' '+(F.minPack||''):'—'}</div>
      <div class="bom">${r.qty&&u?`下单 1 份扣减 <b>${r.qty} ${u}</b> 货品库存`:'—'}</div>
      <div>${r.locked?'':`<button class="lk dg" ${F.rows.length<=1?'disabled':''} onclick="delRow(${i})">删除</button>`}</div>
      ${r.locked?`<div class="rowx fh">SKU <span class="mono">${r.sku}</span></div>`:''}
      ${showErr&&qE?`<div class="rowx fe">规格 ${i+1}：${qE}</div>`:''}${dup?`<div class="rowx fe">规格 ${i+1} 与规格 ${seen[key]+1} 重复</div>`:''}</div>`});
  h+=`</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><button class="btn sm" onclick="addRow()">＋ 添加规格</button>
    <span class="fh">${F.mode==='create'?`提交后新建：1 个成品货品、${F.rows.length} 个 SKU`:`新增 ${F.rows.filter(r=>!r.locked).length} 个 SKU，绑定原货品`}</span></div>`;
  return h}

function supplyBlock(){const ns=F.attr==='非标品';const newRaw=ns&&F.rawMode==='新建'&&F.mode==='create';
  return `<div class="sec-bd"><div class="g3">
    ${ns?`<div class="fr"><label class="fl"><span class="rq">*</span>原料是否可采</label>${newRaw?`<div class="radios">${['是','否'].map(v=>`<label><input type="radio" name="rp" ${F.rawPurch===v?'checked':''} onchange="set('rawPurch','${v}')">${v}</label>`).join('')}</div>`:`<div class="ro">${F.rawMode==='已有'?((rawBy(F.rawCode)||{}).purch==='是'?'可采':'不可采')+'<span class="fh">在详情 › 货品里切换</span>':'—'}</div>`}</div>

function validate(){const e=[];const z=zhErr(F.name),en=enErr(F.en);if(z)e.push(z);if(en)e.push(en);
  if(!F.cat)e.push('请选择后台类目');if(PARTS[F.cat]&&!F.part)e.push('请选择商品部位');
  if(F.validP==='是'&&!F.period)e.push('请输入保质期');if(!F.storage)e.push('请选择保存条件');if(!F.fulfil)e.push('请选择履约方式');
  if(!F.attr)e.push('请选择商品属性');
  if(F.attr==='标品'){if(!F.minPack)e.push('请选择最小包装单位');if(!(Number(F.net)>0))e.push('请填写净含量（大于 0）');if(!F.netUnit)e.push('请选择净含量单位');
    if(F.stockIsPack==='否'){if(!F.stockUnit)e.push('请选择库存单位');if(!(F.packQty>1))e.push('请填写每库存单位含最小包装数')}}
  if(F.attr==='非标品'){if(!F.nsUnit)e.push('请选择库存单位');if(F.rawMode==='已有'&&!F.rawCode)e.push('请选择原料货品')}
  if(F.attr){const act=F.rows.filter(r=>!r.locked);if(!F.rows.length)e.push('至少添加 1 个售卖规格');
    const seen={};F.rows.forEach((r,i)=>{if(!r.locked){const q=qtyErr(r.qty,F.attr);if(q)e.push(`规格 ${i+1}：${q}`);if(F.attr==='非标品'&&!r.su)e.push(`规格 ${i+1}：请选择售卖单位`);
      }
      const k=(F.attr==='非标品'?fmtQty(r.qty):r.qty)+'|'+r.su;if(r.qty&&seen[k]!==undefined)e.push(`规格 ${i+1} 与规格 ${seen[k]+1} 重复`);else seen[k]=i});
    }
  if(!F.imgs)e.push('请至少上传一张商品主图');
  return e}
function renderErrbar(){const e=validate();const b=$('errbar');if(e.length){b.innerHTML=`以下内容未通过校验，请修改后重试：<ol>${e.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;b.classList.add('on')}else b.classList.remove('on')}
function submitForm(){showErr=true;renderForm();const e=validate();if(e.length){renderErrbar();return}
  $('errbar').classList.remove('on');$('btnSubmit').disabled=true;
  const ns=F.attr==='非标品';const steps=[ns?'建原料 / 成品 / BOM（停用）':'建货品（停用）','建商品与 SKU','启用货品'];let k=0;
  const draw=st=>$('steps').innerHTML=steps.map((s,i)=>`<span class="st ${i<st?'ok':i===st?'ing':''}"><span class="dot">${i<st?'✓':''}</span>${s}</span>`).join('<span class="ar">›</span>');
  draw(0);const tick=()=>{k++;draw(k);if(k<3)setTimeout(tick,650);else setTimeout(finish,350)};setTimeout(tick,650)}
function finish(){const ns=F.attr==='非标品';let s;
  if(F.mode==='create'){s={spu:code('SPU'),name:cleanName(F.name),en:cleanName(F.en),cat:F.cat,part:F.part,attr:F.attr,src:'自营',creator:'沈亮',at:now(),status:'在售',
      base:{origin:F.origin,brand:F.brand,storage:F.storage,fulfil:F.fulfil,validP:F.validP,period:F.period,periodUnit:F.periodUnit,halal:F.halal,halalShow:F.halalShow,appExp:F.appExp,sale:F.sale},skus:[]};
    if(ns){if(F.rawMode==='新建'){const rc=code('item');RAWS.push({code:rc,name:rawNameZh(),en:rawNameEn(),unit:F.nsUnit,cat:F.cat,status:'启用',purch:F.rawPurch});s.rawCode=rc}else s.rawCode=F.rawCode;s.stockUnit=F.nsUnit}
    else s.std={minPack:F.minPack,net:F.net,netUnit:F.netUnit,stockIsPack:F.stockIsPack,stockUnit:F.stockIsPack==='是'?F.minPack:F.stockUnit,packQty:F.packQty,item:code('item'),bcrs:F.bcrs,bcrsQty:F.bcrsQty,status:'启用',purch:F.purch};
    SPUS.unshift(s)}
  else{s=SPUS[F.idx];s.name=cleanName(F.name);s.en=cleanName(F.en);s.cat=F.cat;s.part=F.part;Object.assign(s.base,{origin:F.origin,brand:F.brand,storage:F.storage,fulfil:F.fulfil,validP:F.validP,period:F.period,periodUnit:F.periodUnit,halal:F.halal,halalShow:F.halalShow,appExp:F.appExp,sale:F.sale});
    s.skus.forEach((k,i)=>{const r=F.rows[i];if(r&&r._off){k.status='已下架';k.itemStatus='停用';k.bomStatus='废弃'}if(r&&ns)k.st=r.st});
    }
  F.rows.filter(r=>!r.locked).forEach(r=>{const k={sku:code('SKU'),qty:ns?fmtQty(r.qty):r.qty,su:r.su,status:'在售',st:r.st};
    if(ns){k.item=code('item');k.bom=code('BM')}s.skus.push(k)});
  const i=SPUS.indexOf(s);openRows[s.spu]=true;closeForm();renderList();if(F.mode==='edit'){seedLogs(s);log(s,'商品',s.spu,'编辑商品')}else{s.logs=null}toast(F.mode==='create'?'建档成功':'保存成功');openDetail(i,'商品')}

let dTab='商品',dCur=-1,pend=null;
const ME='沈亮';
function log(s,tab,obj,act){(s.logs=s.logs||[]).unshift({at:now(),who:ME,tab,obj,act})}
function seedLogs(s){if(s.logs)return;s.logs=[];const t=s.at;
  s.logs.push({at:t,who:s.creator,tab:'商品',obj:s.spu,act:'新建商品，'+s.skus.length+' 个 SKU'});
  if(s.attr==='非标品'){s.logs.push({at:t,who:s.creator,tab:'货品',obj:s.rawCode,act:'关联原料'});s.skus.forEach(k=>s.logs.push({at:t,who:s.creator,tab:'货品',obj:k.item,act:'新建成品 + BOM '+k.bom}))}
  else s.logs.push({at:t,who:s.creator,tab:'货品',obj:s.std.item,act:'新建货品'})}
function spusOfRaw(code){return SPUS.filter(x=>x.rawCode===code)}
function skuItemBlock(s,k){/* 上架前检查货品状态 */
  if(s.attr==='非标品'){if(k.itemStatus==='停用')return'成品已停用';if(k.itemStatus==='待启用')return'成品待启用'}
  else if(s.std.status==='停用')return'货品已停用';return''}
function ask(kind,arg){pend={kind,arg};openDetail(dCur)}
function cancelAsk(){pend=null;openDetail(dCur)}
function confirmBox(){if(!pend)return'';const s=SPUS[dCur];const {kind,arg}=pend;let msg='',btn='确认';
  if(kind==='rawStatus'){const r=rawBy(s.rawCode);const users=spusOfRaw(r.code);const fins=users.reduce((n,x)=>n+x.skus.filter(k=>k.itemStatus!=='停用').length,0);
    msg=r.status==='启用'?`停用原料「${esc(r.name)}」：采购单不能再选它，仓库不能再收货。它下面 ${fins} 个启用中的成品（分布在 ${users.length} 个商品：${users.map(x=>esc(x.name)).join('、')}）不跟着停用，现有库存照常卖，卖完后按「不可采 + 库存不足 1 份」规则自动下架。`
      :`启用原料「${esc(r.name)}」：恢复采购和收货。`;btn=r.status==='启用'?'确认停用':'确认启用'}
  if(kind==='rawPurch'){const r=rawBy(s.rawCode);const n=spusOfRaw(r.code).length;
    msg=r.purch==='是'?`把原料「${esc(r.name)}」设为不可采：采购单、采购计划都不能再选它。这个原料被 ${n} 个商品使用。`:`把原料「${esc(r.name)}」设为可采：采购单可以选它。`;btn='确认'}
  if(kind==='finOff'){const k=s.skus.find(x=>x.sku===arg);msg=`停用成品 <span class="mono">${k.item}</span>（${esc(skuNameOf(s,k))}）：SKU 一起下架、BOM ${k.bom} 废弃，三样一起改，不能恢复。要换规格请在编辑里新加一行。`;btn='确认停用'}
  if(kind==='stdStatus'){const d=s.std;const on=s.skus.filter(k=>k.status==='在售').length;
    msg=d.status!=='停用'?`停用货品 <span class="mono">${d.item}</span>：${on} 个在售 SKU 一起下架，采购和收货都停止。`:`启用货品 <span class="mono">${d.item}</span>：恢复采购和收货。SKU 不会自动上架，需要到「商品」里逐个上架。`;btn=d.status!=='停用'?'确认停用':'确认启用'}
  if(kind==='stdPurch'){const d=s.std;msg=d.purch!=='否'?`把货品 <span class="mono">${d.item}</span> 设为不可采：采购单不能再选它；SKU 库存不足 1 份时自动下架，补货后不会自动上架。`:`把货品 <span class="mono">${d.item}</span> 设为可采：采购单可以选它。之前因不可采自动下架的 SKU 不会自动上架。`;btn='确认'}
  if(kind==='skuOff'){const k=s.skus.find(x=>x.sku===arg);msg=`下架 SKU ${k.sku}（${esc(skuNameOf(s,k))}）：所有报价单上都不再售卖。货品不受影响。`;btn='确认下架'}

function doAsk(){const s=SPUS[dCur];const {kind,arg}=pend;pend=null;
  if(kind==='rawStatus'){const r=rawBy(s.rawCode);r.status=r.status==='启用'?'停用':'启用';spusOfRaw(r.code).forEach(x=>log(x,'货品',r.code,(r.status==='停用'?'停用':'启用')+'原料'));toast('原料已'+r.status)}
  if(kind==='rawPurch'){const r=rawBy(s.rawCode);r.purch=r.purch==='是'?'否':'是';spusOfRaw(r.code).forEach(x=>log(x,'货品',r.code,'原料设为'+(r.purch==='是'?'可采':'不可采')));toast('已设为'+(r.purch==='是'?'可采':'不可采'))}
  if(kind==='finOff'){const k=s.skus.find(x=>x.sku===arg);k.itemStatus='停用';k.bomStatus='废弃';k.status='已下架';log(s,'货品',k.item,'停用成品，BOM '+k.bom+' 废弃');log(s,'商品',k.sku,'下架（成品停用联动）');toast('已停用')}

  if(kind==='stdPurch'){const d=s.std;d.purch=d.purch==='否'?'是':'否';log(s,'货品',d.item,'设为'+(d.purch==='是'?'可采':'不可采'));toast('已设为'+(d.purch==='是'?'可采':'不可采'))}
  if(kind==='skuOff'){const k=s.skus.find(x=>x.sku===arg);k.status='已下架';log(s,'商品',k.sku,'下架');toast('已下架')}

  else h+=`<div class="sec"><div class="sec-hd">仓储信息<span class="tip">随商品编辑，这里只读</span></div><div class="sec-bd"><div class="dl"><div><div class="k">保存条件</div><div class="v">${IE.stor.storage||'—'}</div></div><div><div class="k">履约方式</div><div class="v">${IE.stor.fulfil||'—'}</div></div><div><div class="k">效期管理 / 保质期</div><div class="v">${IE.stor.validP} / ${IE.stor.period||'—'}${IE.stor.period?IE.stor.periodUnit:''}</div></div></div></div></div>`;
  if(purch)h+=`<div class="sec"><div class="sec-hd">采购与质检</div><div class="sec-bd">

function saveItemEdit(){const s=SPUS[dCur];const e=IE.e;for(const w of WAREHOUSES){const v=Number(e.over[w]);if(!(v>=0&&v<=99)){toast('入库超收比例须为 0~99',true);return}}
  if(e.fee!==''&&!(e.fee>=0&&e.fee<=99)){toast('公司质检扣点须为 0~99',true);return}if(e.rej!==''&&!(e.rej>=0&&e.rej<=99)){toast('质检拒收下限须为 0~99',true);return}

const BATCH=[
  {g:'商品'},{k:'shelfOn',t:'批量上架'},{k:'shelfOff',t:'批量下架'},{k:'valid',t:'批量设置效期管理'},
  {g:'货品'},{k:'itemOn',t:'批量启用货品'},{k:'itemOff',t:'批量停用货品'},{k:'purchY',t:'批量设为可采'},{k:'purchN',t:'批量设为不可采'},{k:'vendor',t:'批量设置默认供应商'},{k:'over',t:'批量设置入库超收'},{k:'qc',t:'批量设置质检扣点 / 拒收下限'}];

let B=null;
/* 解析勾选商品 → 作用对象，并给出跳过原因 */
function targets(kind){const spus=SPUS.filter(s=>SEL.has(s.spu));const out=[];const seenRaw={};
  const isItem=['itemOn','itemOff','purchY','purchN','vendor','over','qc'].includes(kind);
  spus.forEach(s=>{const base={spu:s.name};
    if(s.src!=='自营'){out.push({...base,code:s.spu,type:'商品',cur:'—',skip:'三方商品，在商家端维护'});return}
    if(s.legacy){out.push({...base,code:s.spu,type:'商品',cur:'—',skip:'旧结构商品，迁移后可操作'});return}
    if(kind==='shelfOn'||kind==='shelfOff'){s.skus.forEach(k=>{const on=kind==='shelfOn';const blk=skuItemBlock(s,k);
      out.push({...base,code:k.sku,type:'SKU',name:skuNameOf(s,k),cur:k.status,ref:{s,k},skip:(on&&k.status==='在售')||(!on&&k.status!=='在售')?'已是目标状态':(on&&blk)?blk:''})});return}
    if(kind==='valid'){out.push({...base,code:s.spu,type:'商品',name:s.name,cur:s.base.validP+(s.base.period?' / '+s.base.period+s.base.periodUnit:''),ref:{s},skip:''});return}
    if(isItem){if(s.attr==='标品'){const d=s.std;out.push({...base,code:d.item,type:'标品货品',name:s.name,cur:curOf(kind,d,'std'),ref:{s,o:d,t:'std'},skip:skipOf(kind,d,'std')})}
      else{const r=rawBy(s.rawCode);if(!seenRaw[r.code]){seenRaw[r.code]=1;out.push({...base,spu:spusOfRaw(r.code).map(x=>x.name).join('、'),code:r.code,type:'原料',name:r.name,cur:curOf(kind,r,'raw'),ref:{o:r,t:'raw'},skip:skipOf(kind,r,'raw')})}
        if(['itemOn','itemOff','purchY','purchN','vendor','over','qc'].includes(kind))s.skus.forEach(k=>out.push({...base,code:k.item,type:'成品',name:skuNameOf(s,k),cur:'—',skip:kind==='itemOff'?'成品停用要连 SKU、BOM 一起改，请在详情里逐个停用':kind==='itemOn'?(k.itemStatus==='待启用'?'待启用成品请在详情里启用':'成品不参与批量启用'):'原料做的成品不可采，不参与'}))}}});
  return out}
function curOf(kind,o,t){if(kind==='itemOn'||kind==='itemOff')return o.status||'启用';if(kind==='purchY'||kind==='purchN')return (o.purch||'是')==='是'?'可采':'不可采';
  const e=ext(o);if(kind==='vendor')return WAREHOUSES.map(w=>e.vendor[w]||'未设置').join(' / ');if(kind==='over')return WAREHOUSES.map(w=>e.over[w]+'%').join(' / ');if(kind==='qc')return (e.fee||'—')+' / '+(e.rej||'—');return'—'}
function skipOf(kind,o,t){const st=o.status||'启用',pu=o.purch||'是';if(kind==='itemOn'&&st==='启用')return'已是启用';if(kind==='itemOff'&&st==='停用')return'已是停用';if(kind==='purchY'&&pu==='是')return'已是可采';if(kind==='purchN'&&pu==='否')return'已是不可采';return''}
function effectOf(kind,x){if(x.skip)return'';if(kind==='itemOff'&&x.type==='标品货品'){const n=x.ref.s.skus.filter(k=>k.status==='在售').length;return n?`${n} 个在售 SKU 一起下架`:''}
  if(kind==='itemOff'&&x.type==='原料')return'成品不跟着停，库存卖完自动下架';if(kind==='purchN')return'库存不足 1 份时 SKU 自动下架';if(kind==='itemOn'||kind==='purchY')return'SKU 不自动上架';return''}
function openBatch(kind){$('ddBatch').classList.remove('on');B={kind,vals:{validP:'是',period:'',periodUnit:'天',vendor:{},over:Object.fromEntries(WAREHOUSES.map(w=>[w,99])),fee:'',rej:''},done:false};renderBatch()}
function renderBatch(){const {kind}=B;const t=BATCH.find(b=>b.k===kind).t;const T=targets(kind);const ok=T.filter(x=>!x.skip);$('bTitle').textContent=t;
  let form='';const v=B.vals;
  if(kind==='valid')form=`<div class="g3"><div class="fr"><label class="fl"><span class="rq">*</span>效期管理</label><div class="radios">${['是','否'].map(x=>`<label><input type="radio" name="bv" ${v.validP===x?'checked':''} onchange="B.vals.validP='${x}';renderBatch()">${x}</label>`).join('')}</div></div>${v.validP==='是'?`<div class="fr"><label class="fl"><span class="rq">*</span>保质期</label><div style="display:flex;gap:6px"><input type="number" min="1" value="${esc(v.period)}" onchange="B.vals.period=this.value"><select style="width:80px" onchange="B.vals.periodUnit=this.value">${['天','月','年'].map(u=>`<option${u===v.periodUnit?' selected':''}>${u}</option>`).join('')}</select></div></div>`:''}</div><div class="fh" style="margin-top:6px">商品和它的货品（标品货品、非标品的成品）一起改；原料的效期在原料上单独改</div>`;
  if(kind==='vendor')form=`<table style="max-width:560px"><thead><tr><th>仓库</th><th>默认供应商</th></tr></thead><tbody>${WAREHOUSES.map(w=>`<tr><td>${w}</td><td><select onchange="B.vals.vendor['${w}']=this.value">${opts(VENDORS,v.vendor[w],'不修改')}</select></td></tr>`).join('')}</tbody></table>`;
  if(kind==='over')form=`<table style="max-width:560px"><thead><tr><th>仓库</th><th>入库超收比例</th></tr></thead><tbody>${WAREHOUSES.map(w=>`<tr><td>${w}</td><td><div style="display:flex;gap:6px;align-items:center"><input type="number" min="0" max="99" style="width:100px" value="${v.over[w]}" onchange="B.vals.over['${w}']=this.value">%</div></td></tr>`).join('')}</tbody></table>`;
  if(kind==='qc')form=`<div class="g3"><div class="fr"><label class="fl">公司质检扣点</label><div style="display:flex;gap:6px;align-items:center"><input type="number" min="0" max="99" value="${esc(v.fee)}" placeholder="不填不修改" onchange="B.vals.fee=this.value">%</div></div><div class="fr"><label class="fl">质检拒收下限</label><div style="display:flex;gap:6px;align-items:center"><input type="number" min="0" max="99" value="${esc(v.rej)}" placeholder="不填不修改" onchange="B.vals.rej=this.value">%</div></div></div>`;
  let h=`${form?`<div class="sec"><div class="sec-hd">设置</div><div class="sec-bd">${form}</div></div>`:''}
    <div class="sec"><div class="sec-hd">影响范围<span class="tip">已选 ${SEL.size} 个商品 → ${T.length} 个对象，将修改 ${ok.length} 个，跳过 ${T.length-ok.length} 个</span></div><div class="sec-bd" style="padding:0">
    <table><thead><tr><th>对象编码</th><th>类型</th><th>名称</th><th>所属商品</th><th>当前值</th><th>结果</th></tr></thead><tbody>${T.map(x=>`<tr><td class="mono">${x.code}</td><td>${x.type}</td><td>${esc(x.name||'—')}</td><td>${esc(x.spu)}</td><td>${esc(x.cur)}</td>
      <td>${B.done?(x.skip?`<span class="res-skip">跳过：${x.skip}</span>`:'<span class="res-ok">✓ 已修改</span>'):(x.skip?`<span class="res-skip">跳过：${x.skip}</span>`:`<span class="res-ok">将修改</span>${effectOf(kind,x)?`<div class="fh">${effectOf(kind,x)}</div>`:''}`)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('bBody').innerHTML=h;
  $('bFt').innerHTML=B.done?`<button class="btn pr" onclick="closeBatch()">完成</button>`:`<button class="btn" onclick="closeBatch()">取消</button><button class="btn pr" ${ok.length?'':'disabled'} onclick="submitBatch()">确认修改（${ok.length} 个）</button>`;
  $('mask').classList.add('on');$('dwBatch').classList.add('on')}
function submitBatch(){const {kind,vals:v}=B;if(kind==='valid'&&v.validP==='是'&&!v.period){toast('请输入保质期',true);return}
  if(kind==='qc'&&v.fee===''&&v.rej===''){toast('至少填一项',true);return}
  if(kind==='vendor'&&!Object.values(v.vendor).some(Boolean)){toast('至少给一个仓库选供应商',true);return}
  targets(kind).filter(x=>!x.skip).forEach(x=>{const r=x.ref;
    if(kind==='shelfOn'){r.k.status='在售';log(r.s,'商品',r.k.sku,'批量上架');syncSpuStatus(r.s)}
    if(kind==='shelfOff'){r.k.status='已下架';log(r.s,'商品',r.k.sku,'批量下架');syncSpuStatus(r.s)}
    if(kind==='valid'){Object.assign(r.s.base,{validP:v.validP,period:v.validP==='是'?v.period:'',periodUnit:v.periodUnit});log(r.s,'商品',r.s.spu,'批量设置效期管理（货品同步）')}
    const L=(act)=>{(r.t==='raw'?spusOfRaw(r.o.code):[r.s]).forEach(s=>log(s,'货品',x.code,act))};
    if(kind==='itemOn'){r.o.status='启用';L('批量启用')}
    if(kind==='itemOff'){r.o.status='停用';L('批量停用');if(r.t==='std')r.s.skus.forEach(k=>{if(k.status==='在售'){k.status='已下架';log(r.s,'商品',k.sku,'下架（货品停用联动）')}});if(r.s)syncSpuStatus(r.s)}
    if(kind==='purchY'){r.o.purch='是';L('批量设为可采')}
    if(kind==='purchN'){r.o.purch='否';L('批量设为不可采')}
    if(kind==='vendor'){const e=ext(r.o);WAREHOUSES.forEach(w=>{if(v.vendor[w])e.vendor[w]=v.vendor[w]});L('批量设置默认供应商')}
    if(kind==='over'){const e=ext(r.o);WAREHOUSES.forEach(w=>e.over[w]=v.over[w]);L('批量设置入库超收')}
    if(kind==='qc'){const e=ext(r.o);if(v.fee!=='')e.fee=v.fee;if(v.rej!=='')e.rej=v.rej;L('批量设置质检扣点/拒收下限')}});
  B.done=true;toast('批量修改完成');renderList();renderBatch()}

/* ============ Excel 批量修改 ============ */
const XCOLS=[['SPU 编码','定位用，不能改'],['商品中文名称','能改；校验同建品，原料名、成品名、SKU 名一起联动'],['商品英文名称','能改；校验同建品'],['商品别名','能改'],['产地 / 品牌 / 商品描述','能改'],['效期管理 / 保质期','能改；货品同步'],['保存条件 / 履约方式','能改；货品同步'],['APP是否展示效期','能改'],
  ['商品属性、库存单位、原料','不能改（建品后锁定）'],['SKU 售卖规格数量 / 单位、绑定货品','不能改；要换规格请在编辑里停用旧规格、新加规格'],['货品可采 / 启停用 / 默认供应商 / 质检','不在这个模板里，用「批量操作」']];
let X=null;
function openExcel(){X={step:1};renderExcel()}
function renderExcel(){$('bTitle').textContent='Excel 批量修改';const n=SEL.size||filtered().length;
  let h=`<div class="stepbar">${['① 导出可改数据','② 上传修改后的文件','③ 校验预览','④ 完成'].map((t,i)=>`<span class="${X.step===i+1?'on':''}">${t}</span>`).join('')}</div>`;
  if(X.step===1)h+=`<div class="sec"><div class="sec-hd">导出范围</div><div class="sec-bd">${SEL.size?`按勾选导出 ${SEL.size} 个商品`:`没勾选时按当前筛选导出 ${n} 个商品`}（旧结构、三方商品不导出）<div style="margin-top:10px"><button class="btn pr" onclick="toast('已下载 商品批量修改_20261116.xlsx');X.step=2;renderExcel()">下载可改数据</button></div></div></div>
    <div class="sec"><div class="sec-hd">模板里哪些列能改</div><div class="sec-bd" style="padding:0"><table><thead><tr><th style="width:280px">列</th><th>说明</th></tr></thead><tbody>${XCOLS.map(([c,d])=>`<tr><td>${c}</td><td class="${d.startsWith('不')?'res-err':''}">${d}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(X.step===2)h+=`<div class="sec"><div class="sec-hd">上传</div><div class="sec-bd"><div class="up" style="width:100%;height:110px" onclick="X.step=3;renderExcel()">＋ 选择修改后的文件（.xlsx，最多 2,000 行）</div><div class="fh" style="margin-top:6px">只认下载的模板；表头被改动、SPU 编码不存在时整份文件不能导入</div></div></div>`;
  if(X.step>=3){const rows=[
      {r:2,spu:'SPU261020150003',f:'商品中文名称',o:'三文鱼块',n:'挪威三文鱼块',ok:'通过',fx:'原料名不变（原料被 2 个商品共用）；成品名、SKU 名、BOM 名一起改'},
      {r:3,spu:'SPU261021100005',f:'保质期',o:'180天',n:'90天',ok:'通过',fx:'成品货品同步'},
      {r:4,spu:'SPU261015110001',f:'商品英文名称',o:'Coca-Cola 330ml',n:'可乐 330ml',ok:'英文名称只能包含英文字母、数字和常用符号'},
      {r:5,spu:'SPU261028090002',f:'SKU 售卖规格数量',o:'1',n:'1.5',ok:'这一列不能通过 Excel 改'},
      {r:6,spu:'spu00004127',f:'商品别名',o:'',n:'原条三文鱼',ok:'旧结构商品，迁移后可修改'}];
    const pass=rows.filter(x=>x.ok==='通过');
    h+=`<div class="sec"><div class="sec-hd">校验结果<span class="tip">共 ${rows.length} 处修改，通过 ${pass.length}，不通过 ${rows.length-pass.length}</span></div><div class="sec-bd" style="padding:0"><table><thead><tr><th>行号</th><th>SPU 编码</th><th>列</th><th>原值</th><th>新值</th><th>校验</th><th>联动</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.r}</td><td class="mono">${x.spu}</td><td>${x.f}</td><td>${esc(x.o||'—')}</td><td>${esc(x.n)}</td><td class="${x.ok==='通过'?'res-ok':'res-err'}">${X.step===4&&x.ok==='通过'?'✓ 已修改':x.ok}</td><td class="fh">${x.fx||''}</td></tr>`).join('')}</tbody></table></div></div>
    ${X.step===3?`<div class="fh">不通过的行不会导入，改好后可以单独再传一次。</div>`:''}`;
    $('bFt').innerHTML=X.step===3?`<button class="btn" onclick="X.step=2;renderExcel()">重新上传</button><button class="btn pr" onclick="X.step=4;toast('已导入 ${pass.length} 处修改');renderExcel()">只导入通过的 ${pass.length} 处</button>`:`<button class="btn pr" onclick="closeBatch()">完成</button>`}
  else $('bFt').innerHTML=`<button class="btn" onclick="closeBatch()">取消</button>`;
  $('bBody').innerHTML=h;$('mask').classList.add('on');$('dwBatch').classList.add('on')}

renderList();
</script>
