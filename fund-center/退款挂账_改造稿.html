<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>退款挂账 · 改造稿</title>
<style>
:root{--pri:#1677ff;--bd:#f0f0f0;--bd2:#d9d9d9;--tx:#1f1f1f;--tx2:#595959;--tx3:#8c8c8c;--bg:#f5f5f5;--ok:#52c41a;--warn:#fa8c16;--err:#ff4d4f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5715 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg)}
.layout{display:flex;min-height:100vh}
.side{width:208px;background:#fff;border-right:1px solid var(--bd);flex-shrink:0;padding-bottom:20px}
.logo{height:56px;display:flex;align-items:center;padding:0 20px;font-weight:600;font-size:15px;border-bottom:1px solid var(--bd)}
.grp{padding:14px 20px 6px;color:var(--tx3);font-size:12px}
.mi{padding:9px 20px 9px 36px;color:var(--tx2);cursor:default}
.mi.on{color:var(--pri);background:#e6f4ff;border-right:3px solid var(--pri)}
.main{flex:1;min-width:0}
.hd{height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 24px;gap:12px}
.hd .sp{flex:1}
.content{padding:20px 24px 40px}
.crumb{color:var(--tx3);font-size:12px}
.title{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.title h1{font-size:20px;font-weight:600}
.title .sp{flex:1}
.btn{height:30px;padding:0 14px;border:1px solid var(--bd2);border-radius:6px;background:#fff;cursor:pointer;font-size:13px;color:var(--tx)}
.btn:hover{color:var(--pri);border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{opacity:.88;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ipt{height:30px;border:1px solid var(--bd2);border-radius:6px;padding:0 10px;font-size:13px;background:#fff}
.muted{color:var(--tx3)}
.tag{display:inline-block;padding:0 7px;line-height:20px;border-radius:4px;font-size:12px;border:1px solid}
.tag.green{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}
.tag.orange{color:#d46b08;background:#fff7e6;border-color:#ffd591}
.tag.red{color:#cf1322;background:#fff1f0;border-color:#ffa39e}
.tag.gray{color:var(--tx2);background:#fafafa;border-color:var(--bd2)}
.tag.blue{color:#0958d9;background:#e6f4ff;border-color:#91caff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:#fff;border-radius:8px;border:1px solid var(--bd)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--bd)}
.card-h b{font-size:15px}
.card-h .sp{flex:1}
.acct{font-family:Menlo,monospace;font-size:12px;color:var(--tx3)}
.bal{padding:14px 18px 6px}
.bal .k{color:var(--tx3);font-size:12px}
.bal .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse}
table.t td,table.t th{padding:9px 18px;border-top:1px solid var(--bd);text-align:left;font-variant-numeric:tabular-nums}
table.t th{background:#fafafa;color:var(--tx2);font-weight:500;font-size:12px}
table.t td.num,table.t th.num{text-align:right}
tr.type{cursor:pointer}
tr.type:hover td{background:#f5faff}
tr.sum td{font-weight:600;background:#fafafa}
tr.diff td{font-weight:600}
.neg{color:var(--err)}
.sub{font-size:12px;color:var(--tx3);margin-top:2px}
.bar{height:6px;background:#f0f0f0;border-radius:3px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx2)}
.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.adv>div{padding:16px 18px;border-right:1px solid var(--bd)}
.adv>div:last-child{border-right:0}
.adv .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.link{color:var(--pri);cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:760px;max-width:100vw;background:#fff;z-index:11;display:none;flex-direction:column;box-shadow:-6px 0 16px rgba(0,0,0,.08)}
.dr-h{height:56px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--bd);font-size:16px;font-weight:600}
.dr-h .x{margin-left:auto;cursor:pointer;color:var(--tx3);font-weight:400}
.dr-b{flex:1;overflow:auto;padding:16px 24px}
.dr-f{padding:12px 24px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.desc{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--bd);border-radius:6px;margin-bottom:16px}
.desc>div{padding:10px 14px;border-right:1px solid var(--bd)}
.desc>div:last-child{border-right:0}
.desc dt{color:var(--tx3);font-size:12px}
.desc dd{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.modal{position:fixed;left:50%;top:12%;transform:translateX(-50%);width:520px;max-width:calc(100vw - 32px);background:#fff;border-radius:8px;z-index:13;display:none;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.mask2{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:12}
.fr{margin-bottom:14px}
.fr label{display:block;margin-bottom:6px;color:var(--tx2)}
.fr label.req:before{content:"* ";color:var(--err)}
.radio{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd2);border-radius:6px;margin-bottom:6px;cursor:pointer}
.radio.on{border-color:var(--pri);background:#f5faff}
.radio .sp{flex:1}
.err{color:var(--err);font-size:12px;margin-top:4px;min-height:18px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);padding:9px 16px;border-radius:8px;z-index:20;display:none}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tab{padding:8px 0;cursor:pointer;color:var(--tx2)}
.tab.on{color:var(--pri);border-bottom:2px solid var(--pri)}
@media (max-width:1280px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<style>
.ov{display:flex;align-items:center;gap:28px;background:#fff;border:1px solid var(--bd);border-left:3px solid #cf1322;border-radius:8px;padding:12px 18px;margin-bottom:16px}
.ov b{font-weight:600;font-variant-numeric:tabular-nums}
.flt{background:#fff;border:1px solid var(--bd);border-radius:0;padding:14px 18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.flt .fi{display:flex;flex-direction:column;gap:6px}
.flt .fi label{color:var(--tx3);font-size:12px}
.flt .sp{flex:1}
.tbox{background:#fff;border:1px solid var(--bd);border-radius:8px 8px 0 0;padding:0 18px;border-bottom:0}
.tbox .tabs{margin:0;border-bottom:0}
.tw{background:#fff;border:1px solid var(--bd);border-top:0;border-radius:0 0 8px 8px;overflow:auto}
table.l{width:100%;border-collapse:collapse;white-space:nowrap}
table.l th{background:#fafafa;color:var(--tx2);font-weight:500;text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd)}
table.l td{padding:11px 12px;border-bottom:1px solid var(--bd)}
table.l .num{text-align:right;font-variant-numeric:tabular-nums}
.pg{display:flex;justify-content:flex-end;padding:12px 18px;color:var(--tx3)}
.site{color:#cf1322;border:1px solid #ffa39e;background:#fff1f0;border-radius:12px;padding:0 10px;font-size:12px;line-height:22px}
.prog{height:6px;background:#f0f0f0;border-radius:3px;width:90px;display:inline-block;vertical-align:middle;margin-right:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
</style>
<div class="layout">
  <div class="side">
    <div class="logo">磐石 Aegis</div>
    <div class="grp">出款管理</div><div class="mi">付款单出款</div><div class="mi">平台账户提现</div>
    <div class="grp">渠道资金</div><a class="mi" style="display:block;text-decoration:none" href="资金总览_账户概览_改造稿.html">资金总览（多渠道）</a><a class="mi" style="display:block;text-decoration:none" href="渠道账户_改造稿.html">渠道账户</a><a class="mi" style="display:block;text-decoration:none" href="财务交易流水_改造稿.html">财务交易流水</a><a class="mi" style="display:block;text-decoration:none" href="资金划转_改造稿.html">资金划转</a><div class="mi on">退款挂账</div>
    <div class="grp">垫资管理</div><a class="mi" style="display:block;text-decoration:none" href="垫资管理_改造稿.html">垫资管理</a>
  </div>
  <div class="main">
    <div class="hd"><span class="sp"></span><span class="muted">简体中文</span><span>沈亮</span></div>
    <div class="content" id="ct"></div>
  </div>
</div>
<div class="mask" id="mask" onclick="closeDr()"></div>
<div class="drawer" id="dr"><div class="dr-h"><span id="drT"></span><span class="x" onclick="closeDr()">✕</span></div><div class="dr-b" id="drB"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const fmt=n=>(n<0?'-':'')+'S$'+Math.abs(r2(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
/* 退款记录：已结给商家的 → 负应付挂账；还没结给商家的 → 下期结算单直接少算，不挂账 */
const RF=[
 {rf:'RF2610090001',order:'SO2610080207',mer:'Fresh Greens Trading',shop:'SH20260713476005',time:'2026-10-09 09:30',refund:100,paid:true,js:'JS2610050003',neg:85,ded:[]},
 {rf:'RF2610080005',order:'SO2610060031',mer:'Prime Meat Supply',shop:'SH2026081200001',time:'2026-10-08 16:40',refund:100,paid:true,js:'JS2609280002',neg:85,ded:[['JS2610050003','2026-10-08 12:00',85]]},
 {rf:'RF2610030002',order:'SO2609280112',mer:'ZZ QA 测试商家',shop:'ZZQA0722M1',time:'2026-10-03 14:20',refund:168,paid:true,js:'JS2609280002',neg:142.80,ded:[['JS2610050003','2026-10-08 12:00',60]]},
 {rf:'RF2610020011',order:'SO2609300045',mer:'Ocean Catch Seafood',shop:'SH20260716476017',time:'2026-10-02 10:05',refund:56.40,paid:true,js:'JS2609280002',neg:47.94,ded:[]},
 {rf:'RF2610070003',order:'SO2610060112',mer:'ZZ QA 测试商家',shop:'ZZQA0722S1',time:'2026-10-07 15:12',refund:36.86,paid:false,js:'',neg:0,ded:[]},
 {rf:'RF2610070004',order:'SO2610060113',mer:'ZZ QA 测试商家',shop:'ZZQA0722S2',time:'2026-10-07 15:13',refund:36.21,paid:false,js:'',neg:0,ded:[]},
 {rf:'RF2610080009',order:'SO2610070201',mer:'Golden Harvest Produce',shop:'SH2026082800001',time:'2026-10-08 11:02',refund:120,paid:false,js:'',neg:0,ded:[]}];
const dsum=r=>r2(r.ded.reduce((s,d)=>s+d[2],0));
const left=r=>r2(r.neg-dsum(r));
const st=r=>!r.paid?'无需挂账':left(r)<=0?'已抵扣':dsum(r)>0?'部分抵扣':'待抵扣';
const ST={待抵扣:'orange',部分抵扣:'blue',已抵扣:'green',无需挂账:'gray'};
let Q={tab:'open',kw:'',st:''};
function list(){return RF.filter(r=>(Q.tab==='open'?r.paid&&left(r)>0:Q.tab==='done'?r.paid&&left(r)<=0:true)&&(!Q.st||st(r)===Q.st)&&(!Q.kw||[r.mer,r.shop,r.order,r.rf].some(x=>x.toLowerCase().includes(Q.kw.toLowerCase())))).sort((a,b)=>b.time.localeCompare(a.time))}
function render(){
  const open=RF.filter(r=>r.paid&&left(r)>0),amt=r2(open.reduce((s,r)=>s+left(r),0)),mers=new Set(open.map(r=>r.mer)).size;
  const rs=list();
  $('ct').innerHTML=`<div class="crumb">渠道资金 / 退款挂账</div>
  <div class="title"><h1>退款挂账</h1><span class="muted">钱已经结给商家后才发生的退款，记商家负应付，下期结算少付</span><span class="sp"></span><span class="site">当前 site：新加坡</span></div>
  <div class="ov"><b>待抵扣</b><span>笔数 <b>${open.length}</b></span><span>金额 <b style="color:var(--err)">${fmt(amt)}</b></span><span>涉及商家 <b>${mers}</b></span><span class="muted">下一次结算：2026-10-14（周三）12:00</span></div>
  <div class="tbox"><div class="tabs">${[['open','待抵扣',RF.filter(r=>r.paid&&left(r)>0).length],['done','已抵扣',RF.filter(r=>r.paid&&left(r)<=0).length],['all','全部退款',RF.length]].map(([k,l,n])=>`<div class="tab ${Q.tab===k?'on':''}" onclick="Q.tab='${k}';Q.st='';render()">${l}（${n}）</div>`).join('')}</div></div>
  <div class="flt"><div class="fi"><label>商家名称 / 店铺编码 / 订单编号 / 退款资金单</label><input class="ipt" style="width:320px" placeholder="请输入" value="${Q.kw}" onchange="Q.kw=this.value;render()"></div>
   ${Q.tab==='all'?`<div class="fi"><label>处理状态</label><select class="ipt" style="width:140px" onchange="Q.st=this.value;render()"><option value="">全部</option>${Object.keys(ST).map(x=>`<option ${Q.st===x?'selected':''}>${x}</option>`).join('')}</select></div>`:''}
   <div class="fi"><label>退款时间</label><div style="display:flex;gap:6px;align-items:center"><input class="ipt" style="width:120px" value="2026-10-01"><span class="muted">→</span><input class="ipt" style="width:120px" value="2026-10-09"></div></div>
   <button class="btn" onclick="Q={tab:Q.tab,kw:'',st:''};render()">重 置</button><span class="sp"></span><button class="btn" onclick="toast('已导出')">导出</button></div>
  <div class="tw"><table class="l"><thead><tr><th>退款时间</th><th>商家</th><th>订单编号</th><th>退款资金单</th><th class="num">退款金额</th><th>处理方式</th><th class="num">负应付</th><th class="num">已抵扣</th><th class="num">待抵扣</th><th>抵扣进度</th><th>状态</th><th>操作</th></tr></thead><tbody>
  ${rs.map(r=>{const s=st(r),p=r.neg?Math.min(100,dsum(r)/r.neg*100):0;return `<tr><td>${r.time}</td><td>${r.mer}<div class="muted" style="font-size:12px">${r.shop}</div></td><td><span class="link" onclick="toast('打开销售订单 ${r.order}')">${r.order}</span></td><td><span class="link" onclick="toast('打开退款资金单 ${r.rf}')">${r.rf}</span></td>
   <td class="num">${fmt(r.refund)}</td><td>${r.paid?`已结给商家（${r.js}）<div class="muted" style="font-size:12px">记负应付，下期少付</div>`:'<span class="muted">还没结给商家，下期结算单直接少算</span>'}</td>
   <td class="num">${r.paid?fmt(r.neg):'—'}</td><td class="num">${r.paid?fmt(dsum(r)):'—'}</td><td class="num" style="${left(r)>0?'color:var(--err);font-weight:600':''}">${r.paid?fmt(left(r)):'—'}</td>
   <td>${r.paid?`<span class="prog"><i style="width:${p}%"></i></span>${Math.round(p)}%`:'—'}</td><td>${tag(s,ST[s])}</td><td><span class="link" onclick="openD('${r.rf}')">详情</span></td></tr>`}).join('')||'<tr><td colspan="12" style="text-align:center;color:var(--tx3);padding:40px">暂无数据</td></tr>'}
  </tbody></table><div class="pg">共 ${rs.length} 条</div></div>`;
}
let DR=null;
function openDr(fn){DR=fn;$('mask').style.display='block';$('dr').style.display='flex';const r=DR();$('drT').innerHTML=r.t;$('drB').innerHTML=r.b}
function closeDr(){DR=null;$('mask').style.display='none';$('dr').style.display='none'}
function openD(rf){const r=RF.find(x=>x.rf===rf);openDr(()=>({t:'退款挂账详情',b:`<table class="t" style="border:1px solid var(--bd);margin-bottom:18px"><tbody>${[
  ['商家',`${r.mer}（${r.shop}）`],['订单编号',r.order],['退款资金单',`<span class="link">${r.rf}</span>`],['退款时间',r.time],['退款金额',fmt(r.refund)],
  ['退款时这笔订单的钱在哪',r.paid?`已在结算单 <span class="link">${r.js}</span> 中结给商家`:'还在 Holding，未结给商家'],
  ['处理方式',r.paid?'给商家记负应付，从后续结算款中少付；Holding 少付的部分补回线上收单金额':'下期结算单里这笔订单按退款后金额结算，不挂账'],
  ['负应付',r.paid?fmt(r.neg):'—'],['已抵扣 / 待抵扣',r.paid?`${fmt(dsum(r))} / ${fmt(left(r))}`:'—'],['状态',tag(st(r),ST[st(r)])]].map(([k,v])=>`<tr><td class="muted" style="width:170px">${k}</td><td>${v}</td></tr>`).join('')}</tbody></table>
  ${r.paid?`<div style="font-weight:600;margin-bottom:8px">抵扣记录</div><table class="t" style="border:1px solid var(--bd)"><thead><tr><th>结算单</th><th>打款时间</th><th class="num">本次抵扣</th><th class="num">抵扣后待抵扣</th></tr></thead><tbody>${r.ded.length?(()=>{let rest=r.neg;return r.ded.map(d=>{rest=r2(rest-d[2]);return `<tr><td><span class="link">${d[0]}</span></td><td>${d[1]}</td><td class="num">${fmt(d[2])}</td><td class="num">${fmt(rest)}</td></tr>`}).join('')})():'<tr><td colspan="4" style="text-align:center;color:var(--tx3);padding:24px">还没有抵扣，下一次结算（10-14 12:00）自动抵扣</td></tr>'}</tbody></table>`:''}`}))}
render();
</script>
</body>
</html>
