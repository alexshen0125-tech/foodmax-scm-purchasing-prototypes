<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资金划转 · 改造稿</title>
<style>
:root{--pri:#1677ff;--bd:#f0f0f0;--bd2:#d9d9d9;--tx:#1f1f1f;--tx2:#595959;--tx3:#8c8c8c;--bg:#f5f5f5;--ok:#52c41a;--warn:#fa8c16;--err:#ff4d4f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5715 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg)}
.layout{display:flex;min-height:100vh}
.side{width:208px;background:#fff;border-right:1px solid var(--bd);flex-shrink:0;padding-bottom:20px}
.logo{height:56px;display:flex;align-items:center;padding:0 20px;font-weight:600;font-size:15px;border-bottom:1px solid var(--bd)}
.grp{padding:14px 20px 6px;color:var(--tx3);font-size:12px}
.mi{padding:9px 20px 9px 36px;color:var(--tx2);cursor:default}
.mi.on{color:var(--pri);background:#e6f4ff;border-right:3px solid var(--pri)}
.main{flex:1;min-width:0}
.hd{height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 24px;gap:12px}
.hd .sp{flex:1}
.content{padding:20px 24px 40px}
.crumb{color:var(--tx3);font-size:12px}
.title{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.title h1{font-size:20px;font-weight:600}
.title .sp{flex:1}
.btn{height:30px;padding:0 14px;border:1px solid var(--bd2);border-radius:6px;background:#fff;cursor:pointer;font-size:13px;color:var(--tx)}
.btn:hover{color:var(--pri);border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{opacity:.88;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ipt{height:30px;border:1px solid var(--bd2);border-radius:6px;padding:0 10px;font-size:13px;background:#fff}
.muted{color:var(--tx3)}
.tag{display:inline-block;padding:0 7px;line-height:20px;border-radius:4px;font-size:12px;border:1px solid}
.tag.green{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}
.tag.orange{color:#d46b08;background:#fff7e6;border-color:#ffd591}
.tag.red{color:#cf1322;background:#fff1f0;border-color:#ffa39e}
.tag.gray{color:var(--tx2);background:#fafafa;border-color:var(--bd2)}
.tag.blue{color:#0958d9;background:#e6f4ff;border-color:#91caff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:#fff;border-radius:8px;border:1px solid var(--bd)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--bd)}
.card-h b{font-size:15px}
.card-h .sp{flex:1}
.acct{font-family:Menlo,monospace;font-size:12px;color:var(--tx3)}
.bal{padding:14px 18px 6px}
.bal .k{color:var(--tx3);font-size:12px}
.bal .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse}
table.t td,table.t th{padding:9px 18px;border-top:1px solid var(--bd);text-align:left;font-variant-numeric:tabular-nums}
table.t th{background:#fafafa;color:var(--tx2);font-weight:500;font-size:12px}
table.t td.num,table.t th.num{text-align:right}
tr.type{cursor:pointer}
tr.type:hover td{background:#f5faff}
tr.sum td{font-weight:600;background:#fafafa}
tr.diff td{font-weight:600}
.neg{color:var(--err)}
.sub{font-size:12px;color:var(--tx3);margin-top:2px}
.bar{height:6px;background:#f0f0f0;border-radius:3px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx2)}
.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.adv>div{padding:16px 18px;border-right:1px solid var(--bd)}
.adv>div:last-child{border-right:0}
.adv .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.link{color:var(--pri);cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:760px;max-width:100vw;background:#fff;z-index:11;display:none;flex-direction:column;box-shadow:-6px 0 16px rgba(0,0,0,.08)}
.dr-h{height:56px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--bd);font-size:16px;font-weight:600}
.dr-h .x{margin-left:auto;cursor:pointer;color:var(--tx3);font-weight:400}
.dr-b{flex:1;overflow:auto;padding:16px 24px}
.dr-f{padding:12px 24px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.desc{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--bd);border-radius:6px;margin-bottom:16px}
.desc>div{padding:10px 14px;border-right:1px solid var(--bd)}
.desc>div:last-child{border-right:0}
.desc dt{color:var(--tx3);font-size:12px}
.desc dd{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.modal{position:fixed;left:50%;top:12%;transform:translateX(-50%);width:520px;max-width:calc(100vw - 32px);background:#fff;border-radius:8px;z-index:13;display:none;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.mask2{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:12}
.fr{margin-bottom:14px}
.fr label{display:block;margin-bottom:6px;color:var(--tx2)}
.fr label.req:before{content:"* ";color:var(--err)}
.radio{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd2);border-radius:6px;margin-bottom:6px;cursor:pointer}
.radio.on{border-color:var(--pri);background:#f5faff}
.radio .sp{flex:1}
.err{color:var(--err);font-size:12px;margin-top:4px;min-height:18px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);padding:9px 16px;border-radius:8px;z-index:20;display:none}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tab{padding:8px 0;cursor:pointer;color:var(--tx2)}
.tab.on{color:var(--pri);border-bottom:2px solid var(--pri)}
@media (max-width:1280px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<style>
.flt{background:#fff;border:1px solid var(--bd);border-radius:8px 8px 0 0;padding:14px 18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.flt .fi{display:flex;flex-direction:column;gap:6px}
.flt .fi label{color:var(--tx3);font-size:12px}
.flt .sp{flex:1}
.tw{background:#fff;border:1px solid var(--bd);border-top:0;border-radius:0 0 8px 8px;overflow:auto}
table.l{width:100%;border-collapse:collapse;white-space:nowrap}
table.l th{background:#fafafa;color:var(--tx2);font-weight:500;text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd)}
table.l td{padding:11px 12px;border-bottom:1px solid var(--bd)}
table.l .num{text-align:right;font-variant-numeric:tabular-nums}
.site{color:#cf1322;border:1px solid #ffa39e;background:#fff1f0;border-radius:12px;padding:0 10px;font-size:12px;line-height:22px}
.route{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:8px;margin-bottom:14px}
.route .box{border:1px solid var(--bd);border-radius:8px;padding:10px 14px;background:#fafafa}
.route .box .k{color:var(--tx3);font-size:12px}
.route .box .v{font-weight:600;margin-top:2px}
.route .arr{text-align:center;color:var(--tx3);font-size:20px}
.mono{font-family:Menlo,monospace;font-size:12px}
</style>
<div class="layout">
  <div class="side">
    <div class="logo">磐石 Aegis</div>
    <div class="grp">渠道资金</div><a class="mi" style="display:block;text-decoration:none" href="资金总览_账户概览_改造稿.html">资金总览（多渠道）</a><a class="mi" style="display:block;text-decoration:none" href="渠道账户_改造稿.html">渠道账户</a><a class="mi" style="display:block;text-decoration:none" href="财务交易流水_改造稿.html">财务交易流水</a><div class="mi on">资金划转</div><a class="mi" style="display:block;text-decoration:none" href="退款挂账_改造稿.html">退款挂账</a>
    <div class="grp">垫资管理</div><a class="mi" style="display:block;text-decoration:none" href="垫资管理_改造稿.html">垫资管理</a><a class="mi" style="display:block;text-decoration:none" href="垫资管理_改造稿.html#docs">垫资单管理</a>
  </div>
  <div class="main">
    <div class="hd"><span class="sp"></span><span class="muted">简体中文</span><span>沈亮</span></div>
    <div class="content" id="ct"></div>
  </div>
</div>
<div class="mask" id="mask" onclick="closeDr()"></div>
<div class="drawer" id="dr"><div class="dr-h"><span id="drT"></span><span class="x" onclick="closeDr()">✕</span></div><div class="dr-b" id="drB"></div><div class="dr-f" id="drF"></div></div>
<div class="mask2" id="mask2"></div>
<div class="modal" id="md" style="width:640px"><div class="dr-h"><span id="mdT"></span><span class="x" onclick="closeMd()">✕</span></div><div class="dr-b" id="mdB"></div><div class="dr-f" id="mdF"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const fmt=n=>(n<0?'-':'')+'S$'+Math.abs(r2(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
/* 各账户各类余额（与资金总览一致） */
const BAL={'PA.FEE':1235.20,'PA.TERMC':5800.00,'PA.TERMU':2650.00,'PA.ONL':0,'HA.ONL':17630.30,'HA.TERM':9500.00,'HA.ADV':0,'HA.HANG':0,'CA.COM':12480.00,'CA.SELF':1860.00};
const NAME={'PA.FEE':'平台主账户 · 手续费备用金','PA.TERMC':'平台主账户 · 账期还款 · 已认领','PA.TERMU':'平台主账户 · 账期还款 · 未认领','HA.TERM':'Holding · 账期还款金额','HA.ADV':'Holding · 平台垫资金额','HA.ONL':'Holding · 线上收单金额','HA.HANG':'Holding · 佣金挂账','CA.COM':'佣金账户 · 佣金收入','CA.SELF':'佣金账户 · 自营收入'};
const WATER={low:1000,target:5000};
/* 划转类型 → 绑定转出 / 转入（不可改）；AUTO 为系统自动，不能手工新建 */
const TYPES={
 TERM:{name:'账期回款转 Holding',from:['PA.TERMC'],to:'HA.TERM',basis:'认领单',hint:'只有已认领（已关联订单）的账期回款能转；其中垫资订单挂着的佣金进 Holding · 佣金挂账，随后自动分账'},
 FEE:{name:'补手续费备用金',from:['CA.COM'],to:'PA.FEE',basis:'备用金水位',hint:'平台主账户手续费备用金低于水位时补足'},
 FEEBACK:{name:'手续费备用金回收',from:['PA.FEE'],to:'CA.COM',basis:'备用金水位',hint:'手续费备用金超过需要时，收回佣金账户'},
 ADV:{name:'垫资',from:['CA.COM'],to:'HA.ADV',basis:'垫资单',hint:'按垫资单逐单垫（账期未认领订单，扣佣金后的金额），垫资单在垫资管理发起'},
 BACK:{name:'垫资收回',from:['HA.TERM'],to:'CA.COM',basis:'垫资单 · 订单',hint:'只能收回客户钱已认领并转进 Holding 的垫资订单，按订单收回'},
 AUTO:{name:'佣金挂账分账（系统自动）',from:['HA.HANG'],to:'CA.COM',basis:'订单',hint:'',auto:true}};
/* 已认领、未转 Holding 的认领单（含二维码自动关联） */
const CLAIMS=[{no:'CL20261008-0001',cust:'Mei Ling Eatery',amt:5800,hang:[['261001045600000044','AF20261008-0001',220]]}];
/* 垫资：待转账的垫资单；可收回的垫资订单 */
const ADV_PENDING=[];
const BACKABLE=[{ad:'AF20261001-0001',order:'260923045600000017',cust:'Sunny Bistro',amt:1450}];
let TRS=[
 {no:'TR20261001-0001',type:'FEE',amt:1242.95,parts:[['CA.COM',1242.95]],basis:'备用金低于水位（当时 −7.75），补至目标额',st:'已完成',by:'沈亮',time:'2026-10-01 09:10',att:[['TR20261001-0001-01','2026-10-01 09:12','SETTLED']]},
 {no:'TR20261006-0003',type:'TERM',amt:4200,parts:[['PA.TERMC',4200]],dest:[['HA.TERM',4050],['HA.HANG',150]],basis:'认领单 CL20261006-0001 · Golden Wok Restaurant（含垫资订单 260922045600000031 挂账佣金 150.00）',st:'已完成',by:'沈亮',time:'2026-10-06 15:20',att:[['TR20261006-0003-01','2026-10-06 15:30','SETTLED']]},
 {no:'TR20261006-0004',type:'AUTO',amt:150,parts:[['HA.HANG',150]],basis:'订单 260922045600000031 挂账佣金：客户钱已认领到账，自动分账',st:'已完成',by:'系统',time:'2026-10-06 15:31',att:[['TR20261006-0004-01','2026-10-06 15:31','SETTLED']]},
 {no:'TR20261008-0002',type:'TERM',amt:2650,parts:[['PA.TERMC',2650]],dest:[['HA.TERM',2500],['HA.HANG',150]],basis:'认领单 CL20261007-0002 · Sunny Bistro（含垫资订单 260923045600000017 挂账佣金 150.00）',st:'已完成',by:'沈亮',time:'2026-10-08 13:52',att:[['TR20261008-0002-01','2026-10-08 13:55','insufficient_fund'],['TR20261008-0002-02','2026-10-08 14:00','SETTLED']]},
 {no:'TR20261008-0003',type:'AUTO',amt:150,parts:[['HA.HANG',150]],basis:'订单 260923045600000017 挂账佣金：客户钱已认领到账，自动分账',st:'已完成',by:'系统',time:'2026-10-08 14:01',att:[['TR20261008-0003-01','2026-10-08 14:01','SETTLED']]},
 {no:'TR20261009-0002',type:'BACK',amt:1850,parts:[['HA.TERM',1850]],basis:'垫资单 AF20261001-0001 · 订单 260922045600000031（Golden Wok Restaurant 已还款）',st:'已完成',by:'沈亮',time:'2026-10-09 10:00',att:[['TR20261009-0002-01','2026-10-09 10:05','SETTLED']]},
 {no:'TR20261009-0003',type:'TERM',amt:1280,parts:[['PA.TERMC',1280]],dest:[['HA.TERM',1280]],basis:'二维码还款 · Ah Hock Kitchen（付款时自动关联订单，无需人工认领）',st:'已完成',by:'沈亮',time:'2026-10-09 10:15',att:[['TR20261009-0003-01','2026-10-09 10:20','SETTLED']]}];
const stC={待审批:'orange',待执行:'blue',已完成:'green',执行失败:'red',已驳回:'gray'};
const used=new Set(TRS.filter(t=>t.type==='TERM').map(t=>t.basis.split(' ')[1]));
const usedBack=new Set();
const destOf=t=>t.dest||[[TYPES[t.type].to,t.amt]];
let Q={type:'',st:''};
function render(){
  const rs=TRS.filter(t=>(!Q.type||t.type===Q.type)&&(!Q.st||t.st===Q.st)).slice().reverse();
  $('ct').innerHTML=`<div class="crumb">渠道资金 / 资金划转</div>
  <div class="title"><h1>资金划转</h1><span class="muted">平台账户之间转钱：选划转类型，转出、转入账户自动带出；佣金挂账分账由系统自动生成</span><span class="sp"></span><span class="site">当前 site：新加坡</span></div>
  <div class="flt"><div class="fi"><label>划转类型</label><select class="ipt" style="width:180px" onchange="Q.type=this.value;render()"><option value="">全部</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${Q.type===k?'selected':''}>${v.name}</option>`).join('')}</select></div>
   <div class="fi"><label>状态</label><select class="ipt" style="width:140px" onchange="Q.st=this.value;render()"><option value="">全部</option>${Object.keys(stC).map(s=>`<option ${Q.st===s?'selected':''}>${s}</option>`).join('')}</select></div>
   <div class="fi"><label>划转单号</label><input class="ipt" style="width:180px" placeholder="TR…"></div>
   <button class="btn" onclick="Q={type:'',st:''};render()">重 置</button><span class="sp"></span><button class="btn p" onclick="openNew()">新建划转</button></div>
  <div class="tw"><table class="l"><thead><tr><th>划转单号</th><th>划转类型</th><th>转出</th><th>转入</th><th class="num">金额</th><th>业务依据</th><th>状态</th><th>发起人</th><th>发起时间</th><th>操作</th></tr></thead><tbody>
  ${rs.map(t=>`<tr><td><span class="link" onclick="openTR('${t.no}')">${t.no}</span></td><td>${TYPES[t.type].name}</td><td>${t.parts.map(p=>NAME[p[0]]).join('<br>')}</td><td>${destOf(t).map(d=>NAME[d[0]]).join('<br>')}</td><td class="num">${fmt(t.amt)}</td><td style="white-space:normal;max-width:260px">${t.basis}</td><td>${tag(t.st,stC[t.st])}</td><td>${t.by==='系统'?tag('系统自动','gray'):t.by}</td><td>${t.time}</td><td>${ops(t)}</td></tr>`).join('')||'<tr><td colspan="10" style="text-align:center;color:var(--tx3);padding:40px">暂无数据</td></tr>'}
  </tbody></table></div>`;
}
const ops=t=>(t.st==='待审批'?`<span class="link" onclick="act('${t.no}','approve')" style="margin-right:10px">审批通过</span><span class="link" onclick="act('${t.no}','reject')" style="margin-right:10px">驳回</span>`:t.st==='待执行'?`<span class="link" onclick="act('${t.no}','exec')" style="margin-right:10px">执行</span>`:t.st==='执行失败'?`<span class="link" onclick="act('${t.no}','exec')" style="margin-right:10px">重试</span>`:'')+`<span class="link" onclick="openTR('${t.no}')">详情</span>`;
/* 新建 */
let N={};
function openNew(){N={type:'TERM',claim:'',amt:'',adv:'',bsel:{}};$('mdT').textContent='新建资金划转';paintNew();$('mdF').innerHTML=`<button class="btn" onclick="closeMd()">取消</button><button class="btn p" onclick="submitNew()">提交审批</button>`;$('mask2').style.display='block';$('md').style.display='flex'}
function splitOf(c){const h=r2(c.hang.reduce((s,x)=>s+x[2],0));return h?[['HA.TERM',r2(c.amt-h)],['HA.HANG',h]]:[['HA.TERM',c.amt]]}
function defAmt(){const t=N.type;if(t==='FEEBACK')return Math.max(0,r2(BAL['PA.FEE']-WATER.target)).toFixed(2);if(t==='FEE')return Math.max(0,r2(WATER.target-BAL['PA.FEE'])).toFixed(2);if(t==='TERM'){const c=CLAIMS.find(c=>c.no===N.claim);return c?c.amt.toFixed(2):''}if(t==='BACK'){return r2(BACKABLE.filter(o=>N.bsel[o.order]).reduce((s,o)=>s+o.amt,0)).toFixed(2)}return ''}
function paintNew(){
  const T=TYPES[N.type],fromBal=r2(T.from.reduce((s,k)=>s+BAL[k],0));
  let basis='',route='';
  if(N.type==='TERM'){const cs=CLAIMS.filter(c=>!used.has(c.no));const c=cs.find(x=>x.no===N.claim);
    basis=`<div class="fr"><label class="req">认领单（只列已认领、未转 Holding 的）</label><select class="ipt" style="width:100%" onchange="N.claim=this.value;paintNew()"><option value="">请选择</option>${cs.map(c=>`<option value="${c.no}" ${N.claim===c.no?'selected':''}>${c.no} · ${c.cust} · ${fmt(c.amt)}</option>`).join('')}</select><div class="muted" style="font-size:12px;margin-top:4px">未认领的 ${fmt(BAL['PA.TERMU'])} 不能转，请先在认领页认领到订单；二维码还款付款时已自动关联订单</div></div>`;
    if(c){const sp=splitOf(c);route=`<div class="fr"><label>转入拆分（系统按订单自动拆）</label><table class="t" style="border:1px solid var(--bd)"><thead><tr><th>转入</th><th>说明</th><th class="num">金额</th></tr></thead><tbody>${sp.map(([k,v])=>`<tr><td>${NAME[k]}</td><td class="muted" style="font-size:12px">${k==='HA.HANG'?c.hang.map(h=>`垫资订单 ${h[0]}（${h[1]}）挂账佣金`).join('；')+'，到账后自动分账到佣金账户':'对应订单的货款部分；垫资订单的这部分之后在垫资管理按订单收回'}</td><td class="num">${fmt(v)}</td></tr>`).join('')}</tbody></table></div>`}}
  if(N.type==='FEE')basis=`<div class="fr"><label>业务依据</label><div class="muted">手续费备用金当前 ${fmt(BAL['PA.FEE'])}，低水位 ${fmt(WATER.low)}，目标额 ${fmt(WATER.target)}；默认补足到目标额</div></div>`;
  if(N.type==='FEEBACK')basis=`<div class="fr"><label>业务依据</label><div class="muted">手续费备用金当前 ${fmt(BAL['PA.FEE'])}，目标额 ${fmt(WATER.target)}，低水位 ${fmt(WATER.low)}；默认收回超过目标额的部分</div></div>`;
  if(N.type==='ADV')basis=`<div class="fr"><label class="req">垫资单</label><select class="ipt" style="width:100%"><option value="">${ADV_PENDING.length?'请选择':'暂无待转账的垫资单'}</option></select><div class="muted" style="font-size:12px;margin-top:4px">垫资单在「垫资管理」按账期未认领订单发起，金额 = 订单金额 − 佣金，不可改 · <a class="link" href="垫资管理_改造稿.html">去垫资管理</a></div></div>`;
  if(N.type==='BACK'){const os=BACKABLE.filter(o=>!usedBack.has(o.order));basis=`<div class="fr"><label class="req">收回哪些垫资订单（客户钱已认领并转进 Holding）</label><table class="t" style="border:1px solid var(--bd)"><thead><tr><th></th><th>订单</th><th>垫资单</th><th>客户</th><th class="num">收回金额</th></tr></thead><tbody>${os.map(o=>`<tr><td><input type="checkbox" ${N.bsel[o.order]?'checked':''} onchange="N.bsel['${o.order}']=this.checked;paintNew()"></td><td>${o.order}</td><td>${o.ad}</td><td>${o.cust}</td><td class="num">${fmt(o.amt)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:center">暂无可收回的订单</td></tr>'}</tbody></table></div>`}
  const amt=defAmt(),ro=['TERM','BACK','ADV'].includes(N.type);
  $('mdB').innerHTML=`<div class="fr"><label class="req">划转类型</label><select class="ipt" style="width:100%" onchange="N={type:this.value,claim:'',amt:'',adv:'',bsel:{}};paintNew()">${Object.entries(TYPES).filter(([k,v])=>!v.auto).map(([k,v])=>`<option value="${k}" ${N.type===k?'selected':''}>${v.name}</option>`).join('')}</select><div class="muted" style="font-size:12px;margin-top:4px">${T.hint}</div></div>
  <div class="route"><div class="box"><div class="k">转出（按类型自动绑定）</div><div class="v">${NAME[T.from[0]]}</div><div class="k" style="margin-top:4px">可用 ${fmt(fromBal)}</div></div><div class="arr">→</div><div class="box"><div class="k">转入（按类型自动绑定）</div><div class="v">${N.type==='TERM'?'Holding · 账期还款金额<div class="k">（垫资订单的佣金部分进佣金挂账）</div>':NAME[T.to]}</div></div></div>
  ${basis}${route}
  <div class="fr"><label class="req">划转金额（SGD）${ro?'<span class="muted" style="font-weight:400">　按单据自动算，不可改</span>':''}</label><input class="ipt" id="n_a" style="width:100%" value="${N.amt!==''&&!ro?N.amt:amt}" ${ro?'readonly':''} oninput="N.amt=this.value;chkNew()"><div class="err" id="n_e"></div></div>
  <div class="fr"><label>备注</label><input class="ipt" style="width:100%" placeholder="选填"></div>`;chkNew();
}
function chkNew(){const T=TYPES[N.type],v=$('n_a').value,a=parseFloat(v);let e='';
  if(N.type==='TERM'&&!N.claim)e='请选择认领单';
  else if(N.type==='ADV')e=ADV_PENDING.length?'':'暂无待转账的垫资单';
  else if(N.type==='BACK'&&!(a>0))e='请至少勾选 1 笔订单';
  else if(v===''||!(a>0))e='请输入大于 0 的金额';
  else if(a>BAL[T.from[0]])e=`超过转出可用余额 ${fmt(BAL[T.from[0]])}`;
  $('n_e').style.color='';
  if(!e&&N.type==='FEEBACK'&&a>0&&r2(BAL['PA.FEE']-a)<WATER.low){$('n_e').style.color='#d46b08';$('n_e').textContent=`提醒：收回后备用金 ${fmt(r2(BAL['PA.FEE']-a))} 低于低水位 ${fmt(WATER.low)}`;return true}
  $('n_e').textContent=e;return !e}
function submitNew(){if(!chkNew())return;const a=r2(parseFloat($('n_a').value)),T=TYPES[N.type];let dest=null,basis;
  if(N.type==='TERM'){const c=CLAIMS.find(c=>c.no===N.claim);dest=splitOf(c);basis=`认领单 ${c.no} · ${c.cust}`+(c.hang.length?`（含垫资订单 ${c.hang.map(h=>h[0]).join('、')} 挂账佣金 ${fmt(c.hang.reduce((s,h)=>s+h[2],0))}）`:'');used.add(c.no)}
  else if(N.type==='BACK'){const os=BACKABLE.filter(o=>N.bsel[o.order]);basis=os.map(o=>`垫资单 ${o.ad} · 订单 ${o.order}（${o.cust} 已还款）`).join('；');os.forEach(o=>usedBack.add(o.order))}
  else basis=N.type==='FEE'?`备用金 ${fmt(BAL['PA.FEE'])} 补至目标额 ${fmt(WATER.target)}`:`备用金 ${fmt(BAL['PA.FEE'])}，收回 ${fmt(a)}`;
  const no='TR20261009-00'+String(40+TRS.length);TRS.push({no,type:N.type,amt:a,parts:[[T.from[0],a]],dest,basis,st:'待审批',by:'沈亮',time:'2026-10-09 '+new Date().toTimeString().slice(0,5),att:[]});
  closeMd();render();toast(`已提交 ${no}，待审批`)}
/* 审批 / 执行 */
function act(no,a){const t=TRS.find(x=>x.no===no);
  if(a==='approve'){t.st='待执行';toast(no+' 审批通过')}
  else if(a==='reject'){t.st='已驳回';if(t.type==='TERM')used.delete(t.basis.split(' ')[1]);toast(no+' 已驳回')}
  else{const req=`${no}-${String(t.att.length+1).padStart(2,'0')}`,ok=t.parts.every(([k,x])=>BAL[k]>=x);
    t.att.push([req,'2026-10-09 '+new Date().toTimeString().slice(0,5),ok?'SETTLED':'insufficient_fund']);
    if(ok){t.parts.forEach(([k,x])=>BAL[k]=r2(BAL[k]-x));destOf(t).forEach(([k,x])=>BAL[k]=r2(BAL[k]+x));t.st='已完成';const h=destOf(t).find(d=>d[0]==='HA.HANG');if(h){const an='TR20261009-00'+String(40+TRS.length);BAL['HA.HANG']=r2(BAL['HA.HANG']-h[1]);BAL['CA.COM']=r2(BAL['CA.COM']+h[1]);TRS.push({no:an,type:'AUTO',amt:h[1],parts:[['HA.HANG',h[1]]],basis:`${t.basis.match(/垫资订单 [^ ]+/)||'垫资订单'} 挂账佣金：客户钱已认领到账，自动分账`,st:'已完成',by:'系统',time:'2026-10-09 '+new Date().toTimeString().slice(0,5),att:[[an+'-01','2026-10-09 '+new Date().toTimeString().slice(0,5),'SETTLED']]})}toast(`${no} 执行成功（request_id ${req}）`+(h?`；挂账佣金 ${fmt(h[1])} 已自动分账到佣金账户`:''))}
    else{t.st='执行失败';toast(`${no} 执行失败：转出余额不足，可重试`)}}
  render();if(DR)openTR(no)}
let DR=null;
function openTR(no){DR=no;const t=TRS.find(x=>x.no===no);$('mask').style.display='block';$('dr').style.display='flex';$('drT').textContent='资金划转 '+no;
  $('drB').innerHTML=`<table class="t" style="border:1px solid var(--bd);margin-bottom:18px"><tbody>${[['划转类型',TYPES[t.type].name],['状态',tag(t.st,stC[t.st])],['金额',fmt(t.amt)],['业务依据',t.basis],['发起人 / 时间',t.by+' · '+t.time]].map(([k,v])=>`<tr><td class="muted" style="width:140px">${k}</td><td>${v}</td></tr>`).join('')}</tbody></table>
  <div style="font-weight:600;margin-bottom:8px">钱从哪到哪</div><table class="t" style="border:1px solid var(--bd);margin-bottom:18px"><thead><tr><th>从</th><th>到</th><th class="num">金额</th></tr></thead><tbody>${destOf(t).map(d=>`<tr><td>${NAME[t.parts[0][0]]}</td><td>${NAME[d[0]]}</td><td class="num">${fmt(d[1])}</td></tr>`).join('')}</tbody></table>
  <div style="font-weight:600;margin-bottom:8px">Airwallex 调用记录 <span class="muted" style="font-weight:400;font-size:12px">request_id = 单号-执行序号，重试换序号</span></div><table class="t" style="border:1px solid var(--bd)"><thead><tr><th>request_id</th><th>时间</th><th>结果</th></tr></thead><tbody>${t.att.length?t.att.map(a=>`<tr><td class="mono">${a[0]}</td><td>${a[1]}</td><td>${a[2]==='SETTLED'?tag('成功','green'):tag('余额不足','red')}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;color:var(--tx3);padding:20px">还未执行</td></tr>'}</tbody></table>`;
  $('drF').innerHTML=ops(t).replace(/<span class="link"[^>]*onclick="([^"]+)"[^>]*>([^<]+)<\/span>/g,(m,on,l)=>l==='详情'?'':`<button class="btn ${l==='驳回'?'':'p'}" onclick="${on}">${l}</button>`)}
function closeDr(){DR=null;$('mask').style.display='none';$('dr').style.display='none'}
function closeMd(){$('mask2').style.display='none';$('md').style.display='none'}
render();
</script>
