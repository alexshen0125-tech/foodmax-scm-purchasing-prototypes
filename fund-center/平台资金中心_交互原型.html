<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资金中心增量设计（基于磐石 Aegis）</title>
<style>
:root{--pri:#1677ff;--bd:#f0f0f0;--bd2:#d9d9d9;--tx:#1f1f1f;--tx2:#595959;--tx3:#8c8c8c;--bg:#f5f5f5;--err:#ff4d4f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5715 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg)}
.layout{display:flex;height:100vh}
.side{width:224px;background:#fff;color:#4a4a4a;overflow:auto;flex-shrink:0;border-right:1px solid var(--bd)}
.logo{height:56px;display:flex;align-items:center;padding:0 18px;color:#1f1f1f;font-size:14px;font-weight:600;border-bottom:1px solid var(--bd)}
.grp{padding:14px 18px 4px;font-size:12px;color:var(--tx3)}
.mi{padding:0 14px 0 30px;height:36px;line-height:36px;cursor:pointer;position:relative}
.mi:hover{color:var(--pri)}.mi.on{background:#e6f4ff;color:var(--pri);font-weight:500}
.nw{color:#d46b08;font-size:11px;margin-left:4px}
.mi .badge{position:absolute;right:14px;top:9px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hd{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--bd);flex-shrink:0}
.crumb{color:var(--tx3)}.crumb b{color:var(--tx);font-weight:500}
.hd-r{display:flex;align-items:center;gap:16px}
.content{flex:1;overflow:auto;padding:16px 24px 48px}
.card{background:#fff;border-radius:8px;padding:16px 20px;margin-bottom:16px}
.card-t{font-size:14px;font-weight:600;margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.fi label{color:var(--tx2);margin-right:8px}
.ipt{height:32px;border:1px solid var(--bd2);border-radius:6px;padding:0 10px;font:inherit;min-width:160px;background:#fff;color:var(--tx)}
textarea.ipt{height:72px;padding:6px 10px;width:100%;resize:vertical}
.btn{height:32px;padding:0 15px;border-radius:6px;border:1px solid var(--bd2);background:#fff;cursor:pointer;font:inherit;color:var(--tx);white-space:nowrap}
.btn:hover{color:var(--pri);border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{opacity:.88;color:#fff}
.btn.d{color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.link{color:var(--pri);cursor:pointer;margin-right:12px;white-space:nowrap}
.link.d{color:var(--err)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.toolbar .sp{flex:1}
.tbl-wrap{overflow:auto;border:1px solid var(--bd);border-radius:8px}
table.t{width:100%;border-collapse:collapse;white-space:nowrap}
.t th{background:#fafafa;font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd)}
.t td{padding:9px 12px;border-bottom:1px solid var(--bd);background:#fff}
.t tr:last-child td{border-bottom:none}
.t tr:hover td{background:#fafafa}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.t .op{position:sticky;right:0;box-shadow:-4px 0 6px -4px rgba(0,0,0,.08)}
.t th.op{background:#fafafa}
.t tr.total td{background:#fafafa;font-weight:600}
.empty{padding:36px;text-align:center;color:var(--tx3)}
.tag{display:inline-block;padding:0 7px;line-height:20px;border-radius:4px;font-size:12px;border:1px solid;white-space:nowrap}
.tag.blue{color:#0958d9;background:#e6f4ff;border-color:#91caff}.tag.green{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}.tag.orange{color:#d46b08;background:#fff7e6;border-color:#ffd591}.tag.red{color:#cf1322;background:#fff1f0;border-color:#ffa39e}.tag.gray{color:#595959;background:#fafafa;border-color:#d9d9d9}.tag.purple{color:#531dab;background:#f9f0ff;border-color:#d3adf7}
.pos{color:#389e0d}.neg{color:#cf1322}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tab{padding:8px 0;cursor:pointer;color:var(--tx2)}.tab.on{color:var(--pri);border-bottom:2px solid var(--pri);margin-bottom:-1px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
.drawer{position:fixed;top:0;right:0;height:100vh;width:780px;max-width:96vw;background:#fff;z-index:101;display:none;flex-direction:column;box-shadow:-6px 0 16px rgba(0,0,0,.08)}
.dr-h{height:56px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);font-size:15px;font-weight:600;flex-shrink:0}
.dr-b{flex:1;overflow:auto;padding:20px 24px}
.dr-f{padding:12px 24px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.dr-f:empty{display:none}
.x{cursor:pointer;color:var(--tx3);font-size:18px;font-weight:400}
.mask2{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:102;display:none}
.modal{position:fixed;top:8vh;left:50%;transform:translateX(-50%);width:640px;max-width:94vw;background:#fff;border-radius:8px;z-index:103;display:none;flex-direction:column;max-height:84vh}
.desc{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:8px}
.desc>div{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid var(--bd)}
.desc dt{background:#fafafa;padding:8px 12px;color:var(--tx2)}.desc dd{padding:8px 12px;word-break:break-all}
.sec{font-weight:600;margin:20px 0 10px}
.sec:first-child{margin-top:0}
.fr{margin-bottom:14px}.fr>label{display:block;margin-bottom:6px;color:var(--tx2)}.fr .req:before{content:"* ";color:var(--err)}
.fr .ipt{width:100%}
.fr .val{padding:5px 0}
.chain{padding-left:8px}
.chain .node{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--bd2)}
.chain .node:last-child{border-left-color:transparent}
.chain .node:before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--pri)}
.chain .node.cur:before{background:var(--pri)}
.chain .nt{color:var(--tx3);font-size:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14);padding:9px 16px;border-radius:8px;z-index:300;display:none;max-width:70vw}
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:38px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14);border-radius:8px;padding:4px;display:none;z-index:60;min-width:290px}
.dd-menu div{padding:7px 12px;border-radius:4px;cursor:pointer}
.dd-menu div:hover{background:#f5f5f5}
.dd-menu .dt{color:var(--tx3);font-size:12px;cursor:default;padding:6px 12px 2px}
.dd-menu .dt:hover{background:none}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--err);color:#fff;font-size:12px;line-height:18px;text-align:center}
.muted{color:var(--tx3)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.todo{display:grid;grid-template-columns:1fr auto;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.todo:last-child{border-bottom:none}
.todo:hover{color:var(--pri)}
.chk{width:14px;height:14px;vertical-align:middle;cursor:pointer}
.radio{margin-right:18px;cursor:pointer}
.radio input{margin-right:6px;vertical-align:middle}
.check-line{margin-top:10px}
.eq{background:#fafafa;border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-top:8px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="layout">
  <div class="side" id="side"></div>
  <div class="main">
    <div class="hd">
      <div class="crumb" id="crumb"></div>
      <div class="hd-r">
        <div class="dd"><button class="btn" onclick="toggleDD(event)">模拟外部事件 ▾</button><div class="dd-menu" id="ddm"></div></div>
        <span class="muted" id="clock"></span>
        <span>资金专员 · 沈亮</span>
      </div>
    </div>
    <div class="content" id="ct"></div>
  </div>
</div>
<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><div class="dr-h"><span id="drT"></span><span class="x" onclick="closeDrawer()">✕</span></div><div class="dr-b" id="drB"></div><div class="dr-f" id="drF"></div></div>
<div class="mask2" id="mask2"></div>
<div class="modal" id="modal"><div class="dr-h"><span id="mdT"></span><span class="x" onclick="closeModal()">✕</span></div><div class="dr-b" id="mdB"></div><div class="dr-f" id="mdF"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ================= 工具 ================= */
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
function fmt(n){n=r2(n);return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
const sn=n=>{n=r2(n);return `<span class="${n>0?'pos':n<0?'neg':''}">${n>0?'+':''}${fmt(n)}</span>`};
const tag=(t,c='gray')=>`<span class="tag ${c}">${t}</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const rid=(p,n=10)=>p+Array.from({length:n},()=>'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*32)]).join('');
let NOW=new Date('2026-09-22T14:00:00');
const setNow=s=>{NOW=new Date(s)};
const tick=(m=2)=>{NOW=new Date(NOW.getTime()+m*60000+Math.floor(Math.random()*50)*1000)};
function ts(d=NOW){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
const toD=s=>new Date(s.replace(' ','T'));
function addDays(s,n){const d=toD(s);d.setDate(d.getDate()+n);return ts(d)}
function addWorkDays(s,n){const d=toD(s);while(n>0){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)n--}return ts(d)}
const seqs={};
function nextNo(p){seqs[p]=(seqs[p]||0)+1;return p+ts().slice(2,10).replace(/-/g,'')+String(seqs[p]).padStart(4,'0')}
const USER='沈亮';

/* ================= 数据 ================= */
const S={pushes:[],splits:[],batches:[],flows:[],orders:[],customers:[],merchants:[],trs:[],ads:[],rfs:[],ers:[],alerts:[],claims:[],adj:[],syncLogs:[],recons:[],f:{},sel:{},tab:{},lastSync:'2026-09-21 00:00:00',water:{low:1000,target:5000},refundFee:0.13,commRate:0.15,
  rules:[{no:'R01',name:'线上收单按订单号自动认领',scope:'交易类型=收单',cond:'系统单据编号 = 销售订单号',act:'自动认领并核销订单',on:true},
         {no:'R02',name:'账期入金按户名+金额唯一匹配',scope:'交易类型=入金',cond:'对方户名命中客户付款户名，且金额 = 该客户某一笔未付账期订单金额（唯一）',act:'自动认领、核销、生成账期回款转 Holding调拨单',on:true},
         {no:'R03',name:'账期入金按户名+未付合计匹配',scope:'交易类型=入金',cond:'对方户名命中客户付款户名，且金额 = 该客户全部未付账期订单合计',act:'自动认领、核销、生成账期回款转 Holding调拨单',on:true}]};
const BK={ONL:'线上支付桶',TERM:'账期回款桶',ADV:'平台垫资桶',UNC:'待分类'};
const BKDESC={ONL:'商家待结算（线上支付）',TERM:'商家待结算（账期打款）',ADV:'平台自有',UNC:'待归类'};
const BIG={Payin:'收单',Transfer:'划转',Conversion:'换汇',Payout:'付款',Deposit:'入金',Adjustment:'调整',Card:'卡交易',Purchase:'采购',Fee:'费用',Charge:'扣费',Yield:'收益'};
const TXDEF=[['Payment','收单','Payin','收入',1,'线上收款'],['Refund','退款','Payin','支出',1,'线上退款'],['Refund Reversal','退款退回','Payin','收入',1,'退款冲回'],['Refund Failure','退款失败','Payin','收入',1,'退款冲回'],
['Payment Reserve Hold','准备金冻结','Payin','支出',1,'受限资金'],['Payment Reserve Release','准备金释放','Payin','收入',1,'受限资金'],['Dispute','拒付扣款','Payin','支出',1,'拒付'],['Dispute Reversal','拒付撤销','Payin','收入',1,'拒付'],['Dispute Lost','拒付败诉','Payin','支出',1,'拒付'],
['Transfer','账户间划转','Transfer','按方向',1,'内部调拨'],['Conversion Sell','换汇卖出','Conversion','支出',1,'换汇'],['Conversion Buy','换汇买入','Conversion','收入',1,'换汇'],['Conversion Reversal','换汇撤销','Conversion','按方向',1,'换汇'],
['Payout','付款','Payout','支出',1,'提现付款'],['Payout Failure','付款失败','Payout','收入',1,'付款冲回'],['Payout Reversal','付款退回','Payout','收入',1,'付款冲回'],['Deposit','入金','Deposit','收入',1,'账期回款'],['DD Credit','直接借记入账','Deposit','收入',1,'—'],['DD Debit','直接借记扣款','Deposit','支出',1,'—'],
['DC Credit','DC 入账（待确认）','Adjustment','收入',0,'—'],['DC Debit','DC 扣款（待确认）','Adjustment','支出',0,'—'],['Issuing Authorisation Hold','发卡授权冻结','Card','支出',0,'不涉及'],['Issuing Authorisation Release','发卡授权释放','Card','收入',0,'不涉及'],['Issuing Capture','发卡请款','Card','支出',0,'不涉及'],['Issuing Refund','发卡退款','Card','收入',0,'不涉及'],['Purchase','采购','Purchase','支出',0,'不涉及']];
S.txmap=TXDEF.map(([en,cn,big,dir,on,biz])=>({en,cn,big,dir,on:!!on,biz}));
S.accounts=[
 {code:'PA',name:'平台主账户',awx:'payment account',id:'acct_pa_8Hk2Qm4T',kind:'平台主账户',cur:'SGD',st:'启用'},
 {code:'HA',name:'Holding 账户',awx:'holding account',id:'acct_ha_3Nx7Lp9W',kind:'监管账户',cur:'SGD',st:'启用'},
 {code:'CA',name:'抽佣账户',awx:'connected account',id:'acct_ca_5Rt9Vw2K',kind:'平台子账户',cur:'SGD',st:'启用'},
 {code:'FA',name:'手续费备付账户',awx:'connected account',id:'acct_fa_2Pd6Ks8M',kind:'平台子账户',cur:'SGD',st:'启用'},
 {code:'M1',name:'店铺子账户-Fresh Greens Trading',awx:'connected account',id:'acct_m1_7Qe4Hn3B',kind:'商家子账户',cur:'SGD',st:'启用'},
 {code:'M2',name:'店铺子账户-Ocean Catch Seafood',awx:'connected account',id:'acct_m2_9Wd2Jc6R',kind:'商家子账户',cur:'SGD',st:'启用'},
 {code:'M3',name:'店铺子账户-Prime Meat Supply',awx:'connected account',id:'acct_m3_4Lf8Tz5N',kind:'商家子账户',cur:'SGD',st:'启用'}];
S.accounts.forEach(a=>a.entity='FOOD MAX PTE. LTD.');
S.open={PA:0,CA:12800,FA:400,M1:5200,M2:3100,M3:2480};
S.openB={ONL:3107,TERM:1800,ADV:0,UNC:0};
const TRT={'账期回款转 Holding':{from:'PA',to:'HA',toB:'TERM'},'手续费备付账户补资':{from:'CA',to:'FA'}};
const FEE={PayNow:0.02,'卡':0.028,'支付宝':0.022,'微信':0.022};
const TN={PayNow:0,'卡':1,'支付宝':1,'微信':1};
const spOf=no=>S.splits.find(x=>x.no===no);

/* ================= 查找 ================= */
const acc=c=>S.accounts.find(a=>a.code===c);
const accName=c=>acc(c)?acc(c).name:c;
const txm=en=>S.txmap.find(t=>t.en===en);
const txcn=en=>txm(en)?txm(en).cn:en;
const fl=id=>S.flows.find(f=>f.id===id);
const ord=no=>S.orders.find(o=>o.no===no);
const trOf=no=>S.trs.find(x=>x.no===no);
const adOf=no=>S.ads.find(x=>x.no===no);
const rfOf=no=>S.rfs.find(x=>x.no===no);
const erOf=no=>S.ers.find(x=>x.no===no);
const clOf=no=>S.claims.find(x=>x.no===no);
const flowsOfReq=no=>S.flows.filter(f=>f.req===no);

/* ================= 余额 ================= */
const inLedger=f=>f.synced&&f.review==='正常'&&f.status==='Settled';
const openOf=a=>a==='HA'?Object.values(S.openB).reduce((s,x)=>s+x,0):(S.open[a]||0);
const awxBal=a=>r2(openOf(a)+S.flows.filter(f=>f.acc===a&&f.status==='Settled').reduce((s,f)=>s+f.net,0));
const ledBal=a=>r2(openOf(a)+S.flows.filter(f=>f.acc===a&&inLedger(f)).reduce((s,f)=>s+f.net,0));
function bucketBal(b,at){const ok=t=>!at||t<=at;return r2(S.openB[b]+S.flows.filter(f=>f.acc==='HA'&&inLedger(f)&&f.bucket===b&&ok(f.settled)).reduce((s,f)=>s+f.net,0)+S.adj.filter(j=>ok(j.time)).reduce((s,j)=>s+(j.to===b?j.amt:0)-(j.from===b?j.amt:0),0))}
const advReserved=()=>r2(S.ads.filter(a=>a.state==='已垫入'&&a.inBucket).reduce((s,a)=>s+a.amt,0));
const advFree=()=>r2(bucketBal('ADV')-advReserved());

/* ================= 流水 ================= */
function mkFlow(o){
  const f=Object.assign({due:'',id:rid('ftx_',12),cur:'SGD',fee:0,status:'Settled',created:ts(),settled:'',orderNo:'',pi:'',pat:'',req:'',ref:'',method:'',cp:'',batch:'',synced:false,syncAt:'',bucket:null,hint:null,link:null,claim:'无需认领',review:'正常',note:'',src:'',srcEnt:'',err:''},o);
  if(f.net===undefined)f.net=r2(f.gross-f.fee);
  if(f.status==='Settled'&&!f.settled)f.settled=ts();
  S.flows.push(f);return f;
}
function xfer(from,to,amt,req,o={}){
  const tid=rid('tfr_',10);
  const src=o.src||tid,se=o.srcEnt||'Transfer';
  const a=mkFlow({acc:from,type:'Transfer',gross:-amt,net:-amt,req,pi:o.pi||'',orderNo:o.orderNo||'',src,srcEnt:se,hint:o.fromB||null,cp:accName(to),status:o.status||'Settled',due:o.due||'',ref:o.ref||''});
  const b=mkFlow({acc:to,type:'Transfer',gross:amt,net:amt,req,pi:o.pi||'',orderNo:o.orderNo||'',src,srcEnt:se,hint:o.toB||null,cp:accName(from),status:o.status||'Settled',due:o.due||'',ref:o.ref||''});
  return [a,b];
}
function validate(f){
  const m=txm(f.type);
  if(!m||!m.on){f.review='暂存复核';f.note='交易类型未映射或未开启入账';return}
  if(r2(f.gross-f.fee)!==r2(f.net)){f.review='暂存复核';f.note=`金额不平：${fmt(f.gross)} − ${fmt(f.fee)} ≠ ${fmt(f.net)}`}
}
function post(f){
  const r=f.req||'';
  if(f.acc==='HA')f.bucket=f.hint||null;
  if(r.startsWith('TR')&&trOf(r)){f.link={k:'资金调拨单',no:r};onTRFlow(trOf(r),f)}
  else if((r.startsWith('AD')||r.startsWith('AF'))&&adOf(r)){f.link={k:'垫资单（aegis）',no:r};if(f.acc==='HA')adOf(r).inBucket=true}
  else if(r.startsWith('RF')&&rfOf(r)){f.link={k:'退款资金单',no:r}}
  else if(r.startsWith('JS')){f.link={k:'付款单出款（aegis）',no:r}}
  else if(r.startsWith('AR')){f.link={k:'垫资回收单（aegis）',no:r}}
  else if(f.type==='Payment'){const o=ord(f.orderNo);if(o&&S.rules[0].on){f.link={k:'销售订单',no:o.no};f.claim='已认领';f.claimBy='R01 线上收单按订单号'}}
  else if(f.type==='Transfer'&&f.srcEnt==='FundsSplit'&&spOf(f.src)){f.link={k:'分账单',no:f.src};if(f.acc==='HA')f.bucket='ONL'}
  else if(f.type==='Deposit'){f.claim='待认领';autoClaim(f)}
  if(f.acc==='HA'&&!f.bucket)f.bucket='UNC';
}
function onTRFlow(t,f){
  const fs=flowsOfReq(t.no);
  if(fs.every(x=>x.synced)){

function newTR(type,amt,reason,basis,by=USER){

}
function execTR(t){
  if(!['待执行','执行失败'].includes(t.state))return false;
  if(t.fromB&&bucketBal(t.fromB)<t.amt){t.state='执行失败';t.fail=`${BK[t.fromB]}余额 ${fmt(bucketBal(t.fromB))} 不足`;t.log.push([ts(),USER,'执行失败',t.fail]);return false}
  if(awxBal(t.from)<t.amt){t.state='执行失败';t.fail=`${accName(t.from)}可用余额 ${fmt(awxBal(t.from))} 不足`;t.log.push([ts(),USER,'执行失败',t.fail]);return false}
  const real=r2(t.amt-NEXT_SHORT);NEXT_SHORT=0;
  xfer(t.from,t.to,real,t.no,{fromB:t.fromB,toB:t.toB});
  t.state='已完成';t.check='待核对';t.fail='';t.done=ts();
  t.log.push([ts(),USER,'执行','已调 Airwallex 转账接口，回执成功（请求号='+t.no+'）']);
  if(t.type==='手续费备付账户补资')setTimeout(()=>{tryAllRF();refresh()},0);
  return true;
}
function execAD(a){
  if(a.state!=='待执行')return false;

    if(awxBal('CA')<a.amt){a.fail=`抽佣账户余额 ${fmt(awxBal('CA'))} 不足`;a.log.push([ts(),USER,'执行失败',a.fail]);return false}

  }else{
    if(advFree()<a.amt){a.fail=`平台垫资桶可用 ${fmt(advFree())} 不足`;a.log.push([ts(),USER,'执行失败',a.fail]);return false}
    a.inBucket=true;
  }
  a.state='已垫入';a.fail='';a.log.push([ts(),USER,'执行',a.src==='佣金账户转入'?'抽佣账户 → Holding 账户·平台垫资桶':'占用平台垫资桶留存余额，无资金划转']);
  return true;
}
function createRF(o,amt){
  const pay=S.flows.find(f=>f.type==='Payment'&&f.orderNo===o.no);
  const pos=o.payout==='已结算'?'已分拨（资金已到店铺子账户）':'未分拨（资金在 Holding）';
  const leg1=r2(o.net*amt/o.amount),fee=S.refundFee,leg2=r2(amt-leg1+fee);
  const r={pos,no:nextNo('RF'),refundNo:rid('RFD',8).toUpperCase(),order:o.no,cust:o.cust,pi:o.pi,payFlow:pay.id,payAmt:o.amount,payFee:o.fee,payNet:o.net,amt:r2(amt),rfee:fee,leg1,leg2,state:'待执行',block:'',created:ts(),log:[[ts(),'SYSTEM','创建',`售后退款成功，退款 ${fmt(amt)}`]]};
  S.rfs.unshift(r);
  if(o.payout==='已结算'){r.state='移交 aegis 挂账';r.block='红线：资金已到店铺子账户，禁止反向扣款；按 aegis「退款挂账」记负应付，从该店铺后续货款抵扣';r.log.push([ts(),'SYSTEM','移交','已分拨 → aegis 退款挂账']);o.refunded=r2((o.refunded||0)+r.amt);return r}
  tryRF(r);return r;
}
function tryRF(r){
  if(['已完成','退款中','移交 aegis 挂账'].includes(r.state))return;
  const pay=fl(r.payFlow),o=ord(r.order);
  if(pay.status!=='Settled'){r.state='待结算挂起';r.block='原收单流水未结算';return}
  if(awxBal('FA')<r.leg2){
    if(r.state!=='待补资'){r.log.push([ts(),'SYSTEM','挂起',`手续费备付账户余额 ${fmt(awxBal('FA'))} < 需补 ${fmt(r.leg2)}`]);addAlert('退款资金单待补资',`${r.no} 需手续费垫资 ${fmt(r.leg2)}，手续费备付账户余额 ${fmt(awxBal('FA'))}`,'rf','高')}
    r.state='待补资';r.block='手续费备付账户余额不足';checkWater();return}
  if(awxBal('HA')<r.leg1){r.state='待执行';r.block='Holding 账户余额不足';return}
  const sp=S.splits.find(x=>x.pi===o.pi);
  if(!sp||sp.state==='待结算'){r.state='待结算挂起';r.block='原分账未结算';return}
  xfer('HA','PA',r.leg1,r.no,{fromB:'ONL',orderNo:o.no,pi:o.pi,src:sp.no,srcEnt:'FundsSplitReversal'});
  sp.reversed=r2(sp.reversed+r.leg1);sp.state=sp.reversed>=sp.amt?'已全额冲回':'已部分冲回';
  xfer('FA','PA',r.leg2,r.no,{orderNo:o.no});
  mkFlow({acc:'PA',type:'Refund',gross:-r.amt,fee:r.rfee,req:r.no,orderNo:o.no,pi:o.pi,method:o.method,cp:o.cust,srcEnt:'Refund',src:rid('rfd_',10),status:'Pending',due:cutOf(NOW,0)});
  r.state='退款中';r.block='';
  o.refunded=r2((o.refunded||0)+r.amt);o.refundLeg1=r2((o.refundLeg1||0)+r.leg1);
  r.log.push([ts(),'SYSTEM','执行','① 分账冲回 Holding 账户→平台账户 '+fmt(r.leg1)+'；② 手续费备付账户→平台账户 '+fmt(r.leg2)+'；③ 原路退款 '+fmt(r.amt)+'（随下一结算批次扣减）']);
  S.alerts.filter(x=>x.type==='退款资金单待补资'&&x.state==='未处理'&&x.msg.startsWith(r.no)).forEach(x=>{x.state='已处理';x.by='SYSTEM：已自动执行'});
  checkWater();
}

function doSync(mode='手动',silent){
  tick(1);
  const from=addDays(S.lastSync,-3),to=ts();
  let pulled=0,newc=0,dup=0,pend=0,rev=0;
  S.flows.filter(f=>f.created>=from&&f.created<=to).forEach(f=>{
    pulled++;
    if(f.synced){dup++;return}
    if(f.status==='Pending'){pend++;return}
    f.synced=true;f.syncAt=ts();newc++;
    validate(f);
    if(f.review!=='正常'){rev++;return}
    post(f);
  });
  S.lastSync=to;
  S.syncLogs.unshift({no:nextNo('SY'),time:to,mode,from,to,pulled,newc,dup,pend,rev,res:'成功'});
  checkWater();
  if(!silent)toast(`同步完成：拉取 ${pulled} 条，新入库 ${newc - rev} 条，暂存复核 ${rev} 条，待结算跳过 ${pend} 条`);
}

function payoutPlan(){
  const bal={ONL:bucketBal('ONL'),TERM:bucketBal('TERM'),ADV:bucketBal('ADV')};
  return S.orders.filter(o=>o.payout!=='已结算').map(o=>{
    const base=o.kind==='线上'?r2(o.net-o.refundLeg1):o.amount;
    const merchantAmt=r2((o.amount-o.refunded)*(1-S.commRate)),comm=r2(base-merchantAmt);
    let src='',why='';
    if(o.kind==='线上'&&o.refunded>=o.amount)why='已全额退款';
    else if(o.kind==='线上'&&!S.flows.some(f=>f.acc==='HA'&&f.pi===o.pi&&inLedger(f)))why='资金未划入Holding 账户';
    else if(o.kind==='线上')src='ONL';
    else if(o.adv&&adOf(o.adv).state==='已垫入'&&adOf(o.adv).inBucket)src='ADV';
    else if(o.adv&&adOf(o.adv).state==='已垫入')why='垫资资金未入Holding 账户';
    else if(o.paid)src='TERM';
    else why='客户未付款且未垫资';
    if(src&&bal[src]<base){why=BK[src]+'余额不足';src=''}
    if(src)bal[src]=r2(bal[src]-base);
    return {o,base,merchantAmt,comm,src,why};
  });
}

function flowDesc(f){
  const L=f.link;
  if(f.type==='Payment')return `订单 ${f.orderNo} 线上收单（${f.method}）`;
  if(f.type==='Refund')return `订单 ${f.orderNo} 原路退款`;
  if(f.type==='Deposit')return f.claim==='已认领'?`账期回款，${L.no} 认领核销`:`账期回款，待认领`;
  if(f.type==='Transfer'){
    const dir=f.net<0?'转出至':'转入自';
    if(f.srcEnt==='FundsSplit')return `订单 ${f.orderNo} 分账 ${f.src}（${dir}${f.cp}）`;
    if(L&&L.k==='资金调拨单')return `${trOf(L.no).type}（${dir}${f.cp}）`;
    if(L&&L.k.startsWith('垫资单'))return `清分垫资 ${L.no}（${dir}${f.cp}）`;
    if(L&&L.k==='退款资金单'){const r=rfOf(L.no);return (f.acc==='HA'?'① 分账冲回':f.acc==='FA'?'② 退款手续费垫资':'退款资金转入')+`（订单 ${r.order}）`}
    if(L&&L.k.startsWith('结算单'))return `结算打款 ${L.no}（${dir}${f.cp}）`;
    return `无单号划转（${dir}${f.cp}）`;
  }
  return txcn(f.type);
}
PAGES.acctflow=()=>{
  const accs=S.accounts.filter(a=>a.st==='启用'),code=curTab('acctflow','PA'),a=acc(code);
  const ty=gf('acctflow','type');
  const all=S.flows.filter(f=>f.acc===code&&inLedger(f)).sort((x,y)=>x.settled.localeCompare(y.settled));
  let bal=openOf(code);const rows=all.map(f=>{bal=r2(bal+f.net);return {f,bal}});
  const shown=(ty?rows.filter(r=>r.f.type===ty):rows).slice().reverse();
  const inc=r2(all.filter(f=>f.net>0).reduce((s,f)=>s+f.net,0)),out=r2(all.filter(f=>f.net<0).reduce((s,f)=>s-f.net,0)),fee=r2(all.reduce((s,f)=>s+f.fee,0));
  const uns=S.flows.filter(f=>f.acc===code&&f.status==='Settled'&&!(f.synced&&f.review==='正常')).length;
  const g={};all.forEach(f=>{const k=f.type+'|'+(f.net>=0?'收入':'支出');const x=g[k]=g[k]||{type:f.type,dir:f.net>=0?'收入':'支出',n:0,amt:0,fee:0};x.n++;x.amt=r2(x.amt+Math.abs(f.net));x.fee=r2(x.fee+f.fee)});
  return card('',tabs('acctflow',accs.map(x=>[x.code,x.name.replace('店铺子账户-','商家:')])))+

  card('按交易类型汇总',tbl([{t:'交易类型',k:x=>txcn(x.type)},{t:'收支方向',k:x=>x.dir},{t:'笔数',num:1,k:x=>x.n},{t:'金额（净额）',num:1,k:x=>fmt(x.amt)},{t:'交易手续费',num:1,k:x=>fmt(x.fee)}],Object.values(g)))+
  card('流水明细',`<div class="toolbar"><span class="fi"><label class="muted">交易类型</label> <select class="ipt" onchange="setF('acctflow','type',this.value)"><option value="">全部</option>${[...new Set(all.map(f=>f.type))].map(t=>`<option value="${t}" ${ty===t?'selected':''}>${txcn(t)}</option>`).join('')}</select></span><span class="sp"></span><button class="btn" onclick="toast('已导出 ${esc(a.name)} 账户流水')">导出</button></div>`+
  tbl([{t:'结算时间',k:r=>r.f.settled},{t:'流水号',k:r=>flowLink(r.f.id)},{t:'交易类型',k:r=>txcn(r.f.type)},{t:'摘要',k:r=>esc(flowDesc(r.f))},{t:'对方',k:r=>esc(r.f.cp)},{t:'收入',num:1,k:r=>r.f.net>0?`<span class="pos">${fmt(r.f.net)}</span>`:''},{t:'支出',num:1,k:r=>r.f.net<0?`<span class="neg">${fmt(-r.f.net)}</span>`:''},{t:'交易手续费',num:1,k:r=>r.f.fee?fmt(r.f.fee):''},{t:'余额',num:1,k:r=>fmt(r.bal)},{t:'结算批次号',k:r=>r.f.batch?`<span class="link" onclick="openBatch('${r.f.acc}|${r.f.batch}')">${r.f.batch}</span>`:'—'},...(code==='HA'?[{t:'清分桶',k:r=>BK[r.f.bucket]||'—'}]:[]),{t:'关联单据',k:r=>linkTxt(r.f)}],shown,{op:r=>`<span class="link" onclick="openFlow('${r.f.id}')">详情</span>`}));

function chainFor(f){
  const n=[],N=(title,sub,on,cur)=>n.push({title,sub,on,cur});
  const fN=(x,t)=>N(t,`${x.id} · ${fmt(x.net)}${x.synced?'':' · 未同步'}`,`openFlow('${x.id}')`,x.id===f.id);
  const L=f.link;
  const o=(f.pi&&S.orders.find(x=>x.pi===f.pi))||ord(f.orderNo);
  if(o&&(!L||L.k==='销售订单'||L.k==='分账单')){
    N('销售订单 '+o.no,`${o.cust} · ${fmt(o.amount)}`,`openOrder('${o.no}')`);
    const pay=S.flows.find(x=>x.type==='Payment'&&x.orderNo===o.no);
    const sp=S.splits.find(x=>x.pi===o.pi);if(pay)fN(pay,'收单（平台账户）'+(pay.batch?' · '+pay.batch:''));if(sp)N('分账单 '+sp.no,`分账 ${fmt(sp.amt)} · ${sp.state}${sp.batch?' · '+sp.batch:''}`,`openSplit('${sp.no}')`);if(sp){fN(fl(sp.outFlow),'分账转出（平台账户）');fN(fl(sp.inFlow),'分账转入（Holding 账户 · 线上支付桶）')}
    if(o.payoutNo)N('结算单（外部） '+o.payoutNo,'清结算系统结算打款','');
    S.rfs.filter(r=>r.order===o.no).forEach(r=>N('退款资金单 '+r.no,`退款 ${fmt(r.amt)} · ${r.state}`,`openRF('${r.no}')`));
  }else if(L&&L.k==='资金调拨单'){const t=trOf(L.no);if(t.basis)N('业务依据 '+t.basis,t.reason,t.basis.startsWith('CL')?`openClaim('${t.basis}')`:t.basis.startsWith('AD')?`openAD('${t.basis}')`:'');else N('业务依据',t.reason,'');N('资金调拨单 '+t.no,`${t.type} · ${fmt(t.amt)} · ${t.state}`,`openTR('${t.no}')`);flowsOfReq(t.no).forEach(x=>fN(x,`${x.net<0?'转出':'转入'}（${accName(x.acc)}${x.bucket?' · '+BK[x.bucket]:''}）`))}
  else if(L&&(L.k==='垫资单'||L.k==='垫资单（aegis）')){const a=adOf(L.no);N('垫资单 '+a.no,`${a.orders.length} 笔订单 · ${fmt(a.amt)} · ${a.state}`,`openAD('${a.no}')`);a.orders.forEach(no=>N('订单 '+no,`${ord(no).cust} · ${fmt(ord(no).amount)} · 归还：${ord(no).advState}`,`openOrder('${no}')`));flowsOfReq(a.no).forEach(x=>fN(x,`${x.net<0?'转出':'转入'}（${accName(x.acc)}）`))}
  else if(L&&L.k==='退款资金单'){const r=rfOf(L.no);N('销售订单 '+r.order,r.cust,`openOrder('${r.order}')`);fN(fl(r.payFlow),'原收单');N('退款资金单 '+r.no,`退款 ${fmt(r.amt)} · ${r.state}`,`openRF('${r.no}')`);flowsOfReq(r.no).forEach(x=>fN(x,x.type==='Refund'?'③ 原路退款（平台账户）':x.acc==='HA'?'① 分账冲回·Holding 账户转出':x.acc==='FA'?'② 手续费备付账户转出':'平台账户转入'))}
  else if(L&&L.k==='认领单'){const c=clOf(L.no);fN(f,'入金（平台账户）');N('认领单 '+c.no,`${c.by} · 差额 ${fmt(c.diff)}`,`openClaim('${c.no}')`);c.orders.forEach(no=>N('核销订单 '+no,`${fmt(ord(no).amount)}${ord(no).adv?' · 垫资单 '+ord(no).adv:''}`,`openOrder('${no}')`));const t=trOf(c.tr);if(t){N('调拨单 '+t.no,`账期回款转 Holding · ${t.state}`,`openTR('${t.no}')`);flowsOfReq(t.no).forEach(x=>fN(x,`${x.net<0?'转出':'转入'}（${accName(x.acc)}）`))}}
  else if(L&&L.k.startsWith('结算单')){N('结算单（外部） '+L.no,'清结算系统发起','');flowsOfReq(L.no).filter(x=>x.acc==='HA').forEach(x=>fN(x,`Holding 账户转出 → ${x.cp}（${BK[x.bucket]||'—'}）`));if(f.acc!=='HA')fN(f,'转入（'+accName(f.acc)+'）')}
  else{fN(f,'本流水');N(f.claim==='待认领'?'待认领':'未挂单',f.claim==='待认领'?'到「待认领流水」认领':'到「挂单对账」处理',f.claim==='待认领'?`go('claim')`:`go('unlinked')`)}
  return n;
}

function voucherHtml(f){

  if(f.type==='Payment')L=[['借',A(f.acc),f.net],['借','财务费用-支付手续费',f.fee],['贷','预收账款-'+f.cp,f.gross]];
  else if(f.type==='Refund')L=[['借','预收账款-'+f.cp,-f.gross],['借','财务费用-支付手续费',f.fee],['贷',A(f.acc),-f.net]];
  else if(f.type==='Deposit')L=[['借',A(f.acc),f.net],['贷',f.claim==='已认领'?'应收账款-'+(clOf(f.link.no)?.cust||''):'待认领款项',f.net]];
  else if(f.type==='Transfer'){if(f.net>0)return '<div class="muted">划转凭证由转出方流水生成</div>';const p=S.flows.find(x=>x.src===f.src&&x.id!==f.id);const to=p?p.acc:'';const amt=-f.net;
    if(f.link&&f.link.k.startsWith('垫资单'))L=[['借','其他应收款-清分垫资',amt],['贷',A(f.acc),amt]];
    else if(f.link&&f.link.k==='资金调拨单'&&trOf(f.link.no).type==='垫资回收')L=[['借',A(to),amt],['贷','其他应收款-清分垫资',amt]];
    else L=[['借',A(to),amt],['贷',A(f.acc),amt]];}

}

const flowTbl=fs=>tbl([{t:'流水号',k:x=>flowLink(x.id)},{t:'账户',k:x=>accName(x.acc)},{t:'交易类型',k:x=>txcn(x.type)},{t:'净额',num:1,k:x=>sn(x.net)},{t:'清分桶',k:x=>x.bucket?BK[x.bucket]:'—'},{t:'入账状态',k:x=>x.synced?stTag(x.review==='正常'?'已入账':x.review):tag('未同步','gray')}],fs);
function openTR(no){openDrawer(()=>{const t=trOf(no);return {t:'资金调拨单 '+no,b:`${dl([['调拨单号',t.no],['状态',stTag(t.state)],['调拨类型',t.type],['金额',fmt(t.amt)],['转出账户',accName(t.from)+(t.fromB?' · '+BK[t.fromB]:'')],['转入账户',accName(t.to)+(t.toB?' · '+BK[t.toB]:'')],['业务依据',esc(t.reason)],['依据单据',t.basis],['Airwallex 请求号',t.state==='已完成'?t.no:''],['流水核对',t.check==='—'?'':stTag(t.check)],['失败原因',esc(t.fail)],['创建人',t.creator],['创建时间',t.created],['完成时间',t.done||'']])}<div class="sec">关联流水</div>${flowTbl(flowsOfReq(no))}<div class="sec">操作日志</div>${logTbl(t.log)}`,f:trOps(t).replace(/<span class="link( d)?" onclick="([^"]+)">([^<]+)<\/span>/g,(m,d,on,l)=>l==='详情'?'':`<button class="btn ${d?'d':'p'}" onclick="${on}">${l}</button>`)}})}
function openAD(no){openDrawer(()=>{const a=adOf(no);return {t:'垫资单 '+no,b:`${dl([['垫资单号',a.no],['状态',stTag(a.state)],['结算周期',a.period],['垫资金额',fmt(a.amt)],['资金来源',a.src],['已归还 / 未归还',fmt(adRet(a))+' / '+fmt(r2(a.amt-adRet(a)))],['提回调拨单',a.tr],['失败原因',esc(a.fail)],['创建人',a.creator],['创建时间',a.created]])}<div class="sec">垫资订单</div>${tbl([{t:'订单号',k:n=>`<span class="link" onclick="openOrder('${n}')">${n}</span>`},{t:'客户',k:n=>ord(n).cust},{t:'订单金额',num:1,k:n=>fmt(ord(n).amount)},{t:'付款状态',k:n=>ord(n).paid?tag('已付款','green'):tag('未付款','orange')},{t:'认领单',k:n=>ord(n).claimNo||'—'},{t:'商家结算',k:n=>ord(n).payout},{t:'归还状态',k:n=>ord(n).advState==='已归还'?tag('已归还','green'):tag('未归还','orange')}],a.orders)}<div class="eq">垫资金额 ${fmt(a.amt)} = Σ订单金额 ${fmt(r2(a.orders.reduce((s,n)=>s+ord(n).amount,0)))}</div><div class="sec">关联流水</div>${flowTbl(flowsOfReq(no))}<div class="sec">操作日志</div>${logTbl(a.log)}`,f:adOps(a).replace(/<span class="link( d)?" onclick="([^"]+)">([^<]+)<\/span>/g,(m,d,on,l)=>l==='详情'?'':`<button class="btn ${d?'d':'p'}" onclick="${on}">${l}</button>`)}})}
function openRF(no){openDrawer(()=>{const r=rfOf(no);const fs=flowsOfReq(no);const l1=fs.find(x=>x.acc==='HA'),l2=fs.find(x=>x.acc==='FA'),l3=fs.find(x=>x.type==='Refund');
  const legs=[['①','分账冲回：Holding 账户 → 平台账户','原收单净额 × 退款金额 ÷ 原支付金额',r.leg1,l1],['②','手续费备付账户 → 平台账户','退款金额 − ① + 退款手续费',r.leg2,l2],['③','平台账户 → 客户（原路）','退款金额，另扣退款手续费；随下一结算批次扣减',r.amt,l3]];
  return {t:'退款资金单 '+no,b:`${dl([['退款资金单号',r.no],['状态',stTag(r.state)],['资金位置',r.pos||''],['退款单号',r.refundNo],['订单号',r.order],['客户',r.cust],['原支付单号',r.pi],['原支付金额',fmt(r.payAmt)],['原收单手续费',fmt(r.payFee)],['原收单净额',fmt(r.payNet)],['退款金额',fmt(r.amt)],['退款手续费',fmt(r.rfee)],['挂起原因',r.block]])}
  <div class="sec">三腿资金</div>${tbl([{t:'腿',k:x=>x[0]},{t:'资金路径',k:x=>x[1]},{t:'计算',k:x=>x[2]},{t:'应划金额',num:1,k:x=>fmt(x[3])},{t:'流水',k:x=>x[4]?flowLink(x[4].id):'—'},{t:'入账',k:x=>x[4]?(x[4].synced?stTag('已入账'):tag('未同步','gray')):'—'}],legs)}
  <div class="eq">闭环校验：① ${fmt(r.leg1)} + ② ${fmt(r.leg2)} − 退款 ${fmt(r.amt)} − 退款手续费 ${fmt(r.rfee)} = <b>${fmt(r2(r.leg1+r.leg2-r.amt-r.rfee))}</b></div>
  <div class="sec">操作日志</div>${logTbl(r.log)}`,f:!['已完成','移交 aegis 挂账'].includes(r.state)?`<button class="btn p" onclick="rfRetry('${no}')">重试</button>`:''}})}
function openER(no){openDrawer(()=>{const e=erOf(no);const f=fl(e.obj);
  let form='';
  if(e.state==='待处理'){
    const ways=e.type==='余额不平'?['已补同步复对','已线下调整','无需处理']:e.type==='无单转账'?['已归类待分类资金','已补挂单据','已线下调整']:e.type==='未挂单'?['已补挂单据','已线下调整','无需处理']:['已线下调整','无需处理'];
    const quick=e.type==='无单转账'&&f&&f.acc==='HA'&&!f.classified?`<button class="btn" onclick="classify('${f.id}','${no}')">归类到桶并结案</button>`:(e.type==='未挂单'||e.type==='无单转账')&&f&&!f.link?`<button class="btn" onclick="manualLink('${f.id}','${no}')">手工挂单并结案</button>`:'';
    form=`<div class="sec">处理</div>${quick?`<div style="margin-bottom:12px">${quick}</div>`:''}${fr('处理方式',`<select class="ipt" id="e_w">${ways.map(w=>`<option>${w}</option>`).join('')}</select>`,1)}${fr('结案说明',`<textarea class="ipt" id="e_n"></textarea>`,1)}`;
  }
  return {t:'差错单 '+no,b:`${dl([['差错单号',e.no],['状态',stTag(e.state)],['差错类型',e.type],['关联对象',errObj(e)],['金额 / 差额',fmt(e.amt)],['结案时限',e.deadline],['描述',esc(e.desc)],['复对',e.recheck],['处理方式',e.way],['结案说明',esc(e.closeNote)],['结案时间',e.closed]])}${f?`<div class="sec">关联流水</div>${flowTbl([f])}`:''}${form}`,f:e.state==='待处理'?`<button class="btn p" onclick="closeER('${no}')">结案</button>`:''}})}
function closeER(no){const n=$('e_n').value.trim();if(!n)return toast('请填写结案说明');const e=erOf(no);tick(1);e.state='已结案';e.way=$('e_w').value;e.closeNote=n;e.closed=ts();toast('已结案');refresh()}
function openRecon(no){openDrawer(()=>{const r=S.recons.find(x=>x.no===no);return {t:'对账批次 '+no,b:dl([['对账日期',r.date],['执行时间',r.time],['执行人',r.by],['结果',stTag(r.res)]])+reconTbl(r.rows)}})}
function openClaim(no){openDrawer(()=>{const c=clOf(no);return {t:'认领单 '+no,b:`${dl([['认领单号',c.no],['流水号',flowLink(c.flow)],['客户',c.cust],['回款金额',fmt(c.amt)],['订单合计',fmt(c.sum)],['差额',fmt(c.diff)],['差额处理',c.rebate],['认领方式',c.by],['认领时间',c.time],['转清分调拨单',`<span class="link" onclick="openTR('${c.tr}')">${c.tr}</span> ${stTag(trOf(c.tr).state)}`]])}<div class="sec">核销订单</div>${tbl([{t:'订单号',k:n=>`<span class="link" onclick="openOrder('${n}')">${n}</span>`},{t:'订单金额',num:1,k:n=>fmt(ord(n).amount)},{t:'垫资单',k:n=>ord(n).adv||'—'},{t:'垫资归还',k:n=>ord(n).advState||'—'}],c.orders)}`}})}
function openOrder(no){openDrawer(()=>{const o=ord(no);const fs=S.flows.filter(f=>f.orderNo===no||(o.pi&&f.pi===o.pi)||(o.claimNo&&f.link&&f.link.no===o.claimNo));
  return {t:'订单资金 '+no,b:`${dl([['订单号',o.no],['客户',o.cust],['订单类型',o.kind],['支付方式',o.method||'银行转账'],['商家',accName(o.merchant)],['订单金额',fmt(o.amount)],['收单手续费',o.kind==='线上'?fmt(o.fee):''],['收单净额',o.kind==='线上'?fmt(o.net):''],['支付单号',o.pi],['付款状态',o.paid?'已付款':'未付款'],['认领单',o.claimNo],['垫资单',o.adv],['垫资归还',o.advState],['已退款',o.refunded?fmt(o.refunded):''],['商家结算',o.payout],['结算单',o.payoutNo]])}<div class="sec">资金流水</div>${flowTbl(fs)}`}})}

seed();refresh();
</script>
</body>
