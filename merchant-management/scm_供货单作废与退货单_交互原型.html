<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺运营平台 · 供货单作废 & 退货单 交互原型</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --green:#07A73C; --green-dark:#059033; --green-light:#EAF7EE;
  --text:#303133; --text-2:#606266; --text-3:#909399;
  --border:#DCDFE6; --border-light:#EBEEF5; --bg:#F5F7FA; --th-bg:#EBEDF0;
  --danger:#F56C6C; --warning:#E6A23C;
}
body{ font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:14px; color:var(--text); background:#fff; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font-family:inherit; font-size:14px; }

/* ---------- 顶部导航 ---------- */
.navbar{ height:40px; background:var(--green); display:flex; align-items:center; padding:0 16px; color:#fff; position:sticky; top:0; z-index:100; }
.navbar .logo{ font-size:19px; font-weight:700; letter-spacing:.5px; margin-right:32px; }
.navbar .sys-tabs{ display:flex; gap:6px; flex:1; }
.navbar .sys-tab{ padding:5px 14px; border-radius:4px; font-size:13px; cursor:pointer; opacity:.9; white-space:nowrap; }
.navbar .sys-tab.active{ background:rgba(255,255,255,.22); opacity:1; font-weight:600; }
.navbar .right{ display:flex; align-items:center; gap:18px; font-size:13px; }
.navbar .right span{ cursor:pointer; }

/* ---------- 布局 ---------- */
.layout{ display:flex; min-height:calc(100vh - 40px); }
.sidebar{ width:220px; background:#fff; border-right:1px solid var(--border-light); flex-shrink:0; padding-bottom:24px; }
.menu-search{ padding:12px; }
.menu-search input{ width:100%; height:32px; border:1px solid var(--border); border-radius:16px; padding:0 12px 0 30px; outline:none; color:var(--text-2);
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23909399' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>") no-repeat 10px center; }
.menu-group{ }
.menu-group-title{ display:flex; align-items:center; gap:10px; padding:12px 18px; cursor:pointer; color:var(--text); font-size:14px; }
.menu-group-title:hover{ color:var(--green); }
.menu-group-title .ico{ font-size:15px; width:18px; text-align:center; }
.menu-group-title .arrow{ margin-left:auto; color:var(--text-3); font-size:11px; transition:transform .2s; }
.menu-group.open .arrow{ transform:rotate(180deg); }
.menu-items{ display:none; }
.menu-group.open .menu-items{ display:block; }
.menu-item{ padding:10px 18px 10px 46px; cursor:pointer; color:var(--text-2); font-size:14px; }
.menu-item:hover{ color:var(--green); }
.menu-item.active{ background:var(--green-light); color:var(--green); font-weight:600; }
.menu-group.active-group > .menu-group-title{ background:var(--green-light); color:var(--green); }

.content{ flex:1; background:var(--bg); padding:16px 20px 40px; min-width:0; }
.breadcrumb{ font-size:13px; color:var(--text-3); margin-bottom:6px; }
.page-title{ font-size:22px; font-weight:600; margin-bottom:16px; }

/* ---------- 卡片 ---------- */
.card{ background:#fff; border-radius:4px; padding:20px; margin-bottom:12px; }
.card-header{ display:flex; align-items:center; justify-content:space-between; padding-bottom:16px; }
.card-header h3{ font-size:15px; font-weight:600; }

/* ---------- 筛选表单 ---------- */
.filter-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px 20px; }
.filter-item label{ display:block; font-size:13px; color:var(--text-2); margin-bottom:6px; }
.filter-actions{ display:flex; gap:10px; align-items:flex-end; padding-bottom:1px; }
.ipt, .sel{ width:100%; height:32px; border:1px solid var(--border); border-radius:4px; padding:0 10px; outline:none; color:var(--text); background:#fff; }
.ipt::placeholder{ color:#C0C4CC; }
.ipt:focus,.sel:focus,textarea:focus{ border-color:var(--green); }
.ipt[readonly]{ background:#F5F7FA; color:var(--text-2); cursor:not-allowed; }
.range{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:4px; height:32px; padding:0 10px; background:#fff; }
.range input{ border:none; outline:none; width:100%; color:var(--text); }
.range .sep{ color:var(--text-3); }

/* ---------- 按钮 ---------- */
.btn{ height:32px; padding:0 16px; border:1px solid var(--border); background:#fff; border-radius:4px; cursor:pointer; color:var(--text-2); white-space:nowrap; }
.btn:hover{ color:var(--green); border-color:var(--green); }
.btn.primary{ background:var(--green); border-color:var(--green); color:#fff; }
.btn.primary:hover{ background:var(--green-dark); border-color:var(--green-dark); color:#fff; }
.btn.danger{ color:var(--danger); }
.btn.danger:hover{ color:#fff; background:var(--danger); border-color:var(--danger); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn:disabled:hover{ color:var(--text-2); border-color:var(--border); background:#fff; }
.btn-text{ background:none; border:none; color:var(--green); cursor:pointer; padding:0; margin-right:14px; font-size:14px; }
.btn-text:last-child{ margin-right:0; }
.btn-text.red{ color:var(--danger); }
.btn-text:hover{ opacity:.75; }

/* ---------- 表格 ---------- */
table{ width:100%; border-collapse:collapse; }
thead th{ background:var(--th-bg); color:var(--text); font-weight:600; font-size:14px; text-align:left; padding:11px 10px; white-space:nowrap; }
tbody td{ padding:11px 10px; border-bottom:1px solid var(--border-light); color:var(--text-2); vertical-align:middle; }
tbody tr:hover{ background:#FAFAFA; }
.t-empty{ text-align:center; color:var(--text-3); padding:40px 0 !important; }
.thumb{ width:40px; height:40px; border-radius:4px; background:#F2F3F5; display:flex; align-items:center; justify-content:center; font-size:20px; }
.num-cell{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--text-3); }
input[type=checkbox]{ width:15px; height:15px; accent-color:var(--green); cursor:pointer; }

/* ---------- 状态标签 ---------- */
.tag{ display:inline-block; padding:1px 8px; border-radius:3px; font-size:12px; line-height:20px; border:1px solid; }
.tag.info{ color:var(--text-2); background:#F4F4F5; border-color:#E9E9EB; }
.tag.warn{ color:var(--warning); background:#FDF6EC; border-color:#F5DAB1; }
.tag.primary{ color:var(--green); background:var(--green-light); border-color:#B7E3C5; }
.tag.success{ color:#67C23A; background:#F0F9EB; border-color:#C2E7B0; }
.tag.danger{ color:var(--danger); background:#FEF0F0; border-color:#FBC4C4; }

/* ---------- 数量步进器 ---------- */
.stepper{ display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:4px; height:32px; width:132px; }
.stepper button{ width:30px; height:100%; border:none; background:#F5F7FA; color:var(--text-2); cursor:pointer; font-size:15px; }
.stepper button:hover{ color:var(--green); }
.stepper button:disabled{ opacity:.4; cursor:not-allowed; }
.stepper input{ flex:1; width:100%; border:none; outline:none; text-align:center; color:var(--text); font-variant-numeric:tabular-nums; }
.stepper.disabled{ background:#F5F7FA; opacity:.6; pointer-events:none; }

/* ---------- 表单（详情/新建） ---------- */
.form-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px 24px; }
.form-item{ display:flex; align-items:center; gap:10px; }
.form-item.full{ grid-column:1 / -1; align-items:flex-start; }
.form-item > label{ width:110px; flex-shrink:0; text-align:right; color:var(--text-2); font-size:14px; }
.form-item > label .req{ color:var(--danger); margin-right:3px; }
.form-item .ctl{ flex:1; min-width:0; }
textarea{ width:100%; border:1px solid var(--border); border-radius:4px; padding:8px 10px; outline:none; resize:vertical; color:var(--text); line-height:1.5; }
.readonly-val{ height:32px; line-height:32px; color:var(--text); }

/* ---------- 分页 ---------- */
.pager{ display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-top:16px; color:var(--text-2); font-size:13px; }
.pager .pg{ min-width:28px; height:28px; border-radius:3px; background:#F4F4F5; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0 6px; }
.pager .pg.active{ background:var(--green); color:#fff; }

/* ---------- 页脚操作条 ---------- */
.footer-bar{ display:flex; justify-content:center; gap:12px; padding:18px 0 6px; }

/* ---------- 弹窗 ---------- */
.mask{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:500; }
.mask.show{ display:flex; }
.dialog{ background:#fff; border-radius:4px; width:480px; max-width:92vw; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,.14); }
.dialog.wide{ width:820px; }
.dialog h4{ font-size:16px; font-weight:600; margin-bottom:16px; }
.dialog .dlg-body{ color:var(--text-2); line-height:1.7; font-size:14px; max-height:60vh; overflow:auto; }
.dialog .dlg-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
.dlg-warn{ display:flex; gap:10px; align-items:flex-start; }
.dlg-warn .ico{ color:var(--warning); font-size:20px; line-height:1.2; }

/* ---------- 轻提示 ---------- */
#toast-wrap{ position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:900; display:flex; flex-direction:column; gap:10px; align-items:center; }
.toast{ padding:10px 16px; border-radius:4px; font-size:14px; box-shadow:0 2px 12px rgba(0,0,0,.1); animation:tin .2s ease; }
.toast.success{ background:#F0F9EB; color:#67C23A; border:1px solid #C2E7B0; }
.toast.error{ background:#FEF0F0; color:var(--danger); border:1px solid #FBC4C4; }
.toast.warning{ background:#FDF6EC; color:var(--warning); border:1px solid #F5DAB1; }
@keyframes tin{ from{ opacity:0; transform:translateY(-8px);} }

.hide{ display:none !important; }
.mt12{ margin-top:12px; }
.selected-tip{ color:var(--text-2); font-size:13px; margin-bottom:14px; }
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">Foodmax</div>
  <div class="sys-tabs">
    <div class="sys-tab">商城(MALL)</div>
    <div class="sys-tab">采购(SCM)</div>
    <div class="sys-tab">仓储(WMS)</div>
    <div class="sys-tab">运输管理系统(TMS)</div>

    <span>小满新加坡(SG Xiaoman)</span><span>简体中文 ▾</span><span>货币: SGD</span><span>沈亮 ▾</span>

<div class="layout">
  <aside class="sidebar">
    <div class="menu-search"><input placeholder="菜单搜索"></div>
    <div class="menu-group"><div class="menu-group-title"><span class="ico">🏪</span>商家<span class="arrow">▾</span></div></div>

    <div class="menu-group"><div class="menu-group-title"><span class="ico">🎯</span>营销<span class="arrow">▾</span></div></div>
    <div class="menu-group"><div class="menu-group-title"><span class="ico">📦</span>商品中心<span class="arrow">▾</span></div></div>

      </div>

  </aside>

  <main class="content" id="content"></main>
</div>

<div class="mask" id="mask"><div class="dialog" id="dialog"></div></div>
<div id="toast-wrap"></div>

<script>
/* =========================================================================
   Mock 数据 —— 字段名 / 枚举 / 单号规则全部取自线上真实接口
   供货单：foodmax-platform-service /platform/consign/*
   退货单：本期新增 /platform/consignReturn/*（待研发确认命名）
   ========================================================================= */

// 供货单状态：10待下单 20待发货 30待入库 40已完成 50已作废(本期新增)
const CONSIGN_STATUS = { 10:'待下单', 20:'待发货', 30:'待入库', 40:'已完成', 50:'已作废' };
const CONSIGN_TAG    = { 10:'info', 20:'warn', 30:'primary', 40:'success', 50:'danger' };
// 退货单状态：10待出库 20已出库 30已作废
const RETURN_STATUS = { 10:'待出库', 20:'已出库', 30:'已作废' };
const RETURN_TAG    = { 10:'warn', 20:'success', 30:'danger' };
// WMS 推送状态：0待推送 1成功 2失败
const WMS_PUSH = { 0:'待推送', 1:'成功', 2:'失败' };

const WAREHOUSES = [
  { code:'Singapore001', name:'新加坡-B端仓' },
  { code:'Singapore002', name:'新加坡-KA仓' },
  { code:'Singapore003', name:'新加坡-大贸仓' },
  { code:'Singapore004', name:'新加坡-越库仓' },

const ITEMS = {
  'ITEM260807000004':{ itemName:'新加坡本地新鲜棕色鸡蛋-AA级 30粒 (70-75g)', itemSpec:'1托(30粒)', measureUnitDesc:'托', categoryName:'Egg products/Fresh Eggs', emoji:'🥚' },
  'ITEM260807000005':{ itemName:'无笼新鲜棕色鸡蛋-C级30粒 (54-60g)',        itemSpec:'1托(30粒)', measureUnitDesc:'托', categoryName:'Egg products/Fresh Eggs', emoji:'🥚' },
  'ITEM260804170001':{ itemName:'AO700 塑料杯 700毫升 50个',                 itemSpec:'1包(50片)', measureUnitDesc:'包', categoryName:'Kitchenware/tableware', emoji:'🥤' },
  'ITEM260807150003':{ itemName:'竹筷子 8" (70双)',                          itemSpec:'1包(70双)', measureUnitDesc:'包', categoryName:'Kitchenware/tableware', emoji:'🥢' },
  'ITEM260731000012':{ itemName:'新加坡本地白壳鸡蛋-A级 10粒',                itemSpec:'1盒(10粒)', measureUnitDesc:'盒', categoryName:'Egg products/Fresh Eggs', emoji:'🥚' },
};

function it(code, quantity, actualQuantity){
  return Object.assign({ itemCode:code, quantity, actualQuantity }, ITEMS[code]);
}

let CONSIGNS = [
  { consignOrderNo:'GH202608180007', shopName:'GOLDEN WING', merchantCode:'M2026072900001', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    expectArrivalTime:'2026-08-20 00:00:00', bookingArrivalTime:'', inboundFinishTime:'', remark:'', status:10,
    wmsPushStatus:0, wmsOrderNo:'', createName:'WONGWAI TENG', createTime:'2026-08-18 15:02:10', cancelName:'', cancelTime:'',
    items:[ it('ITEM260731000012', 60, null) ] },

  { consignOrderNo:'GH202608180006', shopName:'YUAN SEM EGGS', merchantCode:'M2026072100001', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    expectArrivalTime:'2026-08-20 00:00:00', bookingArrivalTime:'', inboundFinishTime:'', remark:'周三上午送', status:20,
    wmsPushStatus:0, wmsOrderNo:'', createName:'WONGWAI TENG', createTime:'2026-08-18 14:41:33', cancelName:'', cancelTime:'',
    items:[ it('ITEM260807000005', 120, null) ] },

  { consignOrderNo:'GH202608180005', shopName:'Ang Seng Eggs', merchantCode:'M2026080500003', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    expectArrivalTime:'2026-08-19 00:00:00', bookingArrivalTime:'2026-08-19 00:00:00', inboundFinishTime:'', remark:'', status:30,
    wmsPushStatus:1, wmsOrderNo:'JSR2026081800005', createName:'WONGWAI TENG', createTime:'2026-08-18 12:30:04', cancelName:'', cancelTime:'',
    items:[ it('ITEM260807000004', 35, null) ] },

  { consignOrderNo:'GH202608180004', shopName:'YUAN SEM EGGS', merchantCode:'M2026072100001', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    expectArrivalTime:'2026-08-19 00:00:00', bookingArrivalTime:'2026-08-19 00:00:00', inboundFinishTime:'', remark:'', status:30,
    wmsPushStatus:1, wmsOrderNo:'JSR2026081800004', createName:'WONGWAI TENG', createTime:'2026-08-18 11:58:41', cancelName:'', cancelTime:'',
    items:[ it('ITEM260807000005', 80, null) ] },

  { consignOrderNo:'GH202608180003', shopName:'PACIFIC M', merchantCode:'M2026080300001', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    expectArrivalTime:'2026-08-18 00:00:00', bookingArrivalTime:'2026-08-18 00:00:00', inboundFinishTime:'2026-08-18 14:19:12', remark:'', status:40,
    wmsPushStatus:1, wmsOrderNo:'JSR2026081800003', createName:'WONGWAI TENG', createTime:'2026-08-18 11:30:46', cancelName:'', cancelTime:'',
    items:[ it('ITEM260804170001', 20, 20), it('ITEM260807150003', 30, 28) ] },

  { consignOrderNo:'GH202608180001', shopName:'YUAN SEM EGGS', merchantCode:'M2026072100001', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    expectArrivalTime:'2026-08-18 00:00:00', bookingArrivalTime:'2026-08-18 00:00:00', inboundFinishTime:'2026-08-18 10:02:35', remark:'', status:40,
    wmsPushStatus:1, wmsOrderNo:'JSR2026081800001', createName:'WONGWAI TENG', createTime:'2026-08-18 08:12:20', cancelName:'', cancelTime:'',
    items:[ it('ITEM260807000004', 50, 50), it('ITEM260807000005', 40, 40) ] },

  { consignOrderNo:'GH202608170001', shopName:'GOLDEN WING', merchantCode:'M2026072900001', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    expectArrivalTime:'2026-08-18 00:00:00', bookingArrivalTime:'2026-08-18 00:00:00', inboundFinishTime:'2026-08-18 09:41:07', remark:'', status:40,
    wmsPushStatus:1, wmsOrderNo:'JSR2026081700001', createName:'WONGWAI TENG', createTime:'2026-08-17 17:22:56', cancelName:'', cancelTime:'',
    items:[ it('ITEM260731000012', 100, 100) ] },

  { consignOrderNo:'GH202608140002', shopName:'Ang Seng Eggs Distributor', merchantCode:'M2026080500004', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',

    items:[ it('ITEM260807000004', 25, null) ] },
];

let RETURNS = [
  { returnOrderNo:'TH202608180001', consignOrderNo:'GH202608180003', shopName:'PACIFIC M', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',
    status:20, remark:'客户反馈杯身开裂', wmsPushStatus:1, wmsOrderNo:'JSC2026081800001',
    createName:'沈亮', createTime:'2026-08-18 15:10:22', outboundFinishTime:'2026-08-18 17:41:03', cancelName:'', cancelTime:'',
    items:[ { itemCode:'ITEM260804170001', returnQuantity:5, actualReturnQuantity:5 } ] },

  { returnOrderNo:'TH202608180002', consignOrderNo:'GH202608180001', shopName:'YUAN SEM EGGS', warehouseCode:'Singapore001', warehouseName:'新加坡-B端仓',

    createName:'沈亮', createTime:'2026-08-18 16:02:55', outboundFinishTime:'', cancelName:'', cancelTime:'',
    items:[ { itemCode:'ITEM260807000004', returnQuantity:6, actualReturnQuantity:null } ] },
];

/* ===================== 工具 ===================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dash = v => (v===''||v==null) ? '<span class="muted">--</span>' : esc(v);
const nowStr = () => { const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function openDialog(html){ $('#dialog').innerHTML = html; $('#mask').classList.add('show'); }
function closeDialog(){ $('#mask').classList.remove('show'); $('#dialog').className='dialog'; }
$('#mask').addEventListener('click', e => { if (e.target.id === 'mask') closeDialog(); });

// 已退数量（待出库 + 已出库 都占用可退额度；已作废释放）
function returnedQty(consignOrderNo, itemCode){
  return RETURNS.filter(r => r.consignOrderNo===consignOrderNo && r.status!==30)
    .flatMap(r => r.items).filter(i => i.itemCode===itemCode)
    .reduce((s,i)=> s + (i.actualReturnQuantity != null ? i.actualReturnQuantity : i.returnQuantity), 0);
}
function consignOf(no){ return CONSIGNS.find(c => c.consignOrderNo === no); }
function itemMeta(code){ return ITEMS[code] || { itemName:code, itemSpec:'', measureUnitDesc:'', emoji:'📦' }; }
// 供货单是否还有可退额度
function hasReturnable(c){
  return c.status === 40 && c.items.some(i => (i.actualQuantity||0) - returnedQty(c.consignOrderNo, i.itemCode) > 0);
}

/* ===================== 路由 ===================== */

/* ---------- 作废二次确认（不填原因） ---------- */
function confirmCancelConsign(no, after){
  const c = consignOf(no);
  const pushed = c.wmsPushStatus === 1 && c.wmsOrderNo;
  openDialog(`
    <h4>作废确认</h4>
    <div class="dlg-body dlg-warn">
      <div class="ico">⚠</div>
      <div>
        确定作废供货单 <b>${esc(no)}</b>？作废后不可恢复，也不能再发起退货。
        ${ pushed ? `<br>该单已推送 WMS（入库单 <b>${esc(c.wmsOrderNo)}</b>），作废时将同步取消 WMS 入库单。` : '' }
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn" id="dlg-cancel">取 消</button>
      <button class="btn primary" id="dlg-ok">确 定</button>
    </div>`);
  $('#dlg-cancel').onclick = closeDialog;
  $('#dlg-ok').onclick = () => {
    // 演示 WMS 取消失败的兜底：单号以 4 结尾的单模拟 WMS 已开始收货、取消失败
    if (pushed && c.wmsOrderNo.endsWith('4')) {
      closeDialog();
      toast('WMS 入库单取消失败，供货单未作废：入库单已开始收货', 'error');
      return;
    }
    c.status = 50; c.cancelName = '沈亮'; c.cancelTime = nowStr();
    if (pushed) c.wmsOrderNo = c.wmsOrderNo; // WMS 单已取消，单号保留可追溯
    closeDialog(); toast('作废成功'); after && after();
  };
}

/* =========================================================================
   页面四：新建退货单（必须关联供货单）
   ========================================================================= */
function renderReturnCreate(presetConsignNo){
  const d = state.draft = { consignOrderNo: presetConsignNo || '', remark:'', lines:[] };
  if (presetConsignNo) loadConsignLines(d, presetConsignNo);
  paintReturnCreate();
}

function loadConsignLines(d, no){
  const c = consignOf(no);
  d.lines = c.items.map(i => {
    const returned = returnedQty(no, i.itemCode);
    const returnable = (i.actualQuantity||0) - returned;
    return { itemCode:i.itemCode, itemName:i.itemName, itemSpec:i.itemSpec, measureUnitDesc:i.measureUnitDesc,
             emoji:i.emoji, actualQuantity:i.actualQuantity, returned, returnable,
             checked:false, returnQuantity: returnable > 0 ? returnable : 0 };
  });
}

function paintReturnCreate(){
  const d = state.draft;
  const c = d.consignOrderNo ? consignOf(d.consignOrderNo) : null;

  $('#content').innerHTML = `

        <thead><tr>
          <th style="width:44px"><input type="checkbox" id="ck-all"></th>
          <th style="width:70px">图片</th><th>商品名称</th><th>商品编码</th><th>规格</th><th>单位</th>

        </tr></thead>
        <tbody>${ d.lines.map((l,idx)=>`
          <tr>
            <td><input type="checkbox" data-ck="${idx}" ${l.checked?'checked':''} ${l.returnable<=0?'disabled':''}></td>
            <td><div class="thumb">${l.emoji}</div></td>
            <td>${esc(l.itemName)}</td><td>${esc(l.itemCode)}</td><td>${esc(l.itemSpec)}</td><td>${esc(l.measureUnitDesc)}</td>
            <td class="num-cell">${l.actualQuantity}</td>
            <td class="num-cell">${ l.returned>0 ? l.returned : '<span class="muted">--</span>' }</td>
            <td class="num-cell"><b>${l.returnable}</b></td>
            <td>
              <div class="stepper ${ l.checked && l.returnable>0 ? '' : 'disabled' }">
                <button data-step="-1" data-idx="${idx}">−</button>
                <input data-qty="${idx}" value="${l.returnQuantity}">
                <button data-step="1" data-idx="${idx}">＋</button>
              </div>
            </td>
          </tr>`).join('') }
        </tbody>
      </table>` }
      <div class="footer-bar">
        <button class="btn" id="btn-cancel-create">取 消</button>
        <button class="btn primary" id="btn-submit">保存并提交</button>
      </div>
    </div>`;

  $('#btn-back').onclick = $('#btn-cancel-create').onclick = () => nav('return-list');
  $('#btn-pick').onclick = openConsignPicker;
  $('#ipt-remark').oninput = e => d.remark = e.target.value;

  const ckAll = $('#ck-all');
  if (ckAll) ckAll.onclick = e => {
    d.lines.forEach(l => { if (l.returnable > 0) l.checked = e.target.checked; });
    paintReturnCreate();
  };
  $$('[data-ck]').forEach(b => b.onclick = () => {
    const l = d.lines[+b.dataset.ck];
    l.checked = b.checked;
    if (l.checked && l.returnQuantity <= 0) l.returnQuantity = l.returnable;
    paintReturnCreate();
  });
  $$('[data-step]').forEach(b => b.onclick = () => {
    const l = d.lines[+b.dataset.idx];
    l.returnQuantity = Math.min(l.returnable, Math.max(1, l.returnQuantity + (+b.dataset.step)));
    paintReturnCreate();
  });
  $$('[data-qty]').forEach(ip => ip.onchange = () => {

    if (isNaN(v) || v < 1) v = 1;
    if (v > l.returnable) { v = l.returnable; toast(`退货数量不能超过可退数量 ${l.returnable}`, 'warning'); }
    l.returnQuantity = v; paintReturnCreate();
  });

  $('#btn-submit').onclick = submitReturn;
}

/* ---------- 供货单选择弹窗：只列已完成 + 仍有可退额度的单 ---------- */
function openConsignPicker(kw=''){
  const list = CONSIGNS.filter(hasReturnable)
    .filter(c => !kw || c.consignOrderNo.includes(kw) || c.shopName.toLowerCase().includes(kw.toLowerCase()));
  $('#dialog').className = 'dialog wide';
  openDialog(`
    <h4>选择供货单</h4>
    <div class="dlg-body">
      <div style="display:flex; gap:10px; margin-bottom:14px">
        <input class="ipt" id="pk-kw" placeholder="按供货单号 / 商家店铺搜索" value="${esc(kw)}" style="width:280px">
        <button class="btn primary" id="pk-search">查询</button>
      </div>
      <table>
        <thead><tr><th>供货单号</th><th>商家店铺</th><th>仓库</th><th>入库完成时间</th><th>状态</th><th style="width:80px">操作</th></tr></thead>
        <tbody>${ list.length ? list.map(c=>`
          <tr>
            <td>${esc(c.consignOrderNo)}</td><td>${esc(c.shopName)}</td><td>${esc(c.warehouseName)}</td>
            <td class="num-cell">${esc(c.inboundFinishTime)}</td>
            <td><span class="tag ${CONSIGN_TAG[c.status]}">${CONSIGN_STATUS[c.status]}</span></td>
            <td><button class="btn-text" data-pick="${c.consignOrderNo}">选择</button></td>
          </tr>`).join('') : `<tr><td colspan="6" class="t-empty">暂无可退货的供货单</td></tr>` }
        </tbody>
      </table>
    </div>
    <div class="dlg-foot"><button class="btn" id="dlg-cancel">取 消</button></div>`);
  $('#dlg-cancel').onclick = closeDialog;
  $('#pk-search').onclick = () => openConsignPicker($('#pk-kw').value.trim());
  $$('[data-pick]').forEach(b => b.onclick = () => {
    state.draft.consignOrderNo = b.dataset.pick;
    loadConsignLines(state.draft, b.dataset.pick);
    closeDialog(); paintReturnCreate();
  });
}

function submitReturn(){
  const d = state.draft;
  if (!d.consignOrderNo) return toast('请选择关联供货单', 'warning');
  const picked = d.lines.filter(l => l.checked);
  if (!picked.length) return toast('请至少勾选一条退货商品明细', 'warning');
  const bad = picked.find(l => !(l.returnQuantity > 0) || l.returnQuantity > l.returnable);
  if (bad) return toast(`「${bad.itemName}」退货数量必须大于 0 且不超过可退数量 ${bad.returnable}`, 'warning');

  const c = consignOf(d.consignOrderNo);
  const seq = String(RETURNS.length + 1).padStart(4, '0');
  const no  = 'TH' + nowStr().slice(0,10).replace(/-/g,'') + seq;
  RETURNS.unshift({
    returnOrderNo:no, consignOrderNo:c.consignOrderNo, shopName:c.shopName,
    warehouseCode:c.warehouseCode, warehouseName:c.warehouseName,
    status:10, remark:d.remark, wmsPushStatus:1, wmsOrderNo:'JSC' + nowStr().slice(0,10).replace(/-/g,'') + seq,
    createName:'沈亮', createTime:nowStr(), outboundFinishTime:'', cancelName:'', cancelTime:'',
    items:picked.map(l => ({ itemCode:l.itemCode, returnQuantity:l.returnQuantity, actualReturnQuantity:null }))
  });
  toast('提交成功');
  nav('return-detail', no);
}

/* =========================================================================
   页面五：退货单详情
   ========================================================================= */
function renderReturnDetail(no){
  const r = RETURNS.find(x => x.returnOrderNo === no);
  const c = consignOf(r.consignOrderNo);
  $('#content').innerHTML = `
    <div class="breadcrumb">店铺运营平台 / 退货单管理</div>
    <div class="page-title">退货单管理</div>

    <div class="card">
      <div class="card-header"><h3>基本信息</h3>
        <div>
          ${ r.status===10 ? `<button class="btn danger" id="btn-rcancel">作废</button>` : '' }
          <button class="btn" id="btn-back" style="margin-left:10px">返回</button>
        </div></div>
      <div class="form-grid">
        <div class="form-item"><label>退货单号：</label><div class="ctl readonly-val">${esc(r.returnOrderNo)}</div></div>
        <div class="form-item"><label>关联供货单：</label><div class="ctl readonly-val">
          <button class="btn-text" id="btn-goconsign">${esc(r.consignOrderNo)}</button></div></div>
        <div class="form-item"><label>商家店铺：</label><div class="ctl readonly-val">${esc(r.shopName)}</div></div>
        <div class="form-item"><label>仓库：</label><div class="ctl readonly-val">${esc(r.warehouseName)}</div></div>
        <div class="form-item"><label>状态：</label><div class="ctl readonly-val"><span class="tag ${RETURN_TAG[r.status]}">${RETURN_STATUS[r.status]}</span></div></div>
        <div class="form-item"><label>WMS 出库单号：</label><div class="ctl readonly-val">${dash(r.wmsOrderNo)}</div></div>
        <div class="form-item"><label>WMS 推送状态：</label><div class="ctl readonly-val">${WMS_PUSH[r.wmsPushStatus]}</div></div>
        <div class="form-item"><label>出库完成时间：</label><div class="ctl readonly-val">${dash(r.outboundFinishTime)}</div></div>
        <div class="form-item"><label>创建人：</label><div class="ctl readonly-val">${esc(r.createName)}</div></div>
        <div class="form-item"><label>创建时间：</label><div class="ctl readonly-val">${esc(r.createTime)}</div></div>
        ${ r.status===30 ? `
        <div class="form-item"><label>作废人：</label><div class="ctl readonly-val">${esc(r.cancelName)}</div></div>
        <div class="form-item"><label>作废时间：</label><div class="ctl readonly-val">${esc(r.cancelTime)}</div></div>` : '' }
        <div class="form-item full"><label>备注：</label><div class="ctl readonly-val">${dash(r.remark)}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>退货商品明细</h3></div>
      <table>
        <thead><tr><th style="width:70px">图片</th><th>商品名称</th><th>商品编码</th><th>规格</th><th>单位</th>
          <th>实际入库数量</th><th>本次退货数量</th><th>实际出库数量</th></tr></thead>
        <tbody>${ r.items.map(i=>{
          const m = itemMeta(i.itemCode);
          const src = c ? c.items.find(x => x.itemCode === i.itemCode) : null;
          return `<tr>
            <td><div class="thumb">${m.emoji}</div></td>
            <td>${esc(m.itemName)}</td><td>${esc(i.itemCode)}</td><td>${esc(m.itemSpec)}</td><td>${esc(m.measureUnitDesc)}</td>
            <td class="num-cell">${ src && src.actualQuantity!=null ? src.actualQuantity : '<span class="muted">--</span>' }</td>
            <td class="num-cell">${i.returnQuantity}</td>
            <td class="num-cell">${ i.actualReturnQuantity==null ? '<span class="muted">--</span>' : i.actualReturnQuantity }</td>
          </tr>`; }).join('') }
        </tbody>
      </table>
    </div>`;

  $('#btn-back').onclick = () => nav('return-list');
  $('#btn-goconsign').onclick = () => nav('consign-detail', r.consignOrderNo);
  const b = $('#btn-rcancel');
  if (b) b.onclick = () => {
    openDialog(`
      <h4>作废确认</h4>
      <div class="dlg-body dlg-warn"><div class="ico">⚠</div>
        <div>确定作废退货单 <b>${esc(r.returnOrderNo)}</b>？作废后不可恢复，退货数量将退回供货单的可退额度。
        ${ r.wmsOrderNo ? `<br>该单已推送 WMS（出库单 <b>${esc(r.wmsOrderNo)}</b>），作废时将同步取消 WMS 出库单。` : '' }</div></div>
      <div class="dlg-foot"><button class="btn" id="dlg-cancel">取 消</button><button class="btn primary" id="dlg-ok">确 定</button></div>`);
    $('#dlg-cancel').onclick = closeDialog;
    $('#dlg-ok').onclick = () => { r.status = 30; r.cancelName='沈亮'; r.cancelTime = nowStr(); closeDialog(); toast('作废成功'); nav('return-detail', no); };
  };
}

nav('consign-list');
</script>
</body>
</html>
