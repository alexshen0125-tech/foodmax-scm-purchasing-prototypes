<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Food Max · 商家端 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 数据驱动基线：ui-ux-pro-max grocery 配色 + Wellness Calm 字体配对(Lora+Raleway) */
:root{
  --emerald:#059669; --emerald-2:#047857; --emerald-d:#065F46;
  --mint:#10B981; --mint-soft:#D1FAE5; --amber:#D97706; --amber-soft:#FEF3C7;
  --bg:#F4FBF7; --card:#FFFFFF; --ink:#0F172A; --sub:#64748B; --line:#E4F0E9; --muted:#F0F8F6;
  --red:#DC2626; --red-soft:#FEE2E2;
  --sh:0 12px 30px rgba(6,95,70,.10); --sh-sm:0 4px 14px rgba(6,95,70,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Raleway',-apple-system,"PingFang SC",sans-serif;color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 30% 0%,#243B31,#161D19 65%);}
.disp{font-family:'Lora','PingFang SC',serif;}
.phone{width:390px;height:844px;border-radius:48px;position:relative;overflow:hidden;background:var(--bg);
  border:11px solid #0A120D;box-shadow:0 32px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;}
.statusbar{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:700;font-size:15px;position:relative;z-index:30;}
.statusbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:116px;height:33px;background:#0A120D;border-radius:20px;}
.statusbar .r{display:flex;gap:6px;align-items:center;font-size:13px;}
.statusbar .batt{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:3px;padding:1.5px;}
.statusbar .batt i{display:block;height:100%;width:72%;background:var(--ink);border-radius:1px;}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:5;}
.screen::-webkit-scrollbar{display:none;}
.view{display:none;}.view.on{display:block;}
.tabbar{flex:0 0 84px;height:84px;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:10px 8px 0;z-index:20;}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;position:relative;padding-top:4px;min-height:44px;}
.tabbar .tab svg{width:24px;height:24px;stroke:var(--sub);fill:none;stroke-width:1.8;}
.tabbar .tab.active{color:var(--emerald);}.tabbar .tab.active svg{stroke:var(--emerald);}
.tabbar .tab.active::before{content:"";position:absolute;top:-1px;width:22px;height:3px;border-radius:3px;background:var(--emerald);}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.14s}.stagger>*:nth-child(4){animation-delay:.2s}.stagger>*:nth-child(5){animation-delay:.26s}.stagger>*:nth-child(6){animation-delay:.32s}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.sk{background:linear-gradient(90deg,#EAF3EE 25%,#F4FBF7 37%,#EAF3EE 63%);background-size:400px 100%;animation:shimmer 1.2s infinite;border-radius:8px;}

/* 工作台 */
.hm-top{display:flex;align-items:center;gap:11px;padding:8px 20px 14px;}
.hm-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--emerald),var(--emerald-d));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(5,150,105,.32);}
.hm-logo svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2;}
.hm-store{flex:1;min-width:0;}
.hm-store .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-store .sub{font-size:11.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:5px;}
.hm-store .sub .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);}
.hm-bell{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:center;position:relative;}
.hm-bell svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;}
.hm-bell .rd{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff;}
.hero{margin:0 16px;border-radius:24px;padding:22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#0AA06A 0%,#047857 52%,#065F46 100%);box-shadow:0 18px 40px rgba(6,95,70,.34);}
.hero::before{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(217,119,6,.45),transparent 70%);}
.hero .lab{font-size:12.5px;opacity:.88;display:flex;align-items:center;gap:8px;position:relative;}
.hero .lab .ln{flex:1;height:1px;background:rgba(255,255,255,.22);}
.hero .big{font-size:46px;font-weight:600;line-height:1;margin:11px 0 3px;position:relative;letter-spacing:-.01em;}
.hero .big .c{font-size:22px;opacity:.82;margin-right:4px;}
.hero .trend{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.17);padding:4px 10px;border-radius:20px;position:relative;}
.hero .row2{display:flex;gap:24px;margin-top:18px;position:relative;}
.hero .row2 .m .v{font-size:21px;font-weight:600;}.hero .row2 .m .k{font-size:11.5px;opacity:.82;}
.hero .row2 .ar{margin-left:auto;align-self:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.17);display:flex;align-items:center;justify-content:center;}
.hero .row2 .ar svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;}
/* 经营概览 hero（UI skill：Trust&Authority + Bento；分段控件/SVG图标/tabular-nums/权重层级/44px触控） */
.hv-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;position:relative;}
.hv-seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:22px;padding:3px;gap:2px;}
.hv-seg .s{font-size:12px;font-weight:600;color:rgba(255,255,255,.82);padding:7px 13px;border-radius:19px;cursor:pointer;transition:background .18s,color .18s;white-space:nowrap;}
.hv-seg .s.on{background:#fff;color:var(--emerald-2);box-shadow:0 2px 7px rgba(0,0,0,.14);}
.hv-refresh{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 36px;}
.hv-refresh svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;transition:transform .5s cubic-bezier(.3,.8,.3,1);}
.hv-refresh:active svg{transform:rotate(-360deg);}
.hv-lab{font-size:12px;color:rgba(255,255,255,.82);display:flex;align-items:center;gap:6px;position:relative;}
.hv-lab .t{font-weight:600;color:#fff;}
.hv-big{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em;margin:10px 0 7px;position:relative;font-variant-numeric:tabular-nums;}
.hv-big .c{font-size:20px;opacity:.82;margin-right:3px;font-weight:500;}
.hv-trend{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;position:relative;}
.hv-trend svg{width:13px;height:13px;stroke:#EAFBF2;fill:none;stroke-width:2.4;}
.hv-stats{display:flex;margin-top:19px;position:relative;}
.hv-stats .m{flex:1;}
.hv-stats .m+.m{border-left:1px solid rgba(255,255,255,.18);padding-left:16px;}
.hv-stats .v{font-family:'Lora',serif;font-size:21px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;}
.hv-stats .v .u{font-size:13px;opacity:.8;margin-right:1px;font-family:'Raleway',sans-serif;}
.hv-stats .k{font-size:11.5px;color:rgba(255,255,255,.8);margin-top:4px;}
.todobar{display:flex;gap:10px;margin:16px;overflow-x:auto;}.todobar::-webkit-scrollbar{display:none;}
.todo{flex:0 0 auto;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--sh-sm);min-width:98px;cursor:pointer;position:relative;}
.todo .n{font-size:23px;font-weight:700;color:var(--emerald-2);line-height:1;}.todo .n.warn{color:var(--red);}
.todo .t{font-size:12px;color:var(--sub);margin-top:3px;}
.todo .pin{position:absolute;top:12px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--amber);}
.block{background:#fff;margin:0 16px 16px;border-radius:22px;padding:18px 16px 8px;box-shadow:var(--sh-sm);}
.block.flush{padding-bottom:18px;}
.bhead{display:flex;align-items:baseline;margin:0 4px 15px;}.bhead .h{font-size:18px;font-weight:700;}.bhead .more{margin-left:auto;font-size:12.5px;color:var(--sub);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;padding-bottom:12px;}
.gi{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative;min-height:44px;}
.gi .tile{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.gi:active .tile{transform:scale(.92);}
.gi .tile svg{width:25px;height:25px;fill:none;stroke-width:1.7;}
.gi .gl{font-size:12px;color:#27433A;font-weight:500;}
.gi .bdg{position:absolute;top:-7px;left:50%;margin-left:6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;white-space:nowrap;}
.gi .bdg.amber{background:var(--amber);}
.deliver{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;}
.di{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative;min-height:44px;}
.di .ic{width:46px;height:46px;border-radius:14px;background:var(--mint-soft);display:flex;align-items:center;justify-content:center;}
.di .ic svg{width:22px;height:22px;stroke:var(--emerald-2);fill:none;stroke-width:1.7;}
.di .dl{font-size:11.5px;color:#27433A;}
.di .bdg{position:absolute;top:-6px;left:50%;margin-left:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;}
.growth{margin:0 16px 22px;border-radius:20px;padding:18px;background:linear-gradient(120deg,var(--amber-soft),#FDEBC8);position:relative;overflow:hidden;}
.growth .gt{font-size:11.5px;font-weight:700;color:#B45309;letter-spacing:.05em;}
.growth h4{font-size:16px;font-weight:700;margin:5px 0 10px;}
.growth .chips{display:flex;flex-wrap:wrap;gap:6px;}
.growth .chips span{background:rgba(255,255,255,.72);border-radius:20px;padding:4px 11px;font-size:11px;color:#92600F;font-weight:600;}

/* 页面栈 */
.navbar{height:52px;flex:0 0 52px;display:flex;align-items:center;padding:0 14px;position:relative;z-index:10;background:var(--bg);}
.navbar .back{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.navbar .back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.4;}
.navbar .nt{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:700;white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.navbar .nr{margin-left:auto;font-size:14px;color:var(--emerald);font-weight:600;}
.page-stack{position:absolute;inset:52px 0 0;z-index:25;pointer-events:none;}
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);pointer-events:auto;isolation:isolate;z-index:1;}
.page.show{transform:none;}
.page-footer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:12px 16px 16px;}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;min-height:48px;}
.btn.primary{background:var(--emerald);color:#fff;box-shadow:0 8px 20px rgba(5,150,105,.3);}
.btn.ghost{background:var(--muted);color:var(--ink);}
.btn:disabled{background:#BFD8CD;color:#fff;box-shadow:none;}
.btn.loading{color:transparent;position:relative;}
.btn.loading::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;padding:0 40px;}
.ph .pic{width:100px;height:100px;border-radius:30px;background:var(--mint-soft);display:flex;align-items:center;justify-content:center;}
.ph .pic svg{width:46px;height:46px;stroke:var(--emerald-2);fill:none;stroke-width:1.5;}
.ph h3{font-size:20px;font-weight:700;}.ph p{font-size:13.5px;color:var(--sub);line-height:1.7;}
.ph .pill{margin-top:4px;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;background:var(--amber-soft);color:#B45309;}
/* 确认弹窗 / toast */
.modal-mask{position:absolute;inset:0;z-index:120;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:34px;animation:fade .2s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;width:100%;max-width:300px;overflow:hidden;animation:rise .25s;}
.modal .mt{padding:24px 22px 8px;text-align:center;font-size:17px;font-weight:700;}
.modal .mb{padding:0 22px 22px;text-align:center;font-size:13.5px;color:var(--sub);line-height:1.6;}
.modal .mf{display:flex;border-top:1px solid var(--line);}
.modal .mf .mbn{flex:1;text-align:center;padding:15px;font-size:16px;font-weight:600;cursor:pointer;}
.modal .mf .mbn.cancel{color:var(--sub);border-right:1px solid var(--line);}
.modal .mf .mbn.danger{color:var(--red);font-weight:700;}
.modal .mf .mbn.ok{color:var(--emerald);font-weight:700;}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(15,23,42,.92);color:#fff;padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;animation:rise .2s;}
.sheet-mask{position:absolute;inset:0;z-index:120;background:rgba(15,23,42,.42);display:flex;align-items:flex-end;animation:fade .2s;}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:8px 0 16px;animation:rise .25s;}
.sheet .si{padding:16px;text-align:center;font-size:16px;border-bottom:1px solid var(--line);cursor:pointer;}
.sheet .si.danger{color:var(--red);}.sheet .si.cancel{color:var(--sub);}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="island"></span><span class="r"><span>•••</span><span>令</span><span class="batt"><i></i></span></span></div>
  <div class="screen view on" id="v-home"></div>
  <div class="screen view" id="v-orders"></div>
  <div class="screen view" id="v-goods"></div>
  <div class="screen view" id="v-mine"></div>
  <div class="page-stack" id="stack"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<script>
const I={
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  receipt:'<path d="M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3 5 3z"/><path d="M8 8h8M8 12h8"/>',
  refund:'<path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>',
  invoice:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  tag:'<path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="17" cy="13.5" r="1.3"/>',
  mega:'<path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M15 8a5 5 0 010 8"/>',
  trend:'<path d="M3 17l6-6 4 4 7-7"/><path d="M14 8h6v6"/>',
  alert:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 18h.01"/>',
  shieldcheck:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
  truck:'<rect x="2" y="7" width="12" height="9" rx="1"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
  ticket:'<path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H6a2 2 0 01-2-2v-3a2 2 0 000-4V7z"/>',
  sign:'<path d="M4 17l4 1 10-10a2 2 0 00-3-3L5 15z"/>',
  swap:'<path d="M7 4L3 8l4 4"/><path d="M3 8h13a4 4 0 014 4"/><path d="M17 20l4-4-4-4"/><path d="M21 16H8a4 4 0 01-4-4"/>',
  progress:'<circle cx="12" cy="12" r="9"/><path d="M12 12V7M12 12l4 2"/>',
  home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/>',
  bell:'<path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', back:'<path d="M15 6l-6 6 6 6"/>',
  leaf:'<path d="M5 19C4 12 9 5 20 4c0 11-7 16-14 15z"/><path d="M5 19c2-5 6-8 10-9"/>',
  printer:'<path d="M7 9V4h10v5M7 18H5a1 1 0 01-1-1v-6a2 2 0 012-2h12a2 2 0 012 2v6a1 1 0 01-1 1h-2"/><path d="M7 14h10v6H7z"/>',
};
const svg=(k,x='')=>`<svg viewBox="0 0 24 24" ${x}>${I[k]}</svg>`;
const TILES=[
  {k:'goods',l:'商品管理',ic:'box',bg:'#D1FAE5',st:'var(--emerald-2)'},
  {k:'stock',l:'库存管理',ic:'layers',bg:'#D1FAE5',st:'var(--emerald-2)'},
  {k:'order',l:'订单管理',ic:'receipt',bg:'#FEF3C7',st:'#B45309'},
  {k:'after',l:'售后管理',ic:'refund',bg:'#FEE2E2',st:'var(--red)',dot:1},
  {k:'invoice',l:'发票管理',ic:'invoice',bg:'#D1FAE5',st:'var(--emerald-2)',badge:'3'},
  {k:'price',l:'价格分析',ic:'tag',bg:'#FEF3C7',st:'#B45309',badge:'50',amber:1},
  {k:'analysis',l:'经营分析',ic:'chart',bg:'#D1FAE5',st:'var(--emerald-2)'},
  {k:'recon',l:'对账单',ic:'receipt',bg:'#FEF3C7',st:'#B45309'},
  {k:'settle',l:'结算单',ic:'wallet',bg:'#FEF3C7',st:'#B45309'},
  {k:'replen',l:'自营补货',ic:'swap',bg:'#FEF3C7',st:'#B45309',badge:'2',amber:1},
  {k:'mkt',l:'营销活动',ic:'mega',bg:'#FEE2E2',st:'var(--red)'},
  {k:'biz',l:'商机推荐',ic:'trend',bg:'#FEF3C7',st:'#B45309',badge:'加流量',amber:1},
  {k:'violate',l:'违规记录',ic:'alert',bg:'#FEE2E2',st:'var(--red)',dot:1},
  {k:'quality',l:'质检管理',ic:'shieldcheck',bg:'#D1FAE5',st:'var(--emerald-2)'},
  {k:'supply',l:'耗材商城',ic:'printer',bg:'#D1FAE5',st:'var(--emerald-2)'},

/* ===== 单据链中央状态 FM.DB（销售订单→备货单 JH→送货单 SH，多仓 N:1）=====
   订单自带 入库仓库(具体DC，上游给)/送达日/送达时段；pickId·deliveryId 由备货单·送货单回写。（一天只送一次货，无波次）

function ordMask(n){return n?n[0]+'***':'—';}                          // 买家昵称脱敏
// 佣金/收入口径(成品件模型)：商品佣金=含税额×服务费率；上门揽收费=件数×每件固定额(与比例无关)；预计收入=含税额−补贴−佣金−揽收费
const SVC_RATE=0.05, PICKUP_PER=0.00, TAX=0.09; // 服务费率 / 每件上门揽收费(固定字段,默认0) / GST 9%
function ordQty(o){return (o.lines||[]).reduce((s,l)=>s+(+l.qty||0),0);}      // 订单总件数
function ordInclAmt(o){return +(o.amt*(1+TAX)).toFixed(2);}                   // 订单含税总额
function ordCommission(o){return +(ordInclAmt(o)*SVC_RATE).toFixed(2);}       // 商品佣金 = 含税额 × 服务费率
function ordPickup(o){return +(ordQty(o)*PICKUP_PER).toFixed(2);}             // 上门揽收费 = 件数 × 每件固定额
function ordIncome(o){return +(ordInclAmt(o)-(o.discount||0)+(o.platSub||0)-ordCommission(o)-ordPickup(o)).toFixed(2);} // 预计收入 = 含税额 − 商家补贴 + 平台补贴 − 佣金 − 揽收费
// BCRS 饮料容器押金（商城三因子模型）：押金 = 平台固定单价 0.10 × 容器数 × 数量；过手项——不计 GST/佣金基数/预计收入
const BCRS_UNIT_PRICE=0.10;                                   // 单容器法规押金 S$0.10（平台级参数，不逐SKU存、不计GST）
function lineBcrs(l){return +((+l.qty||0)*(+l.bcrsContainers||0)*BCRS_UNIT_PRICE).toFixed(2);} // 行押金 = 件数 × 该售卖单位容器数 × 0.10
function ordBcrs(o){return +((o.lines||[]).reduce((s,l)=>s+lineBcrs(l),0)).toFixed(2);} // 订单 BCRS 押金合计
/* 倒计时：data-cd=截止毫秒；全局每秒刷新（退货单72h提货时限 / 申诉24h窗口） */
function fmtRemain(ms){let s=Math.floor((ms-Date.now())/1000);if(!ms||isNaN(s))return '—';if(s<=0)return '已截止';const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60),ss=s%60;const p=n=>(''+n).padStart(2,'0');return (d?d+'天 ':'')+p(h)+':'+p(m)+':'+p(ss);}
function cdSpan(ms){return `<b data-cd="${ms}">${fmtRemain(ms)}</b>`;}
function arriveDueMs(str,hrs){if(!str)return 0;const t=Date.parse(str.replace(' ','T'));return isNaN(t)?0:t+hrs*3600000;}

function ordersOf(pk){return pk.orderIds.map(id=>DB.orders.find(o=>o.id===id)).filter(Boolean);}
function ensurePickOrders(){                                          // 按 送达日 自动成备货单(一天一张·幂等)
  const groups={};
  DB.orders.filter(o=>o.status==='pending'&&!o.pickId).forEach(o=>{(groups[o.deliver]=groups[o.deliver]||[]).push(o);});
  Object.keys(groups).forEach(deliver=>{
    let pk=DB.pickOrders.find(p=>p.deliver===deliver&&p.status!=='已作废'&&p.status!=='已送货');
    if(!pk){DB.pickSeq++;pk={id:'JH2026'+deliver.replace(/-/g,'')+String(DB.pickSeq).padStart(3,'0'),deliver,orderIds:[],status:'待备货'};DB.pickOrders.push(pk);}
    groups[deliver].forEach(o=>{if(!pk.orderIds.includes(o.id)){pk.orderIds.push(o.id);o.pickId=pk.id;}});});
}
function pickAggr(pk){const map={};ordersOf(pk).forEach(o=>o.lines.forEach(l=>{if(!map[l.sku])map[l.sku]={sku:l.sku,name:l.name,unit:l.unit,qty:0,allocs:[]};map[l.sku].qty+=l.qty;map[l.sku].allocs.push({client:o.client,id:o.id,qty:l.qty});}));return Object.values(map);}

function triggerDeliveries(pk){                                       // 贴码全完→按订单入库仓库分组，每仓一张送货单(N:1)
  const byWh={};ordersOf(pk).forEach(o=>{(byWh[o.warehouse]=byWh[o.warehouse]||[]).push(o);});const made=[];
  Object.keys(byWh).forEach(wh=>{const list=byWh[wh];DB.deliverySeq++;const id='SH2026'+pk.deliver.replace(/-/g,'')+String(DB.deliverySeq).padStart(3,'0');
    const labels=[];list.forEach(o=>(o.labels||[]).forEach(l=>labels.push(Object.assign({},l,{orderId:o.id}))));
    DB.deliveries.push({id,pickId:pk.id,warehouse:wh,deliver:pk.deliver,window:(list[0]&&list[0].window)||'',orderIds:list.map(o=>o.id),labels,should:labels.length,status:'待送货'});
    list.forEach(o=>o.deliveryId=id);made.push(id);});
  pk.status='已送货';return made;
}

function ensureDeliveriesFromPrint(){

function deliveryHandover(id){                                        // 仓库WMS扫码标签到齐→送货单交接完成→关联订单转待收货

function cancelOrder(id){const o=DB.orders.find(x=>x.id===id);if(!o||o.status!=='pending')return null;

function renderOrders(){document.getElementById('v-orders').innerHTML=`<div class="ph" style="height:740px"><div class="pic">${svg('receipt')}</div><h3>订单</h3><p>订单模块按 v2 系统铺开中</p><span class="pill">设计系统 · 铺开中</span></div>`;}

// 底部导航去掉「商品」Tab（商品管理仍从工作台「经营工具」进入）
const TABS=[['home','工作台','home'],['orders','订单','receipt'],['mine','我的','user']];
const tb=document.getElementById('tabbar');
tb.innerHTML=TABS.map((t,i)=>`<div class="tab ${i===0?'active':''}" data-v="${t[0]}">${svg(t[2])}<span>${t[1]}</span></div>`).join('');
const views={home:'v-home',orders:'v-orders',goods:'v-goods',mine:'v-mine'};
tb.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{resetStack();
  tb.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');
  Object.values(views).forEach(id=>document.getElementById(id).classList.remove('on'));
  const v=tab.dataset.v;document.getElementById(views[v]).classList.add('on');
  if(v==='mine'){const c=document.getElementById('v-mine');if(window.FM_MOD&&window.FM_MOD.mineInline){c.innerHTML='';window.FM_MOD.mineInline(c);}else renderMine();}
  if(v==='orders'){const c=document.getElementById('v-orders');if(window.FM_MOD&&window.FM_MOD.orderInline){c.innerHTML='';window.FM_MOD.orderInline(c);}else renderOrders();}
  if(v==='goods'&&window.FM_MOD&&window.FM_MOD.goodsInline){document.getElementById('v-goods').innerHTML='';window.FM_MOD.goodsInline(document.getElementById('v-goods'));}});
renderHome();
